<style>
/* Torre da Clareira: estilos da página, da interface e dos controles de toque. */
/* Conto de fadas ao entardecer: tinta azul-noite, ouro dos cabelos, verde da floresta. */
:root {
  --night: #140f22;
  --ink: #1c1630;
  --panel: rgba(28, 22, 48, 0.9);
  --gold: #f2c14e;
  --gold-soft: #f8e1a0;
  --leaf: #6f9a52;
  --text: #f6efe3;
  --muted: #c3b8d8;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-ui: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, #2a1f3d 0%, var(--night) 70%);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#stage {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
  touch-action: none;
}
#frame {
  --u: 1;
  position: relative;
  width: 960px; height: 540px;
  --boost: 1;
  font-size: calc(var(--u) * var(--boost) * 16px);
  border-radius: calc(var(--u) * 10px);
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(242, 193, 78, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5);
  user-select: none;
}
canvas#game { display: block; width: 100%; height: 100%; outline: none; }
kbd {
  display: inline-block;
  min-width: 1.5em;
  padding: 0.05em 0.4em;
  margin: 0 0.12em;
  border-radius: 0.35em;
  background: var(--gold);
  color: var(--ink);
  font: 800 0.72em/1.4 var(--font-ui);
  text-align: center;
}
.sep { display: inline-block; width: 0.25em; height: 0.25em; border-radius: 50%; background: var(--muted); margin: 0 0.5em; vertical-align: middle; opacity: 0.6; }

/* Caixa de diálogo */
.dialog {
  position: absolute; left: 50%; bottom: 4%;
  transform: translateX(-50%);
  width: 62%;
  padding: 0.9em 1.2em 0.8em;
  background: var(--panel);
  border: 1px solid rgba(242, 193, 78, 0.45);
  border-radius: 0.9em;
  box-shadow: 0 0.4em 1.6em rgba(0, 0, 0, 0.4);
  animation: rise 0.25s ease-out;
}
.dialog-name {
  position: absolute; top: -0.85em; left: 1em;
  padding: 0.1em 0.7em;
  font: 700 0.85em/1.4 var(--font-display);
  color: var(--ink);
  background: var(--gold);
  border-radius: 0.6em;
}
.dialog-text { margin: 0.2em 0 0; font-size: 0.95em; line-height: 1.45; min-height: 2.9em; }
.dialog.narrator .dialog-text { font-style: italic; color: var(--gold-soft); }
.dialog-next { text-align: right; font-size: 0.7em; color: var(--muted); transition: opacity 0.2s; }

/* Nome do cômodo */
.toast {
  position: absolute; top: 5%; left: 4%;
  opacity: 0; transform: translateY(-0.4em);
  transition: opacity 0.5s, transform 0.5s;
  text-shadow: 0 0.1em 0.6em rgba(20, 10, 30, 0.8);
  pointer-events: none;
  max-width: 60%;
}
.toast.show { opacity: 1; transform: none; }
.toast-title { font: 700 1.5em/1.1 var(--font-display); color: var(--gold-soft); }
.toast-sub { font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); opacity: 0.85; margin-top: 0.2em; }

/* Aviso curto */
.note {
  position: absolute; top: 5%; left: 50%;
  transform: translate(-50%, -0.5em);
  padding: 0.35em 0.9em;
  background: var(--panel);
  border: 1px solid rgba(242, 193, 78, 0.4);
  border-radius: 999px;
  font-size: 0.78em; font-weight: 700;
  color: var(--gold-soft);
  opacity: 0; transition: opacity 0.35s, transform 0.35s;
  pointer-events: none;
  white-space: nowrap; max-width: 52%; overflow: hidden; text-overflow: ellipsis;
}
.note.show { opacity: 1; transform: translate(-50%, 0); }
/* com o nome da região na tela, o aviso desce um pouco para não cobrir o nome */
#frame:has(.toast.show) .note { top: calc(5% + var(--sat) + 4.6em); }

/* Pétalas */
.hud {
  position: absolute; top: 5%; right: 4%;
  display: flex; align-items: center; gap: 0.4em;
  padding: 0.3em 0.75em 0.3em 0.55em;
  background: rgba(28, 22, 48, 0.6);
  border-radius: 999px;
  font-weight: 800; font-size: 0.8em;
  font-variant-numeric: tabular-nums;
  color: var(--gold-soft);
}
.hud.pop { animation: pop 0.4s ease-out; }
.petal-icon {
  width: 0.8em; height: 1.1em;
  background: var(--gold);
  border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
  box-shadow: 0 0 0.6em rgba(242, 193, 78, 0.7);
}

/* Brilho e missão */
.side {
  position: absolute; top: 12.5%; right: 4%;
  display: grid; justify-items: end; gap: 0.5em;
  max-width: 30%;
  pointer-events: none;
}
.brilho { display: flex; align-items: center; gap: 0.5em; font-size: 0.68em; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-soft); }
.brilho-track { width: 7em; height: 0.55em; border-radius: 999px; background: rgba(28, 22, 48, 0.7); box-shadow: inset 0 0 0 1px rgba(242, 193, 78, 0.35); overflow: hidden; }
.brilho-fill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e8a23a, var(--gold), #fff0b8); box-shadow: 0 0 0.6em rgba(242, 193, 78, 0.8); transition: width 0.15s linear; }
.brilho.low .brilho-fill { background: #c9803a; box-shadow: none; }
.quest {
  padding: 0.55em 0.8em;
  background: rgba(28, 22, 48, 0.7);
  border-right: 2px solid var(--gold);
  border-radius: 0.6em 0 0 0.6em;
  text-align: right;
}
.quest.pop { animation: pop 0.45s ease-out; }
.quest-title { font: 700 0.72em/1.2 var(--font-display); color: var(--gold-soft); }
.quest-text { font-size: 0.7em; line-height: 1.35; color: var(--text); margin-top: 0.15em; }

/* Dica de controles */
.hint {
  position: absolute; left: 50%; bottom: 4%;
  transform: translateX(-50%);
  padding: 0.5em 1em;
  background: rgba(28, 22, 48, 0.75);
  border-radius: 999px;
  font-size: 0.72em;
  white-space: nowrap;
  opacity: 0; transition: opacity 0.6s;
  pointer-events: none;
}
.hint.show { opacity: 1; }
.caption {
  position: absolute; left: 50%; bottom: 3%;
  transform: translateX(-50%);
  padding: 0.4em 1em;
  background: rgba(28, 22, 48, 0.75);
  border-radius: 999px;
  font-size: 0.75em;
  white-space: nowrap;
}

/* Pausa */
.pause {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; padding: max(8px, var(--sat)) 8px max(8px, var(--sab));
  background: rgba(14, 10, 28, 0.6);
  backdrop-filter: blur(3px);
}
.pause-panel {
  min-width: 34%;
  padding: 1.4em 1.6em 1.2em;
  background: var(--panel);
  border: 1px solid rgba(242, 193, 78, 0.4);
  border-radius: 1em;
  text-align: center;
}
.pause-title { font: 700 1.6em/1 var(--font-display); color: var(--gold-soft); margin-bottom: 0.7em; }
.pause-list { display: grid; gap: 0.45em; }
.pause-btn {
  font: 700 0.95em/1 var(--font-ui);
  color: var(--text);
  background: transparent;
  border: 1px solid rgba(195, 184, 216, 0.3);
  border-radius: 0.6em;
  padding: 0.65em 1em;
  cursor: pointer;
}
.pause-btn.active, .pause-btn:focus-visible {
  background: var(--gold); color: var(--ink); border-color: var(--gold); outline: none;
}
.pause-controls { margin-top: 1em; text-align: left; font-size: 0.75em; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 0.45em 1em; margin: 0; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }

/* Título */
.title {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding-left: 7%;
  background: linear-gradient(90deg, rgba(20, 14, 36, 0.78) 0%, rgba(20, 14, 36, 0.35) 45%, rgba(20, 14, 36, 0) 70%);
  transition: opacity 0.7s;
}
.title.leave { opacity: 0; pointer-events: none; }
.title-install { margin-top: 0.9em; max-width: 30em; font-size: 0.7em; line-height: 1.35; color: var(--gold-soft); opacity: 0.8; }
.title-eyebrow { font-size: 0.72em; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-soft); }
.title h1 {
  margin: 0.15em 0 0.25em;
  font: 700 3.4em/0.95 var(--font-display);
  color: var(--text);
  text-wrap: balance;
  max-width: 8em;
  text-shadow: 0 0.06em 0.4em rgba(242, 193, 78, 0.35);
}
.title p { margin: 0 0 1.2em; max-width: 24em; font-size: 0.9em; line-height: 1.5; color: var(--muted); }
.title button {
  align-self: flex-start;
  font: 800 0.95em/1 var(--font-ui);
  color: var(--ink);
  background: var(--gold);
  border: 0;
  border-radius: 999px;
  padding: 0.8em 1.6em;
  cursor: pointer;
  box-shadow: 0 0 1.4em rgba(242, 193, 78, 0.45);
}
.title button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.title-keys { margin-top: 1.2em; font-size: 0.7em; color: var(--muted); }


/* Esconde a interface do jogo atrás do menu inicial */
#frame.on-title .hud, #frame.on-title .side, #frame.on-title .hint, #frame.on-title .note, #frame.on-title .toast { display: none !important; }
.dialog { cursor: pointer; }
/* Escolhas dentro do diálogo */
.dialog-choices { display: flex; flex-wrap: wrap; gap: 0.45em; margin-top: 0.55em; }
.dialog-choices[hidden] { display: none; }
.choice {
  font: 700 0.82em/1.2 var(--font-body, inherit); color: var(--text, #f6ead2);

/* Celular em tela cheia: a imagem vai até as bordas e a interface desvia do notch e da Dynamic Island */
body.full #stage { padding: 0; }
body.full #frame { border-radius: 0; box-shadow: none; }
body.full .toast { left: calc(4% + var(--sal)); top: calc(5% + var(--sat)); }
body.full.touch-mode .toast { left: calc(var(--sal) + 74px); }
body.full.touch-mode .dialog { left: 45%; width: 47%; }
body.full .hud { right: calc(3% + var(--sar)); top: calc(4% + var(--sat)); }
body.full .side { right: calc(3% + var(--sar)); }
body.full .title { padding-left: calc(6% + var(--sal)); }
body.full .pause, body.full .panel { padding-left: var(--sal); padding-right: var(--sar); }
/* Cenas especiais: só a imagem e o diálogo */
#frame.cinema .hud, #frame.cinema .side, #frame.cinema .hint, #frame.cinema .note { display: none !important; }
.is-touch .dialog { bottom: 3%; width: 60%; }
.is-touch .hint { white-space: normal; max-width: 70%; text-align: center; line-height: 1.6; border-radius: 1em; }
/* celular: a dica fica entre o joystick e os botões, sem passar por baixo do Agir */

.is-touch .side { top: 13%; }
.tchip { display: inline-block; padding: 0.05em 0.55em; border-radius: 999px; font: 800 0.85em/1.4 var(--font-ui); color: var(--ink); }
.tchip-jump { background: #f6efe3; } .tchip-interact { background: #7fc1e8; } .tchip-hair { background: var(--gold); } .tchip-magic { background: #c6a2ff; }

/* Tutorial */
.tut {
  position: absolute; top: calc(3% + var(--sat)); left: 50%; transform: translateX(-50%);
  width: min(50%, 31em); box-sizing: border-box; padding: 0.6em 0.9em 0.55em;
  background: rgba(28, 22, 48, 0.88); border: 1px solid rgba(242, 193, 78, 0.55); border-radius: 0.9em;
  font-size: 0.8em; line-height: 1.4; z-index: 4; pointer-events: auto;

.tut-head { display: flex; align-items: baseline; gap: 0.6em; margin-bottom: 0.25em; }
.tut-n { font-size: 0.72em; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tut-t { font: 700 1.05em/1.1 var(--font-display); color: var(--gold-soft); }

.tut-parts span.now { border-color: var(--gold); color: var(--gold-soft); }

.tut-btns { display: flex; flex-wrap: wrap; gap: 0.35em; justify-content: flex-end; margin-top: 0.45em; }
.tut-btns button { font: 800 0.78em/1 var(--font-ui); color: var(--text); background: transparent; border: 1px solid rgba(195, 184, 216, 0.45); border-radius: 999px; padding: 0.55em 0.9em; cursor: pointer; min-height: 34px; }

.touch-zone.tut-hl { border-radius: 1em; }
/* pular cena */
.skip-cs { position: absolute; z-index: 40; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); font: 800 14px Nunito, system-ui, sans-serif; color: #f7efe0; background: rgba(28,22,48,0.82); border: 1px solid rgba(242,193,78,0.6); border-radius: 999px; padding: 9px 16px; cursor: pointer; touch-action: manipulation; }
.skip-cs:hover { background: rgba(48,38,78,0.92); }
.skip-cs .skip-key { margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.14); }
.is-touch .skip-cs .skip-key { display: none; }
.is-touch .skip-cs { padding: 12px 20px; font-size: 15px; }
/* diário */
.diary .diary-count { margin: 0 0 10px; }
.diary-group { margin: 0 0 14px; }
.diary-group h3 { margin: 0 0 6px; font: 700 16px Fraunces, Georgia, serif; color: #f2c14e; display: flex; justify-content: space-between; }
.diary-group h3 span { font: 700 12px Nunito, system-ui, sans-serif; color: #c9bfe0; }
.diary-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.diary-list li { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
.diary-list li b { color: #f7efe0; }
.diary-list li span { color: #d8d0e8; font-size: 13px; line-height: 1.4; }
.diary-list li.new { outline: 1px solid rgba(242,193,78,0.7); }
.diary-list li.new b::after { content: ' nova'; color: #f2c14e; font-size: 11px; margin-left: 4px; }
.diary-empty { color: #9a90b0; font-size: 13px; margin: 0; }
#frame.tut-on .side .quest, #frame.tut-on .caption, #frame.tut-on .hint, #frame.tut-on .toast { display: none !important; }
#frame.tut-on .note { top: auto; bottom: calc(5% + env(safe-area-inset-bottom, 0px)); }
.is-touch .tut { width: 46%; font-size: 0.74em; padding: 0.5em 0.75em; }
.is-touch .tut-btns button { min-height: 36px; padding: 0.6em 0.8em; }
.tut-choose { flex-direction: column; }
.tut-choose button { padding: 0.9em; }
.is-touch .menu button[data-act="tutorial"] { }

/* Menu inicial */
.menu { display: grid; gap: 0.5em; justify-items: start; }
.menu button {
  min-width: 11em; text-align: left;
  font: 800 0.95em/1 var(--font-ui);
  color: var(--text); background: rgba(28, 22, 48, 0.55);
  border: 1px solid rgba(242, 193, 78, 0.35); border-radius: 999px;

.menu button:disabled { opacity: 0.4; cursor: default; }

.panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: max(8px, var(--sat)) 8px max(8px, var(--sab)); background: rgba(14, 10, 28, 0.7); backdrop-filter: blur(3px); z-index: 5; }
.panel-box { position: relative; box-sizing: border-box; width: min(78%, 34em); max-height: 100%; min-height: 0; display: flex; flex-direction: column; padding: 1.1em 1.4em; background: var(--panel); border: 1px solid rgba(242, 193, 78, 0.4); border-radius: 1em; }
.panel-title { font: 700 1.4em/1 var(--font-display); color: var(--gold-soft); margin-bottom: 0.6em; }
.panel-body { overflow-y: auto; touch-action: pan-y; font-size: 0.85em; min-height: 0; flex: 1 1 auto; }
.panel-x { position: absolute; top: 0.55em; right: 0.6em; width: 2.4em; height: 2.4em; min-width: 40px; min-height: 40px; border-radius: 50%; border: 1px solid rgba(242, 193, 78, 0.5); background: rgba(14, 10, 28, 0.6); color: var(--gold-soft); font: 800 1.1em/1 var(--font-ui); cursor: pointer; display: grid; place-items: center; padding: 0; }
.panel-title { padding-right: 2.2em; }

.panel-foot button { min-height: 40px; }
.panel-foot .panel-cancel, .panel-foot .panel-save { font: 800 0.9em/1 var(--font-ui); border-radius: 999px; padding: 0.7em 1.4em; cursor: pointer; }
.panel-foot .panel-cancel { color: var(--text); background: transparent; border: 1px solid rgba(195, 184, 216, 0.5); }
.panel-foot .panel-save { color: var(--ink); background: #c9a8ec; border: 0; }
.panel-back { margin-top: 0; font: 800 0.9em/1 var(--font-ui); color: var(--ink); background: var(--gold); border: 0; border-radius: 999px; padding: 0.7em 1.4em; cursor: pointer; }
.cfg { margin-bottom: 0.8em; }
.cfg-label { font-weight: 700; margin-bottom: 0.35em; color: var(--muted); }
.cfg-seg { display: flex; flex-wrap: wrap; gap: 0.35em; }
.cfg-seg button { flex: 1 1 auto; font: 700 0.95em/1 var(--font-ui); color: var(--text); background: transparent; border: 1px solid rgba(195, 184, 216, 0.35); border-radius: 0.6em; padding: 0.75em 0.8em; cursor: pointer; }
.cfg-seg button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.cfg-seg button:disabled { opacity: 0.4; cursor: default; }
.cfg-seg button.danger { background: #b5485a; border-color: #b5485a; color: #fff; }
.panel-body:has(> .cfg) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.4em; align-items: start; }
.confirm-text { max-width: 30em; line-height: 1.5; margin: 0 0 1.2em; }
.credits p { margin: 0 0 0.6em; line-height: 1.5; }
.credits .muted { color: var(--muted); }
.pause-controls { max-height: 14em; overflow-y: auto; touch-action: pan-y; }
.pause-btn.disabled { opacity: 0.4; }
.pause-panel { max-height: 100%; overflow-y: auto; box-sizing: border-box; }
.is-touch .pause-list { grid-template-columns: 1fr 1fr; }
.is-touch .pause-panel { min-width: 56%; padding: 0.9em 1.2em; }
.is-touch .pause-title { font-size: 1.3em; margin-bottom: 0.5em; }
.is-touch .pause-controls { max-height: 9.5em; }

/* Lista de missões */
.qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6em; }
.qlist li { padding: 0.5em 0.7em; border-left: 2px solid var(--gold); background: rgba(255, 255, 255, 0.04); border-radius: 0 0.5em 0.5em 0; }
.qlist li.done { border-color: var(--muted); opacity: 0.7; }
.qhead { display: flex; gap: 0.5em; align-items: baseline; flex-wrap: wrap; }
.qkind { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.qname { font: 700 1em/1.2 var(--font-display); color: var(--gold-soft); }
.qstate { margin-left: auto; font-size: 0.8em; color: var(--muted); }
.qdesc { margin-top: 0.2em; color: var(--muted); }
.qobj { margin-top: 0.25em; }
.qobj::before { content: '› '; color: var(--gold); }
.qrew { margin-top: 0.2em; font-size: 0.85em; color: var(--gold-soft); }
.qlist-empty { color: var(--muted); }

/* Gire o celular */
.rotate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; align-content: center; gap: 1em; background: var(--night); color: var(--gold-soft); font: 700 1.1rem/1.4 var(--font-ui); text-align: center; padding: 2em; }

  background: radial-gradient(circle, rgba(28, 22, 48, 0.25), rgba(28, 22, 48, 0.5));

  position: absolute; left: 50%; top: 50%;
  width: calc(52px * var(--tsize)); height: calc(52px * var(--tsize));

  border: 2px solid rgba(255, 255, 255, 0.35);
  color: var(--ink);
  font: 800 calc(10.5px * var(--tsize))/1 var(--font-ui);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);

}
.tbtn svg { width: 42%; height: 42%; }
.tbtn.pressed { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.35), 0 0 22px rgba(242, 193, 78, 0.6); }
.tbtn.flash { animation: tflash 0.25s ease-out; }
.tbtn-jump { right: 0; bottom: 0; width: calc(84px * var(--tsize)); height: calc(84px * var(--tsize)); background: #f6efe3; }
.tbtn-interact { right: calc(96px * var(--tsize)); bottom: calc(2px * var(--tsize)); background: #7fc1e8; }
.tbtn-hair { right: calc(6px * var(--tsize)); bottom: calc(96px * var(--tsize)); background: var(--gold); }
.tbtn-magic { right: calc(96px * var(--tsize)); bottom: calc(92px * var(--tsize)); background: #c6a2ff; width: calc(62px * var(--tsize)); height: calc(62px * var(--tsize)); }
.tbtn-pause {
  position: absolute; left: calc(var(--sal) + 12px); top: calc(var(--sat) + 10px);
  width: 44px; height: 44px; border-radius: 50%; pointer-events: auto; touch-action: none;
  display: grid; place-items: center; padding: 0;
  background: rgba(28, 22, 48, 0.65); color: var(--gold-soft); border: 1px solid rgba(242, 193, 78, 0.4);
}
.tbtn-pause svg { width: 22px; height: 22px; }
.tbtn-braid {
  position: absolute; left: calc(var(--sal) + 12px); top: calc(var(--sat) + 62px);
  width: 44px; height: 44px; border-radius: 50%; pointer-events: auto; touch-action: none;
  display: grid; place-items: center; padding: 0;
  background: rgba(28, 22, 48, 0.65); color: var(--gold-soft); border: 1px solid rgba(242, 193, 78, 0.4);
}

}

.cfg-sec { font-weight: 800; font-size: 1.05em; margin: 0.9em 0 0.4em; padding-bottom: 0.2em; border-bottom: 1px solid rgba(255,255,255,0.15); }

.cfg-sub { font-weight: 700; margin: 0 0 0.3em; opacity: 0.85; }

<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" tabindex="0" aria-label="Jogo: Torre da Clareira"></canvas>
    <div class="title" id="title">
      <div class="title-eyebrow">Versão 1.1.0 · o final verdadeiro</div>
      <h1>Torre da Clareira</h1>
      <p>Lira nunca saiu da torre. Hoje ela está sozinha, e cada canto guarda uma pista sobre quem ela é.</p>
      <div class="menu" id="menu">
        <button type="button" data-act="jogar" id="start">Jogar</button>
        <button type="button" data-act="continuar">Continuar</button>
        <button type="button" data-act="tutorial">Tutorial</button>
        <button type="button" data-act="config">Configurações</button>
        <button type="button" data-act="creditos">Créditos</button>
      </div>
      <div class="title-keys">Teclado: <kbd>↑</kbd><kbd>↓</kbd> escolher <span class="sep"></span> <kbd>Enter</kbd> confirmar</div>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="panel-box" role="dialog" aria-modal="true">
        <button type="button" class="panel-x" aria-label="Fechar">✕</button>
        <div class="panel-title"></div>
        <div class="panel-body"></div>
        <div class="panel-foot">
          <button type="button" class="panel-cancel" hidden>Cancelar</button>
          <button type="button" class="panel-save" hidden>Salvar</button>
          <button type="button" class="panel-back">Voltar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="rotate" id="rotate" hidden>
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="38" r="2" fill="currentColor"/></svg>
  <div>Gire o celular para jogar na horizontal</div>
</div>

<script>
"use strict";
const __m = Object.create(null);

// ===== js/engine/input.js =====
__m["js/engine/input.js"] = (function () {
// Entrada do teclado. Toda tecla do jogo passa por esta tabela,
// para que uma tela de configurar teclas possa ser criada depois.
const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'],
  right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'],
  down: ['ArrowDown', 'KeyS'],
  jump: ['Space'],
  run: ['ShiftLeft', 'ShiftRight'],
  interact: ['KeyE', 'Enter'],
  hair: ['KeyQ', 'KeyK'],
  light: ['KeyF'],
  heal: ['KeyR'],
  braid: ['KeyT'],
  pause: ['Escape', 'KeyP'],
  confirm: ['KeyE', 'Enter', 'Space'],
};

class Input {
  constructor(target = window) {
    this.down = new Set();
    this.pressed = new Set();
    this.released = new Set();
    const used = new Set(Object.values(KEYMAP).flat());
    target.addEventListener('keydown', (e) => {
      if (used.has(e.code)) e.preventDefault();
      if (!this.down.has(e.code)) this.pressed.add(e.code);
      this.down.add(e.code);
    });
    target.addEventListener('keyup', (e) => {
      this.down.delete(e.code);
      this.released.add(e.code);
    });
    window.addEventListener('blur', () => { this.down.clear(); this.vDown.clear(); });
    // ações virtuais (controles de toque): usam o nome da ação, não a tecla
    this.vDown = new Set();
    this.vPressed = new Set();
    this.vReleased = new Set();
    this.lastKeyboard = 0;
    target.addEventListener('keydown', () => { this.lastKeyboard = performance.now(); });
  }
  press(action) {
    if (!this.vDown.has(action)) this.vPressed.add(action);
    this.vDown.add(action);
  }
  release(action) {
    if (this.vDown.delete(action)) this.vReleased.add(action);

      this.fx.emit({ x: src.x, y: src.y, vx: (tx - src.x) * 1.6, vy: (ty - src.y) * 1.6, size: 1.6, life: 0.6, color: '#ffe7a0', star: true });
    }
    if (r.progress >= 1) {
      r.done = true;
      g.state.brilho = Math.max(0, g.state.brilho - r.cost);
      p.channeling = false;
      this.sparkle(r.x + r.w / 2, r.y + r.h / 2, 26);
      g.camera.shake(2, 0.2);
      r.onDone(this, r);
    }
  }

  // ---------- Pedras que podem ser empurradas ----------
  pushableAt(p, dir) {
    return this.pushables.find((rk) =>
      Math.abs(dir > 0 ? rk.x - (p.x + p.w) : p.x - (rk.x + rk.w)) < 2 &&
      p.feet > rk.y + 4 && p.y < rk.y + rk.h) || null;
  }

  updatePushables(dt) {
    for (const rk of this.pushables) {
      rk.vx = rk.pushDir * MOVE.push;
      rk.vy = Math.min(900, (rk.vy || 0) + 2000 * dt);
      const others = this.solids.filter((s) => s !== rk);
      const before = rk.x;
      moveBody(rk, others, dt, {});
      rk.roll = (rk.roll || 0) + (rk.x - before) / (rk.w / 2);
      if (Math.abs(rk.x - before) > 0.1 && Math.random() < 0.3) this.dust(rk.x + (rk.pushDir > 0 ? rk.w : 0), rk.y + rk.h, 1);
    }
  }

  anchorFlash(a) {
    a.flash = 1;
    this.sparkle(a.x, a.y, 12);
  }

  findObject() {
    const p = this.player;
    let best = null, bd = Infinity;
    for (const o of this.objects) {
      if (o.hidden) continue;
      const z = o.zone || { x0: o.x - 22, x1: o.x + o.w + 22, y0: o.y - 10, y1: o.y + o.h + 72 };
      if (p.cx < z.x0 || p.cx > z.x1 || p.feet < z.y0 || p.feet > z.y1) continue;
      const dx = (o.x + o.w / 2) - p.cx;
      // pessoas têm prioridade; quem está acompanhando a Lira fica por último; o que está à frente dela ganha
      let d = Math.abs(dx) - (o.npc ? 40 : 0) + (o.npc?.follow ? 90 : 0) + (Math.sign(dx) === -p.facing && Math.abs(dx) > 14 ? 18 : 0);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }

  findAnchor() {
    const p = this.player, hx = p.cx, hy = p.y;
    let best = null, bd = Infinity;
    for (const h of this.hooks) {
      if (h.hidden || h.used) continue;
      if (h.kind === 'reach') {
        if (!p.onGround) continue;
      } else {
        if (h.y > hy + (h.kind === 'swing' ? 40 : 0)) continue;
        if (h.landing && Math.abs(p.feet - h.landing.y) < 8 && Math.abs(p.cx - h.landing.x) < 110) continue;
      }
      const d = Math.hypot(h.x - hx, h.y - hy);
      // alcance: cresce junto com o cabelo (48 elos em vez de 38); a corda do Caio, depois do corte, mantém o alcance antigo
      const range = h.range * (p.hair.short ? 1 : 48 / 38);
      if (d > range) continue;
      if (h.kind !== 'swing' && Math.abs(h.x - hx) > range * 0.75) continue;
      const score = d - (h.prio || 0);   // prio: alvos que devem ganhar de um gancho próximo (ex.: pedras-de-eco)
      if (score < bd) { bd = score; best = h; }
    }
    return best;
  }

  // ---------- Efeitos ----------
  dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      this.fx.emit({ x: x + (Math.random() - 0.5) * 16, y: y - 2, vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 40, g: 60, size: 1.5 + Math.random() * 2, life: 0.5 + Math.random() * 0.3, color: '#e9d3b6', alpha: 0.7 });
    }
  }
  sparkle(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 90;
      this.fx.emit({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -10, size: 1.4 + Math.random() * 1.6, life: 0.6 + Math.random() * 0.5, color: '#ffe7a0', star: true });
    }
  }
  spawnMote(anywhere = false) {
    if (!this.shafts.length) return;
    const s = this.shafts[(Math.random() * this.shafts.length) | 0];
    const k = Math.random();
    this.motes.push({
      x: s.x1 + (s.x2 - s.x1) * k + (Math.random() - 0.5) * s.w2,
      y: s.y1 + (s.y2 - s.y1) * (anywhere ? k : 0.05),
      vx: (Math.random() - 0.5) * 6, vy: 3 + Math.random() * 6,
      life: 6 + Math.random() * 6, age: anywhere ? Math.random() * 6 : 0, s,
    });
  }
  updateMotes(dt) {
    for (const m of this.motes) {
      m.age += dt;
      m.x += m.vx * dt + Math.sin(this.t + m.y * 0.05) * 3 * dt;
      m.y += m.vy * dt;
    }
    this.motes = this.motes.filter((m) => m.age < m.life);
    while (this.motes.length < this.maxMotes && this.shafts.length) this.spawnMote();
  }

  // ---------- Vista pela janela / luneta ----------
  openView(kind, opts = {}) {
    this.view = { kind, pan: opts.pan ?? 0, min: opts.min ?? -700, max: opts.max ?? 700, t: 0, full: 0, closing: false, opts, said: false };
    this.game.ui.setCaption(null);
  }
  closeView() {
    if (!this.view) return;
    this.view.closing = true;
    this.game.ui.setCaption(null);
  }
  updateView(dt) {
    const v = this.view, g = this.game, inp = g.input;
    v.t += dt;
    v.full = Math.max(0, Math.min(1, v.full + (v.closing ? -dt : dt) / 0.45));
    if (v.closing) {
      if (v.full <= 0) { this.view = null; v.opts.onClose?.(); }
      return;
    }
    if (v.full < 1) return;
    if (!v.said) {
      v.said = true;
      if (v.opts.lines) this.say(v.opts.lines);
    }
    if (g.ui.dialogOpen) return;
    g.ui.setCaption('<kbd>←</kbd><kbd>→</kbd> olhar <span class="sep"></span> <kbd>E</kbd> voltar');
    const dir = (inp.is('right') ? 1 : 0) - (inp.is('left') ? 1 : 0);
    v.pan = Math.max(v.min, Math.min(v.max, v.pan + dir * (v.kind === 'luneta' ? 260 : 340) * dt));
    const lines = v.opts.poi?.(v, this);
    if (lines) { g.ui.setCaption(null); this.say(lines); return; }
    if (inp.hit('interact') || inp.hit('pause') || inp.hit('jump')) {
      inp.consume('interact'); inp.consume('pause'); inp.consume('jump');
      this.closeView();
    }
  }

  renderView(ctx) {
    const v = this.view, W = this.game.view.w, H = 540;
    if (v.kind === 'luneta') {
      ctx.fillStyle = '#0d0a16';
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 232, 0, Math.PI * 2); ctx.clip();
      drawForest(ctx, W / 2 - 240, H / 2 - 240, 480, 480, v.pan, this.t, { zoom: 2.6, vfocus: 0.45, factors: [0.5, 1, 1.15, 1.3, 1.5] });
      const vg = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 234);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,6,20,0.7)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      ctx.restore();
      ctx.strokeStyle = '#b98a3e'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 236, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#e2bd6a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 241, 0, Math.PI * 2); ctx.stroke();
      return;
    }
    drawForest(ctx, 0, 0, W, H, v.pan, this.t, { zoom: 1.15, vfocus: 0.9 });
    // moldura da janela em primeiro plano
    ctx.save();
    ctx.fillStyle = '#4a2e22';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.moveTo(80, H);
    ctx.lineTo(80, 200);
    ctx.quadraticCurveTo(80, 20, W / 2, 20);
    ctx.quadraticCurveTo(W - 80, 20, W - 80, 200);
    ctx.lineTo(W - 80, H);
    ctx.closePath();
    ctx.fill('evenodd');
    ctx.strokeStyle = '#6e4630'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(W / 2, 22); ctx.lineTo(W / 2, H); ctx.moveTo(86, 300); ctx.lineTo(W - 86, 300); ctx.stroke();
    ctx.fillStyle = '#7a5236';
    ctx.fillRect(40, H - 40, W - 80, 40);
    // hera na moldura
    ctx.fillStyle = '#5d8a4a';
    for (let i = 0; i < 18; i++) {
      const a = (i / 17) * Math.PI;
      const lx = W / 2 - Math.cos(a) * 395, ly = 200 - Math.sin(a) * 175;
      ctx.beginPath(); ctx.ellipse(lx, ly, 9, 5, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ---------- Desenho ----------
  renderStatic() {
    const g = this.game;
    const res = Math.min(2, Math.max(1, g.pixelScale || 1));
    const c = document.createElement('canvas');
    c.width = Math.ceil(this.width * res);
    c.height = Math.ceil(this.height * res);
    const x = c.getContext('2d');
    x.scale(res, res);
    this.drawStatic(x);
    return c;
  }

  drawWindows(ctx) {
    const cam = this.game.camera;
    for (const w of this.windows) {
      ctx.save();
      ctx.beginPath();
      if (w.round) ctx.arc(w.x + w.w / 2, w.y + w.h / 2, w.w / 2, 0, Math.PI * 2);
      else {
        const r = w.w / 2;
        ctx.moveTo(w.x, w.y + w.h);
        ctx.lineTo(w.x, w.y + r);
        ctx.arc(w.x + r, w.y + r, r, Math.PI, 0);
        ctx.lineTo(w.x + w.w, w.y + w.h);
        ctx.closePath();
      }
      ctx.clip();
      if (w.draw) w.draw(ctx, this);
      else drawForest(ctx, w.x, w.y, w.w, w.h, (cam.x - (w.x + w.w / 2)) * 0.9 + (w.pan || 0), this.t, { zoom: w.zoom || 2.2, vfocus: w.vfocus ?? 0.72 });
      ctx.restore();
    }
  }

  drawShafts(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.shafts) {
      const fl = 0.85 + Math.sin(this.t * 0.7 + s.x1) * 0.15;
      const gr = ctx.createLinearGradient(s.x1, s.y1, s.x2, s.y2);
      gr.addColorStop(0, `rgba(255,214,150,${0.16 * fl * (s.a ?? 1)})`);
      gr.addColorStop(1, 'rgba(255,200,140,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(s.x1 - s.w1 / 2, s.y1); ctx.lineTo(s.x1 + s.w1 / 2, s.y1);
      ctx.lineTo(s.x2 + s.w2 / 2, s.y2); ctx.lineTo(s.x2 - s.w2 / 2, s.y2);
      ctx.closePath(); ctx.fill();
    }
    for (const m of this.motes) {
      const k = Math.sin((m.age / m.life) * Math.PI);
      ctx.fillStyle = `rgba(255,236,190,${0.55 * k})`;
      ctx.fillRect(m.x, m.y, 1.6, 1.6);
    }
    const cm = this.game.camera;
    for (const gl of this.glows) {
      if (gl.x + gl.r < cm.left || gl.x - gl.r > cm.right || gl.y + gl.r < cm.top || gl.y - gl.r > cm.bottom) continue;
      const f = gl.flicker ? 0.85 + Math.sin(this.t * 11 + gl.x) * 0.06 + Math.sin(this.t * 7.3) * 0.06 : 1;
      const r = gl.r * f;
      const rg = ctx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, r);
      rg.addColorStop(0, gl.color || 'rgba(255,190,110,0.35)');
      rg.addColorStop(1, 'rgba(255,170,90,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(gl.x - r, gl.y - r, r * 2, r * 2);
    }
    ctx.restore();
  }

  drawHooks(ctx) {
    for (const h of this.hooks) {
      if (h.hidden) continue;
      const on = this.focusHook === h;
      const pulse = 0.5 + Math.sin(this.t * 6) * 0.5;
      ctx.save();
      if (h.kind === 'swing') {
        // nó dourado num galho: brilha quando está ao alcance
        const r = 8;
        ctx.globalCompositeOperation = 'lighter';
        const gr = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, on ? 34 : 18);
        gr.addColorStop(0, `rgba(255,220,130,${on ? 0.55 + pulse * 0.25 : 0.25})`);
        gr.addColorStop(1, 'rgba(255,210,120,0)');
        ctx.fillStyle = gr; ctx.fillRect(h.x - 36, h.y - 36, 72, 72);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = on ? '#f6c24f' : '#c9a24a';
        ctx.beginPath(); ctx.arc(h.x, h.y, r * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = on ? '#fff0b8' : '#8a6a3a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, Math.PI * 2); ctx.stroke();
        if (on) {
          ctx.setLineDash([3, 4]); ctx.lineDashOffset = -this.t * 20;
          ctx.strokeStyle = 'rgba(255,230,160,0.8)';
          ctx.beginPath(); ctx.arc(h.x, h.y, r + 6 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
        }
      } else if (h.kind === 'reach') {
        if (on) {
          ctx.strokeStyle = `rgba(255,230,160,${0.6 + pulse * 0.4})`;
          ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -this.t * 18;
          ctx.beginPath(); ctx.arc(h.x, h.y, 16 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
        }
        h.draw?.(ctx, this, h, on);
      } else {
        ctx.strokeStyle = '#4b4550'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(h.x, h.y - 14); ctx.lineTo(h.x, h.y - 6); ctx.stroke();
        if (on) { ctx.shadowColor = 'rgba(255,214,120,0.95)'; ctx.shadowBlur = 12 + pulse * 8; }
        ctx.strokeStyle = on ? '#f2c14e' : '#6c6470'; ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.arc(h.x, h.y, 7, 0, Math.PI * 2); ctx.stroke();
      }
      if (h.flash > 0) {
        ctx.setLineDash([]);
        ctx.strokeStyle = `rgba(255,240,190,${h.flash})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, 10 + (1 - h.flash) * 30, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  drawRestores(ctx) {
    for (const r of this.restores) {
      if (r.done) continue;
      const on = this.focusRestore === r;
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      if (on || r.progress > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(r.w, r.h) * 0.7);
        gr.addColorStop(0, `rgba(255,220,140,${0.12 + r.progress * 0.35})`);
        gr.addColorStop(1, 'rgba(255,210,120,0)');
        ctx.fillStyle = gr; ctx.fillRect(r.x - 40, r.y - 40, r.w + 80, r.h + 80);
        ctx.restore();
      }
      if (r.progress > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(28,22,48,0.7)'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(cx, r.y - 26, 12, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(cx, r.y - 26, 12, -Math.PI / 2, -Math.PI / 2 + r.progress * Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }
  }

  drawPickups(ctx) {
    for (const pk of this.pickups) {
      const y = pk.y + Math.sin(pk.t * 2.4) * 3;
      const rg = ctx.createRadialGradient(pk.x, y, 0, pk.x, y, 18);
      rg.addColorStop(0, 'rgba(255,230,150,0.55)'); rg.addColorStop(1, 'rgba(255,210,120,0)');
      ctx.fillStyle = rg; ctx.fillRect(pk.x - 18, y - 18, 36, 36);
      ctx.save();
      ctx.translate(pk.x, y);
      ctx.rotate(Math.sin(pk.t * 1.7) * 0.5);
      ctx.scale(Math.cos(pk.t * 2) * 0.35 + 0.75, 1);
      ctx.fillStyle = '#f6c24f';
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.quadraticCurveTo(7, -2, 0, 8); ctx.quadraticCurveTo(-7, -2, 0, -8); ctx.fill();
      ctx.strokeStyle = '#fff0b8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke();
      ctx.restore();
    }
  }

  drawPrompt(ctx, x, y, key, label) {
    const bobY = y + Math.sin(this.t * 3) * 2;
    if (this.game.ui.touch) return this.drawTouchPrompt(ctx, x, bobY, key, label);
    ctx.save();
    ctx.font = '700 11px Nunito, system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    const w = tw + 34, h = 22;
    ctx.fillStyle = 'rgba(28,22,48,0.82)';
    roundRect(ctx, x - w / 2, bobY - h, w, h, 11);
    ctx.fill();
    ctx.strokeStyle = 'rgba(242,193,78,0.6)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#f2c14e';
    ctx.beginPath(); ctx.arc(x - w / 2 + 12, bobY - h / 2, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1c1630';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(key, x - w / 2 + 12, bobY - h / 2 + 0.5);
    ctx.fillStyle = '#f7efe0';
    ctx.textAlign = 'left';
    ctx.fillText(label, x - w / 2 + 24, bobY - h / 2 + 0.5);
    ctx.beginPath();
    ctx.fillStyle = 'rgba(28,22,48,0.82)';
    ctx.moveTo(x - 5, bobY); ctx.lineTo(x + 5, bobY); ctx.lineTo(x, bobY + 5); ctx.fill();
    ctx.restore();
  }

  render(ctx) {
    const v = this.view;
    if (v && v.full >= 1) { this.renderView(ctx); return; }
    const cam = this.game.camera;
    ctx.fillStyle = '#120c1c'; ctx.fillRect(0, 0, this.game.view.w, 540);   // fora do mundo (telas largas)
    this.drawBackground?.(ctx);
    ctx.save();
    cam.apply(ctx);
    this.drawWindows(ctx);
    this.drawStaticLayer(ctx);
    this.drawBack?.(ctx);
    if (this.extraBack) for (const f of this.extraBack) f(ctx);
    for (const o of this.objects) o.draw?.(ctx, this, o, this.focusObj === o);
    if (this.focusObj && !this.view) {
      const o = this.focusObj, gx = o.x + o.w / 2, gy = o.y + o.h / 2, r = Math.max(o.w, o.h) * 0.7 + 10;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
      rg.addColorStop(0, `rgba(255,220,140,${0.12 + Math.sin(this.t * 4) * 0.04})`);
      rg.addColorStop(1, 'rgba(255,210,120,0)');
      ctx.fillStyle = rg; ctx.fillRect(gx - r, gy - r, r * 2, r * 2);
      ctx.restore();
    }
    this.drawHooks(ctx);
    this.drawRestores(ctx);
    this.drawPickups(ctx);
    for (const cr of this.critters) cr.draw(ctx, this);
    this.player.draw(ctx);
    this.fx.draw(ctx);
    this.drawFront?.(ctx);
    if (this.extraFront) for (const f of this.extraFront) f(ctx);
    this.drawShafts(ctx);
    if (!this.game.ui.dialogOpen && !v) {
      const o = this.focusObj;
      if (o) {
        const px = o.prompt?.x ?? o.x + o.w / 2, py = o.prompt?.y ?? o.y - 8;
        this.drawPrompt(ctx, px, py, 'E', o.label);
      }
      const h = this.focusHook;
      if (h) this.drawPrompt(ctx, h.x, h.y - 18, this.player.braided ? 'T' : 'Q', this.player.braided ? 'Desfaça a trança' : (h.label || 'Laço'));
      const r = this.focusRestore;
      if (r && !r.progress) this.drawPrompt(ctx, r.x + r.w / 2, r.y - 10, 'R', (r.label || 'Restaurar') + ' (segure)');
    }
    ctx.restore();
    this.drawScreen(ctx);
    if (this.extraScreen) for (const f of this.extraScreen) f(ctx);
    this.drawMagicLight(ctx);
    if (v) {
      ctx.save();
      ctx.globalAlpha = v.full;
      this.renderView(ctx);
      ctx.restore();
    }
  }

  // no celular, o balão mostra a cor e o nome do botão em vez da letra
  drawTouchPrompt(ctx, x, bobY, key, label) {
    const B = { E: ['#7fc1e8', 'Agir'], Q: ['#f2c14e', 'Cabelos'], T: ['#b48ee0', 'Trança'], R: ['#c6a2ff', 'Magia'], F: ['#c6a2ff', 'Magia'] }[key] || ['#f2c14e', key];
    label = label.replace(' (segure)', '');
    ctx.save();
    ctx.font = '800 12px Nunito, system-ui, sans-serif';
    const bw = ctx.measureText(B[1]).width + 12;
    ctx.font = '700 12px Nunito, system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    const w = tw + bw + 18, h = 25;
    ctx.fillStyle = 'rgba(28,22,48,0.86)';
    roundRect(ctx, x - w / 2, bobY - h, w, h, 12); ctx.fill();

  for (let ry = y, row = 0; ry < y + h; ry += rowH, row++) {
    let rx = x - (row % 2 ? 30 : 0) - rnd() * 20;
    while (rx < x + w) {
      const sw = 46 + rnd() * 44;
      const amt = (rnd() - 0.5) * 0.12;
      g.fillStyle = shade(base, amt);
      const sx = Math.max(x, rx + 2), ex = Math.min(x + w, rx + sw - 2);
      if (ex > sx) {
        roundRect(g, sx, ry + 2, ex - sx, Math.min(rowH - 4, y + h - ry - 2), 5);
        g.fill();
        g.fillStyle = 'rgba(255,240,220,0.12)';
        g.fillRect(sx + 3, ry + 3, ex - sx - 6, 2);
      }
      rx += sw;
    }
  }
}

function planks(g, x, y, w, thick) {
  g.fillStyle = PAL.plank;
  g.fillRect(x, y, w, thick);
  g.fillStyle = PAL.woodLight;
  g.fillRect(x, y, w, 3);
  g.fillStyle = PAL.plankDark;
  g.fillRect(x, y + thick - 6, w, 6);
  g.strokeStyle = 'rgba(60,35,20,0.45)';
  g.lineWidth = 1;
  for (let px = x + 40; px < x + w; px += 64) {
    g.beginPath(); g.moveTo(px, y + 3); g.lineTo(px, y + thick - 6); g.stroke();
  }
  // vigas por baixo
  g.fillStyle = PAL.woodDark;
  for (let px = x + 30; px < x + w - 20; px += 180) g.fillRect(px, y + thick, 22, 10);
}

function sunSymbol(g, x, y, r, color = PAL.gold, alpha = 1) {
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y);
  g.fillStyle = color;
  g.strokeStyle = color;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const L = i % 2 ? r * 1.45 : r * 1.85;
    g.lineWidth = Math.max(1, r * (i % 2 ? 0.14 : 0.2));
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(Math.cos(a) * r * 1.15, Math.sin(a) * r * 1.15);
    const ca = a + 0.18;
    g.quadraticCurveTo(Math.cos(ca) * r * 1.35, Math.sin(ca) * r * 1.35, Math.cos(a) * L, Math.sin(a) * L);
    g.stroke();
  }
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.globalAlpha = alpha * 0.9;
  g.fillStyle = shade(color.startsWith('#') ? color : '#f2c14e', -0.25);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    g.beginPath(); g.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.12, 0, Math.PI * 2); g.fill();
  }
  g.beginPath(); g.arc(0, 0, r * 0.22, 0, Math.PI * 2); g.fill();
  g.restore();
}

function star(g, x, y, r, color, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i / 10) * Math.PI * 2;
    const rr = i % 2 ? r * 0.45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill(); g.restore();
}

function flower(g, x, y, r, petal, center) {
  g.fillStyle = petal;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    g.beginPath(); g.ellipse(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.8, r * 0.55, a, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = center;
  g.beginPath(); g.arc(x, y, r * 0.55, 0, Math.PI * 2); g.fill();
}

// Hera pintada pela Lira: um caminho ondulado com folhas e flores.
function paintedVine(g, x0, y0, x1, amp, seed, alpha = 0.85) {
  const rnd = mulberry32(seed);
  g.save(); g.globalAlpha = alpha;
  g.strokeStyle = '#4f7f45'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath();
  const pts = [];
  for (let x = x0; x <= x1; x += 8) {
    const y = y0 + Math.sin(x * 0.02 + seed) * amp + Math.sin(x * 0.051) * amp * 0.3;
    pts.push([x, y]);
    if (x === x0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
  for (let i = 2; i < pts.length; i += 3) {
    const [x, y] = pts[i];
    const up = rnd() < 0.5 ? -1 : 1;
    g.fillStyle = rnd() < 0.5 ? '#5f9a52' : '#6faa5a';
    g.beginPath(); g.ellipse(x, y + up * 7, 6, 3.2, up * 0.6, 0, Math.PI * 2); g.fill();
    if (rnd() < 0.18) flower(g, x, y - up * 9, 3.5, rnd() < 0.5 ? '#e58aa0' : '#f3d36b', '#fff2c4');
  }
  g.restore();
}

function windowFrame(g, w) {
  const r = w.w / 2;
  g.save();
  g.lineWidth = 12; g.strokeStyle = PAL.woodDark;
  g.beginPath();
  if (w.round) g.arc(w.x + r, w.y + w.h / 2, r, 0, Math.PI * 2);
  else {
    g.moveTo(w.x, w.y + w.h); g.lineTo(w.x, w.y + r); g.arc(w.x + r, w.y + r, r, Math.PI, 0); g.lineTo(w.x + w.w, w.y + w.h);
  }
  g.stroke();
  g.lineWidth = 4; g.strokeStyle = PAL.woodLight;
  g.stroke();
  // caixilhos
  g.strokeStyle = PAL.woodDark; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(w.x + r, w.y + (w.round ? 0 : 2)); g.lineTo(w.x + r, w.y + w.h);
  const my = w.round ? w.y + w.h / 2 : w.y + w.h * 0.55;
  g.moveTo(w.x, my); g.lineTo(w.x + w.w, my);
  g.stroke();
  if (!w.round) {
    // parapeito
    g.fillStyle = PAL.wood;
    g.fillRect(w.x - 16, w.y + w.h, w.w + 32, 10);
    g.fillStyle = PAL.woodLight;
    g.fillRect(w.x - 16, w.y + w.h, w.w + 32, 3);
  }
  g.restore();
}

function telescope(g, x, fy) {
  g.strokeStyle = PAL.woodDark; g.lineWidth = 3;

  g.save();
  g.translate(x + 25, fy - 56); g.rotate(-0.45);
  // três garrafas e um funil
  g.fillStyle = 'rgba(120,180,150,0.85)'; roundRect(g, -26, -6, 20, 12, 4); g.fill();

function bookshelf(g, x, fy, w, h, seed = 5) {
  const rnd = mulberry32(seed);
  g.fillStyle = PAL.woodDark;
  g.fillRect(x, fy - h, w, h);
  g.fillStyle = PAL.wood;
  g.fillRect(x + 6, fy - h + 6, w - 12, h - 12);
  const shelves = 4, sh = (h - 12) / shelves;
  const cols = ['#9b4a3f', '#3f5f8a', '#5f8a4a', '#c8902e', '#6a4a7a', '#a86a8a', '#2f6a6a', '#d0b07a'];
  for (let s = 0; s < shelves; s++) {
    const by = fy - h + 6 + (s + 1) * sh;
    g.fillStyle = PAL.woodDark;
    g.fillRect(x + 4, by - 4, w - 8, 5);
    let bx = x + 10;
    while (bx < x + w - 14) {
      const bw = 7 + rnd() * 9, bh = sh * (0.55 + rnd() * 0.35);
      if (rnd() < 0.1) { // pote ou planta
        g.fillStyle = '#c98b5a'; roundRect(g, bx, by - 14, 14, 10, 3); g.fill();
        g.fillStyle = PAL.green; g.beginPath(); g.arc(bx + 7, by - 18, 7, 0, Math.PI * 2); g.fill();
        bx += 18; continue;
      }
      const lean = rnd() < 0.12 ? 0.15 : 0;
      g.save(); g.translate(bx, by - 4); g.rotate(lean);
      g.fillStyle = cols[(rnd() * cols.length) | 0];
      g.fillRect(0, -bh, bw, bh);
      g.fillStyle = 'rgba(255,230,180,0.5)';
      g.fillRect(1, -bh + 4, bw - 2, 1.5); g.fillRect(1, -10, bw - 2, 1.5);
      g.restore();
      bx += bw + 1;
    }
  }
}

function embroideryTable(g, x, fy) {

  g.fillRect(x, fy - 44, 90, 8);

  g.beginPath(); g.arc(x + 45, fy - 64, 18, 0, Math.PI * 2); g.fill();
  g.strokeStyle = PAL.woodLight; g.lineWidth = 3;
  g.beginPath(); g.arc(x + 45, fy - 64, 18, 0, Math.PI * 2); g.stroke();
  sunSymbol(g, x + 45, fy - 64, 6, '#e2a93a', 1);
  g.strokeStyle = PAL.woodDark; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x + 45, fy - 46); g.lineTo(x + 45, fy - 44); g.stroke();
  // novelos
  for (const [cx, col] of [[x + 14, '#c9667a'], [x + 24, '#7fb3d9'], [x + 76, '#f2c14e']]) {
    g.fillStyle = col; g.beginPath(); g.arc(cx, fy - 49, 5, 0, Math.PI * 2); g.fill();
  }
}

function ledge(g, x, y, w) {

  g.fillRect(x, y, w, 10);

  g.fillRect(x, y, w, 3);
  g.strokeStyle = PAL.woodDark; g.lineWidth = 4;
  g.beginPath(); g.moveTo(x + 12, y + 10); g.lineTo(x + 30, y + 34); g.moveTo(x + w - 12, y + 10); g.lineTo(x + w - 30, y + 34); g.stroke();
  // livros na prateleira alta
  const cols = ['#3f5f8a', '#9b4a3f', '#c8902e', '#5f8a4a'];
  for (let i = 0; i < 4; i++) {
    g.fillStyle = cols[i];
    g.fillRect(x + 100 + i * 10, y - 26 + (i % 2) * 3, 9, 26 - (i % 2) * 3);
  }
}

function door(g, x, fy) {
  g.fillStyle = PAL.woodDark;
  g.beginPath(); g.moveTo(x, fy); g.lineTo(x, fy - 110); g.arc(x + 45, fy - 110, 45, Math.PI, 0); g.lineTo(x + 90, fy); g.closePath(); g.fill();
  g.fillStyle = '#3e4772';
  g.beginPath(); g.moveTo(x + 8, fy); g.lineTo(x + 8, fy - 108); g.arc(x + 45, fy - 108, 37, Math.PI, 0); g.lineTo(x + 82, fy); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(20,20,40,0.5)'; g.lineWidth = 2;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(x + 8 + i * 18.5, fy - 140); g.lineTo(x + 8 + i * 18.5, fy); g.stroke(); }
  g.fillStyle = '#6c6470';
  g.fillRect(x + 6, fy - 120, 30, 6); g.fillRect(x + 6, fy - 40, 30, 6);
  g.fillStyle = '#c6a45a';
  g.beginPath(); g.arc(x + 70, fy - 60, 4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#2a2230'; g.fillRect(x + 68, fy - 52, 4, 8);
  // flores escuras de Ismena na porta
  for (const [fx, fyy] of [[x + 30, fy - 150], [x + 45, fy - 156], [x + 60, fy - 150]]) flower(g, fx, fyy, 4, '#4a2f5e', '#9a7ab8');
}

function stove(g, x, fy) {

}

function table(g, x, fy, w) {

}

function paintTable(g, x, fy) {
  table(g, x, fy, 90);

  g.beginPath(); g.moveTo(x + 68, fy - 92); g.lineTo(x + 62, fy - 112); g.moveTo(x + 73, fy - 92); g.lineTo(x + 79, fy - 114); g.stroke();
  g.fillStyle = '#d4544a'; g.fillRect(x + 60, fy - 116, 4, 5);
  g.fillStyle = '#5f9ad9'; g.fillRect(x + 78, fy - 118, 4, 5);

function pot(g, x, fy, kind = 0) {
  g.fillStyle = '#c47f52';
  g.beginPath(); g.moveTo(x - 14, fy - 26); g.lineTo(x + 14, fy - 26); g.lineTo(x + 10, fy); g.lineTo(x - 10, fy); g.fill();
  g.fillStyle = '#a8663f'; g.fillRect(x - 15, fy - 28, 30, 5);
  if (kind === 0) {
    g.fillStyle = PAL.green;
    for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(x + (i - 2.5) * 5, fy - 38 - (i % 2) * 8, 5, 12, (i - 2.5) * 0.3, 0, Math.PI * 2); g.fill(); }
    flower(g, x, fy - 56, 4, '#f3d36b', '#fff2c4');
  } else if (kind === 1) {
    g.fillStyle = PAL.greenDark;
    for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(x + Math.cos(i) * 10, fy - 40 + Math.sin(i * 2) * 8, 8, 0, Math.PI * 2); g.fill(); }

function rug(g, x, y, w, c1 = '#9b4a5a', c2 = '#f2c14e') {

  g.beginPath(); g.ellipse(x + w / 2, y, w / 2, 6, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = c2; g.lineWidth = 1.5; g.setLineDash([4, 4]);
  g.beginPath(); g.ellipse(x + w / 2, y, w / 2 - 6, 3.5, 0, 0, Math.PI * 2); g.stroke();

}

function sconce(g, x, y) {

function ladderArt(g, x, w, top, bottom) {
  g.fillStyle = PAL.woodLight;

  g.fillRect(x + w - 5, top - 30, 5, bottom - top + 30);

}

function stairsArt(g, steps, floorY) {
  // degraus de madeira com espelho e corrimão
  for (const s of steps) {
    g.fillStyle = PAL.plankDark;
    g.fillRect(s.x, s.y, s.w, floorY - s.y);
    g.fillStyle = PAL.plank;
    g.fillRect(s.x - 1, s.y, s.w + 2, 7);
    g.fillStyle = PAL.woodLight;
