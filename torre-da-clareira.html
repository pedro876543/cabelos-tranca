      id: 'laje', x: MINA.x - 50, y: G - 120, w: 100, h: 120, label: aberta ? MT.entrar : 'Examinar a laje de pedra',
      use: (a, o) => {
        if (this.getS('mina-aberta', false)) { this.game.scenes.go('minas', {}); return; }
        const q = Quests.get(this.game, 'passagem');
        if (!q) Quests.start(this.game, 'passagem');
        if (!Quests.get(this.game, 'passagem').done && Quests.get(this.game, 'passagem').step < 1) Quests.step(this.game, 'passagem', 1);
        this.say(this.player.braided ? [...MT.lajeVer, ...MT.lajeTranca] : MT.lajeVer);
      },
    });
    this.reachPoint({
      id: 'argola-mina', x: MINA.x, y: G - 150, label: 'Puxar a argola da laje', hidden: aberta,
      onPull: (a, h) => {
        h.hidden = true;
        this.setS('mina-aberta', true);
        this.slabAnim = 0;
        this.sparkle(MINA.x, G - 80, 22);
        this.game.camera.shake(2, 0.4);
        const o = this.objects.find((x) => x.id === 'laje'); if (o) o.label = MT.entrar;
        if (!Quests.get(this.game, 'passagem')) Quests.start(this.game, 'passagem');
        if (!Quests.done(this.game, 'passagem') && Quests.get(this.game, 'passagem').step < 2) Quests.step(this.game, 'passagem', 2);
        this.say(MT.lajeAbre);
      },
      draw: () => {},
    });

    // voltar para a torre
    this.hook({
      id: 'torre', x: 455, y: 880, label: 'Subir para a torre',
      onReach: () => this.game.scenes.go('torre', { spawn: 'janela' }),
    });

    // ponte quebrada e flor murcha
    if (this.getS('ponte', false)) this.bridge = this.oneWay(RAVINE.x0, G, 500);
    this.restore({
      id: 'ponte', x: RAVINE.x0, y: 1150, w: 500, h: 60, floorY: G, label: 'Restaurar a ponte', cost: 30, time: 1.6,
      done: this.getS('ponte', false),
      onDone: () => {
        this.setS('ponte', true);
        this.bridge = this.oneWay(RAVINE.x0, G, 500);
        this.bridgeAnim = 0;
        this.player.setExpr('surpresa', 2);
        this.say(TXT.ponteRestaurada);
      },
    });
    this.restore({
      id: 'flor', x: 5320, y: 1100, w: 80, h: 100, floorY: G, label: 'Curar a flor', cost: 25,
      done: this.getS('flor', false),
      onDone: () => {
        this.setS('flor', true);
        this.flowerAnim = 0;
        this.flowerPad = this.solid(5322, 1150, 76, 8, { oneWay: true, bounce: 1060 });
        this.say(TXT.florCurada);
      },
    });

    // luz do sol entre as copas
    for (const x of [700, 1400, 2050, 3150, 3700, 5250, 5900, 6400]) {
      this.shafts.push({ x1: x, y1: 380, x2: x - 140, y2: G, w1: 60, w2: 200, a: 0.8 });
    }
    // flores e cogumelos que brilham
    const rnd = mulberry32(17);
    this.lamps = [];
    for (let i = 0; i < 46; i++) {
      const x = 520 + rnd() * 6100;
      if (x > RAVINE.x0 - 20 && x < RAVINE.x1 + 20) continue;
      if (x > 3550 && x < 3830) continue;
      const inHollow = x > HOLLOW.x0 && x < HOLLOW.x1;
      const y = inHollow ? (x < 4400 ? 840 : 1000) : G;
      const kind = inHollow || rnd() < 0.4 ? 'cogumelo' : 'flor';
      const col = kind === 'cogumelo' ? (rnd() < 0.5 ? '#9ee6ff' : '#c6a2ff') : (rnd() < 0.5 ? '#ffe28a' : '#ffb3c8');
      this.lamps.push({ x, y, kind, col, ph: rnd() * 6 });
    }
    // grama que reage à passagem
    this.tufts = [];
    for (let x = 470; x < 6700; x += 18 + rnd() * 14) {
      if (x > RAVINE.x0 - 4 && x < RAVINE.x1 + 4) continue;
      if (x > 3560 && x < 3820) continue;
      if (x > 4160 && x < 4930) continue;
      this.tufts.push({ x, h: 7 + rnd() * 9, bend: 0, col: rnd() < 0.5 ? '#5f9a52' : '#78ae5e' });
    }

    // animais
    this.critter(new Rabbit(700, G, 520, 1050));
    this.critter(new Rabbit(5150, G, 5000, 5900, '#b9a68f'));
    this.critter(new Rabbit(5800, G, 5600, 6200, '#d8cbb8'));
    this.critter(new Bird(900, G));
    this.critter(new Bird(1700, G, '#c4766f'));
    this.critter(new Bird(3300, G));
    this.critter(new Bird(5500, G, '#8fae5f'));
    this.critter(new Bird(6150, G, '#c4766f'));
    this.critter(new Squirrel(1555, 1060, 1520));
    this.critter(new Squirrel(2215, 1050, 2172));
    this.critter(new Squirrel(3110, 1010, 3062));

    // folhas e vaga-lumes
    this.leaves = [];
    this.flies = Array.from({ length: 26 }, (_, i) => ({ x: 600 + i * 240, y: 900 + (i % 5) * 50, ph: i }));

    // pétalas
    this.petal(1, 1080, 1170);
    this.petal(2, 1920, 1050);
    this.petal(3, 2230, 912);
    this.petal(4, 3250, 900);
    this.petal(5, 4225, 812);
    this.petal(6, 4700, 972);
    this.petal(7, 5520, 872);
    this.petal(8, 6300, 1085);

    // lugares
    this.zone('Árvore Oca', (p) => this.inHollow(p));
    this.zone('Clareira da Torre', (p) => p.cx < 1150);
    this.zone('Trilha das Árvores', (p) => p.cx < 2330);
    this.zone('Ravina do Riacho', (p) => p.cx < 2960);
    this.zone('Tronco Caído', (p) => p.cx < 4170);
    this.zone('Clareira das Flores', (p) => p.cx < 6000);
    this.zone('Fim da Trilha', () => true);

    this.buildObjects();
    this.lastSafe = null;
    this.respawnT = 0;
  }

  inHollow(p) { return p.cx > HOLLOW.x0 && p.cx < HOLLOW.x1 && p.feet < HOLLOW.y1 && p.feet > HOLLOW.y0; }

  buildObjects() {
    const pl = () => this.player;
    this.object({ id: 'placa', x: 980, y: G - 70, w: 50, h: 70, label: 'Placa', use: () => this.say(TXT.placaTrilha) });
    this.object({ id: 'jardim', x: 520, y: G - 60, w: 250, h: 60, label: 'Jardim da Ismena', use: () => this.say(TXT.jardimIsmena) });
    this.object({
      id: 'pontevelha', x: 2320, y: G - 70, w: 60, h: 70, label: 'Ponte velha', hidden: this.getS('ponte', false),
      use: () => { this.setS('m-ponte', true); this.say(TXT.ponteQuebrada); },
    });
    this.object({ id: 'tronco', x: 3480, y: G - 90, w: 70, h: 90, label: 'Tronco caído', use: () => { this.setS('m-tronco', true); this.say(TXT.troncoCaido); } });
    this.object({
      id: 'espinheiro', x: 4520, y: 1000 - 80, w: 50, h: 80, label: 'Espinheiro de sombras', zone: { x0: 4470, x1: 4580, y0: 990, y1: 1004 },
      hidden: this.getS('espinhos', false),
      use: () => this.say(TXT.espinheiro),
    });
    this.object({ id: 'pedrasol', x: 5470, y: 900 - 46, w: 60, h: 46, label: 'Pedra antiga', zone: { x0: 5420, x1: 5590, y0: 890, y1: 904 }, use: () => { this.game.state.set('pedra-sol'); this.say(TXT.pedraSol); } });
    this.object({ id: 'florg', x: 5320, y: 1100, w: 80, h: 100, label: 'Flor gigante', hidden: this.getS('flor', false), use: () => this.say(TXT.florMurcha) });
    this.object({
      id: 'pegadas', x: 6380, y: G - 30, w: 90, h: 30, label: 'Pegadas e um papel',
      use: () => {
        const done = this.getS('fim', false);
        this.say(done ? TXT.mapaDeNovo : TXT.mapaRasgado, () => {
          if (!done) {
            this.setS('fim', true);
            this.game.state.set('mapa-rasgado');
            this.sparkle(pl().cx, pl().y, 20);
          }
        });
      },
    });
    this.object({
      id: 'arco', x: 6560, y: G - 170, w: 150, h: 170, label: 'Seguir a trilha',
      use: () => {
        if (!this.getS('fim', false)) { this.say(TXT.antesDoArco); return; }
        const first = !this.game.state.flag('reino-visto');
        if (first) this.say(TXT.trilhaContinua, () => this.game.scenes.go('reino', { spawn: 'floresta' }));
        else this.game.scenes.go('reino', { spawn: 'floresta' });
      },
    });
  }

  // ---------- Ações das magias ----------
  openDoor(h) {
    this.setS('porta', true);
    h.hidden = true;
    if (this.door) this.solids = this.solids.filter((s) => s !== this.door);
    this.door = null;
    this.doorAnim = 0;
    this.dust(4900, 1000, 14);
    this.game.camera.shake(3, 0.25);
    this.game.ui.notify('A passagem de raízes se abriu!');
  }

  takeFruit(h, key) {
    this.setS(key, true);
    h.hidden = true;
    const s = this.game.state;
    s.brilho = Math.min(100, s.brilho + 50);
    this.player.boostGlow(1);
    this.game.ui.notify('Fruta-sol: +50 de Brilho');
  }

  // ---------- Atualização ----------
  updateExtra(dt) {
    if (this.slabAnim != null && this.slabAnim < 1) this.slabAnim = Math.min(1, this.slabAnim + dt * 0.7);
    const p = this.player, g = this.game;
    // escuridão dentro da árvore oca
    const target = this.inHollow(p) ? 1 : 0;
    this.darkAmt += (target - this.darkAmt) * Math.min(1, dt * 3);

    // espinheiro de sombras recua com o Lume
    if (this.thorns) {
      const t = this.thorns;
      const d = Math.hypot(p.cx - (t.x + t.w / 2), p.cy - (t.y + t.h / 2));
      this.thornBurn = Math.max(0, (this.thornBurn || 0) + (p.lume && d < 210 ? dt / 1.2 : -dt * 0.5));
      if (this.thornBurn > 0 && Math.random() < 0.5) this.fx.emit({ x: t.x + Math.random() * t.w, y: t.y + Math.random() * t.h, vx: (Math.random() - 0.5) * 30, vy: -40, size: 2, life: 0.8, color: '#3b2350' });
      if (this.thornBurn >= 1) {
        this.solids = this.solids.filter((s) => s !== t);
        this.thorns = null;
        this.setS('espinhos', true);
        const o = this.objects.find((o) => o.id === 'espinheiro'); if (o) o.hidden = true;
        this.sparkle(t.x + 20, t.y + 70, 24);
        g.ui.notify('O espinheiro fugiu da luz!');
      }
    }

    // avisos da missão pelo caminho
    if (p.cx > 2250 && p.cx < 2400 && !this.getS('m-ponte', false)) { this.setS('m-ponte', true); }
    if (p.cx > 3350 && p.feet >= G - 2 && !this.getS('m-tronco', false)) { this.setS('m-tronco', true); }
    if (p.cx > 3840 && !this.getS('m-copas', false)) { this.setS('m-copas', true); }
    // no vão entre o tronco e a árvore oca: aviso de como sair (trança feita bloqueia os Cabelos)
    if (p.cx > 3822 && p.cx < 4160 && p.feet > 1100 && p.onGround) {
      this.gapT = (this.gapT || 0) + dt;
      if (this.gapT > 1.2 && !(this.gapWarnT > this.t)) {
        this.gapWarnT = this.t + 14;
        g.ui.notify(g.ui.fmt(p.braided ? 'Suba pelos cogumelos do tronco, ou desfaça a trança ({T}).' : 'Para voltar, suba pelos cogumelos do tronco.'), 6);
      }
    } else this.gapT = 0;
    this.updateQuest();

    // queda no riacho: volta à margem
    if (p.onGround && (p.cx < RAVINE.x0 - 10 || p.cx > RAVINE.x1 + 10) && !this.inHollow(p) && p.feet >= G - 1) {
      this.lastSafe = { x: p.cx < RAVINE.x0 ? Math.min(p.cx, RAVINE.x0 - 40) : Math.max(p.cx, RAVINE.x1 + 40), y: G };
    }
    if (this.respawnT > 0) {
      this.respawnT -= dt;
      if (this.respawnT <= 0.4 && !this.respawned) {
        this.respawned = true;
        const s = this.lastSafe || this.spawns.default;
        p.x = s.x - p.w / 2; p.y = s.y - p.h; p.vx = p.vy = 0;
        p.hair.reset(p.cx, p.feet - 54, p.facing);
        p.swing = null; p.anim.set('idle');
        this.camY = p.cy - 30;
        g.camera.snap(p.cx, this.camY);
      }
    } else if (p.feet > RAVINE.water + 10 && p.cx > RAVINE.x0 && p.cx < RAVINE.x1) {
      this.respawnT = 0.9; this.respawned = false;
      for (let i = 0; i < 16; i++) this.fx.emit({ x: p.cx, y: RAVINE.water, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 200, g: 500, size: 2, life: 0.7, color: '#d6f0ff' });
      g.ui.notify(TXT.correnteza);
    }

    // grama se curva
    for (const tf of this.tufts) {
      const d = tf.x - p.cx;
      const push = Math.abs(d) < 26 && Math.abs(p.feet - G) < 6 ? Math.sign(d || 1) * (1 - Math.abs(d) / 26) : 0;
      tf.bend += (push * 0.9 - tf.bend) * Math.min(1, dt * 8);
    }
    // folhas caindo perto da câmera
    const cam = g.camera;
    if (this.leaves.length < 22 && Math.random() < dt * 6) {
      this.leaves.push({ x: cam.left + Math.random() * (cam.right - cam.left + 40), y: cam.top - 10, vx: -10 - Math.random() * 20, vy: 30 + Math.random() * 25, r: Math.random() * 6, col: ['#7fae5a', '#d9a441', '#c8723e'][(Math.random() * 3) | 0] });
    }
    for (const l of this.leaves) { l.r += dt * 2; l.x += (l.vx + Math.sin(l.r) * 30) * dt; l.y += l.vy * dt; }
    this.leaves = this.leaves.filter((l) => l.y < cam.bottom + 20);
    if (this.bridgeAnim != null && this.bridgeAnim < 1) this.bridgeAnim = Math.min(1, this.bridgeAnim + dt * 1.2);
    if (this.flowerAnim != null && this.flowerAnim < 1) this.flowerAnim = Math.min(1, this.flowerAnim + dt * 1.5);
    if (this.doorAnim != null && this.doorAnim < 1) this.doorAnim = Math.min(1, this.doorAnim + dt * 2);
  }

  updateQuest() {
    const k = (n) => this.getS(n, false);
    let text;
    if (k('fim')) text = 'Concluída! A trilha continua para fora da floresta.';
    else if (k('porta')) text = 'Siga a trilha até o fim da floresta.';
    else if (k('espinhos')) text = 'Abra a passagem de raízes: puxe a trava com os cabelos ({Q}).';
    else if (k('m-copas')) text = 'Atravesse a árvore oca. No escuro, segure {F} para o Lume.';
    else if (k('m-tronco')) text = 'O tronco bloqueia a trilha. Suba pelas árvores com {Q} e balance nos galhos dourados.';
    else if (k('ponte')) text = 'Continue pela trilha.';
    else if (k('m-ponte')) text = 'A ponte está quebrada. Segure {R} perto dela para restaurá-la.';
    else text = 'Explore a floresta seguindo a trilha para a direita.';
    const g = this.game, q = Quests.get(g, 'trilha') || Quests.start(g, 'trilha', { silent: true });
    if (k('fim')) { if (!q.done) Quests.complete(g, 'trilha'); return; }
    if (q.text !== text) { q.text = text; g.state.tracked = 'trilha'; Quests.refresh(g); }
  }

  onEnter(data) {
    const s = this.game.state;
    if (!s.flag('floresta-vista')) {
      s.set('floresta-vista');
      this.player.setExpr('surpresa', 3);
      setTimeout(() => this.say(TXT.florestaEntrada, () => this.game.ui.showHint(TXT.dicaFloresta, 10)), 1100);
    }
    this.player.vy = 200;
  }

  // ---------- Desenho ----------
  drawBackground(ctx) { drawForestBackground(ctx, this.game.camera, this.t); }

  renderStatic() {
    const res = Math.min(1.25, Math.max(1, this.game.pixelScale || 1));
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res);
      g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }

  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) {
      if (ch.x > cam.right || ch.x + CHUNK < cam.left) continue;
      ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
    }
  }

  drawStatic(g, x0, x1) {
    const vis = (a, b) => b >= x0 - 60 && a <= x1 + 60;
    const rnd = mulberry32(5);
    // árvores grandes do cenário (atrás de tudo)
    const trees = [[760, 46], [1520, 40], [1180, 34], [2172, 44], [2600, 30], [3062, 46], [3350, 40], [5000, 48], [5450, 36], [5980, 44], [6250, 34], [6620, 50]];
    for (const [tx, w] of trees) if (vis(tx - 200, tx + 200)) trunk(g, tx, w, G);
    // torre por fora
    if (vis(60, 460)) towerOutside(g);
    // cachoeira: rochedo ao fundo
    if (vis(RAVINE.x0, RAVINE.x1)) {
      g.fillStyle = '#6d6a78';
      g.beginPath(); g.moveTo(2690, 1460); g.lineTo(2700, 880); g.quadraticCurveTo(2780, 840, 2880, 870); g.lineTo(2900, 1460); g.fill();
      g.fillStyle = '#5a5866';
      for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(2720 + rnd() * 160, 900 + rnd() * 500, 26, 14, rnd(), 0, Math.PI * 2); g.fill(); }
      g.fillStyle = '#4f8452';
      g.beginPath(); g.ellipse(2790, 872, 110, 26, 0, Math.PI, 0); g.fill();
    }
    // chão com grama
    ground(g, 60, RAVINE.x0, G, x0, x1);
    ground(g, RAVINE.x1, 6740, G, x0, x1);
    // paredes da ravina e leito do riacho
    if (vis(RAVINE.x0, RAVINE.x1)) {
      g.fillStyle = '#5a3d2e'; g.fillRect(RAVINE.x0 - 12, G + 18, 12, 300); g.fillRect(RAVINE.x1, G + 18, 12, 300);
      g.fillStyle = '#4a3a34'; g.fillRect(RAVINE.x0, 1460, 500, 40);
      // postes da ponte
      for (const px of [RAVINE.x0 - 6, RAVINE.x1 - 6]) {
        g.fillStyle = P.PAL.woodDark; g.fillRect(px, G - 50, 12, 90);
        g.fillStyle = P.PAL.woodLight; g.fillRect(px, G - 50, 12, 4);
      }
    }
    // pedras
    if (vis(1300, 1440)) rock(g, 1300, 1145, 140, 55, 1);
    if (vis(1820, 2020)) rock(g, 1820, 1080, 200, 120, 2);
    // galhos com folhas
    for (const [bx, by, bw] of [[1440, 1060, 150], [2080, 1050, 160], [2170, 940, 140], [2980, 1010, 160], [3190, 930, 130], [3260, 830, 170]]) {
      if (vis(bx, bx + bw)) branch(g, bx, by, bw);
    }
    // galhos dourados de balanço
    for (const [sx, sy] of [[3545, 620], [3780, 630]]) {
      if (!vis(sx - 200, sx + 200)) continue;
      g.strokeStyle = '#5a3e2e'; g.lineWidth = 14; g.lineCap = 'round';
      g.beginPath(); g.moveTo(sx - 180, sy - 40); g.quadraticCurveTo(sx, sy - 6, sx + 160, sy - 50); g.stroke();
      g.fillStyle = '#3f6e47';
      for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(sx - 150 + i * 60, sy - 60 + Math.sin(i) * 12, 34, 0, Math.PI * 2); g.fill(); }
    }
    // tronco caído (visto de frente: anéis da madeira) e espinhos
    if (vis(3540, 3920)) {
      g.fillStyle = '#6e4a32';
      g.beginPath(); g.arc(3690, 1055, 150, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#8e6a48'; g.lineWidth = 3;
      for (let r = 20; r < 150; r += 18) { g.beginPath(); g.arc(3690 + (rnd() - 0.5) * 6, 1055, r, 0, Math.PI * 2); g.stroke(); }
      g.fillStyle = '#5a3a26'; g.beginPath(); g.arc(3690, 1055, 150, 0.2, 1.2); g.lineTo(3690, 1055); g.fill();
      g.strokeStyle = '#3f3330'; g.lineWidth = 3;
      for (let i = 0; i < 14; i++) {
        const a = Math.PI + (i / 13) * Math.PI;
        const x = 3690 + Math.cos(a) * 150, y = 1055 + Math.sin(a) * 150;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + (rnd() - 0.5) * 40, y - 30, x + (rnd() - 0.5) * 60, y - 40 - rnd() * 20); g.stroke();
      }
      P.paintedVine(g, 3560, 930, 3820, 12, 31, 1);
      for (const [y, w] of STEPS_TRONCO) {   // cogumelos-prateleira (degraus do vão)
        g.fillStyle = '#c9a27a'; g.beginPath(); g.ellipse(3818, y + 2, w + 4, 13, 0, 0, Math.PI); g.fill();
        g.fillStyle = '#e0c39a'; g.fillRect(3818, y, w, 5);
        g.fillStyle = 'rgba(255,240,200,0.5)'; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(3830 + i * (w - 20) / 2, y + 7, 2.5, 0, Math.PI * 2); g.fill(); }
      }
    }
    // laje de pedra
    if (vis(3880, 4160)) {
      rock(g, 3880, 840, 280, 32, 4);
      g.fillStyle = '#4f8452'; g.fillRect(3884, 836, 272, 6);
    }
    // árvore oca
    if (vis(4120, 4960)) hollowTree(g);
    // flor da clareira: caule
    if (vis(5300, 5420)) {
      g.strokeStyle = '#4f7f45'; g.lineWidth = 8;
      g.beginPath(); g.moveTo(5360, G); g.quadraticCurveTo(5350, 1170, 5360, 1150); g.stroke();
      g.fillStyle = '#5f9a52';
      g.beginPath(); g.ellipse(5335, 1180, 22, 8, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(5388, 1176, 22, 8, 0.5, 0, Math.PI * 2); g.fill();
    }
    // ressalto secreto
    if (vis(5420, 5590)) { rock(g, 5420, 900, 170, 26, 7); g.fillStyle = '#4f8452'; g.fillRect(5424, 896, 162, 5); }
    // pedra com o sol
    if (vis(5470, 5530)) {
      g.fillStyle = '#8f8a9a'; roundRect(g, 5472, 854, 56, 46, 10); g.fill();
      P.sunSymbol(g, 5500, 876, 8, '#c8a24a', 0.9);
    }
    // placa, jardim, arco de raízes
    if (vis(980, 1030)) signpost(g, 1000, G, 'Trilha');
    if (vis(520, 780)) garden(g, 520, G);
    if (vis(6260, 6340)) signpost(g, 6300, G, 'Vila do Moinho');
    if (vis(6540, 6740)) rootArch(g, 6560, G);
    // pegadas de botas
    if (vis(6380, 6470)) {
      g.fillStyle = 'rgba(70,45,30,0.55)';
      for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(6390 + i * 18, G - 3 + (i % 2) * 2, 5, 2, 0, 0, Math.PI * 2); g.fill(); }
    }
  }

  // rochedo com a passagem misteriosa: a laje desliza para o lado quando a argola é puxada
  drawMina(ctx) {
    const x = MINA.x, t = this.t, open = this.getS('mina-aberta', false), k = open ? (this.slabAnim ?? 1) : 0;
    ctx.fillStyle = '#6d6a78';
    ctx.beginPath(); ctx.moveTo(x - 110, G); ctx.quadraticCurveTo(x - 100, G - 170, x, G - 185); ctx.quadraticCurveTo(x + 100, G - 170, x + 110, G); ctx.fill();
    ctx.fillStyle = '#5a5866';
    ctx.beginPath(); ctx.ellipse(x - 60, G - 60, 26, 14, 0.4, 0, Math.PI * 2); ctx.ellipse(x + 70, G - 100, 20, 12, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4f8452';
    ctx.beginPath(); ctx.ellipse(x, G - 178, 70, 16, 0, Math.PI, 0); ctx.fill();
    // abertura escura com degraus
    ctx.fillStyle = '#1b1426'; roundRect(ctx, x - 40, G - 124, 80, 124, 30); ctx.fill();
    if (k > 0) {
      ctx.fillStyle = '#3a2e45'; for (let i = 0; i < 4; i++) ctx.fillRect(x - 30 + i * 4, G - 30 + i * 8 - 24, 60 - i * 8, 6);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(x, G - 40, 0, x, G - 40, 60);
      gr.addColorStop(0, `rgba(160,190,255,${0.25 + Math.sin(t * 2) * 0.05})`); gr.addColorStop(1, 'rgba(160,190,255,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - 60, G - 100, 120, 100); ctx.restore();
    }
    // laje
    const sx = x - 44 + k * 92;
    ctx.fillStyle = '#9a96a6'; roundRect(ctx, sx, G - 128, 88, 128, 28); ctx.fill();
    ctx.strokeStyle = '#7a7686'; ctx.lineWidth = 2; ctx.stroke();
    P.sunSymbol(ctx, sx + 44, G - 70, 14, '#c9a24a', 0.9);
    if (!open) {
      const glow = this.focusHook?.id === 'argola-mina';
      ctx.strokeStyle = glow ? '#f6c24f' : '#b08a4a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, G - 150 + 8, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x - 3, G - 132, 6, 6);
    }
  }

  drawBack(ctx) {
    const cam = this.game.camera, t = this.t;
    const onScreen = (x, pad = 80) => x > cam.left - pad && x < cam.right + pad;
    if (onScreen(MINA.x, 200)) this.drawMina(ctx);
    // riacho e cachoeira
    if (onScreen(RAVINE.x0, 520) || onScreen(RAVINE.x1, 520)) {
      const wg = ctx.createLinearGradient(0, 860, 0, 1440);
      wg.addColorStop(0, 'rgba(190,230,250,0.85)'); wg.addColorStop(1, 'rgba(150,205,235,0.9)');
      ctx.fillStyle = wg; ctx.fillRect(2770, 870, 60, 560);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      for (let i = 0; i < 7; i++) {
        const yy = 870 + ((t * 260 + i * 80) % 560);
        ctx.beginPath(); ctx.moveTo(2776 + i * 7, yy); ctx.lineTo(2776 + i * 7, yy + 30); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(120,180,220,0.85)'; ctx.fillRect(RAVINE.x0, RAVINE.water, 500, 40);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 9; i++) {
        const xx = RAVINE.x0 + ((i * 70 + t * 40) % 500);
        ctx.beginPath(); ctx.moveTo(xx, RAVINE.water + 8 + (i % 3) * 8); ctx.lineTo(xx + 22, RAVINE.water + 8 + (i % 3) * 8); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(2780 + i * 10, RAVINE.water + Math.sin(t * 6 + i) * 3, 7, 0, Math.PI * 2); ctx.fill(); }
      this.drawBridge(ctx);
    }
    // flor gigante, porta de raízes
    if (onScreen(5360)) this.drawGiantFlower(ctx);
    if (onScreen(4900)) this.drawDoor(ctx);
    if (this.thorns && onScreen(4600)) this.drawThorns(ctx);
    // pedra empurrável
    for (const rk of this.pushables) {
      ctx.save(); ctx.translate(rk.x + rk.w / 2, rk.y + rk.h / 2); ctx.rotate(rk.roll || 0);
      ctx.fillStyle = '#8a8694'; ctx.beginPath(); ctx.arc(0, 0, rk.w / 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a7a3b0'; ctx.beginPath(); ctx.arc(-6, -8, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5f8a4a'; ctx.beginPath(); ctx.arc(10, 12, 7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // flores e cogumelos que brilham
    for (const l of this.lamps) {
      if (!onScreen(l.x)) continue;
      const pulse = 0.6 + Math.sin(t * 2 + l.ph) * 0.4;
      if (l.kind === 'cogumelo') {
        ctx.fillStyle = '#efe4d2'; ctx.fillRect(l.x - 1.5, l.y - 9, 3, 9);
        ctx.fillStyle = l.col; ctx.beginPath(); ctx.ellipse(l.x, l.y - 9, 7, 4.5, 0, Math.PI, 0); ctx.fill();
      } else {
        ctx.strokeStyle = '#4f7f45'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + Math.sin(t + l.ph) * 2, l.y - 16); ctx.stroke();
        P.flower(ctx, l.x + Math.sin(t + l.ph) * 2, l.y - 17, 3, l.col, '#fff6d0');
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gy = l.y - (l.kind === 'cogumelo' ? 9 : 17);
      const gr = ctx.createRadialGradient(l.x, gy, 0, l.x, gy, 22);
      gr.addColorStop(0, hexA(l.col, 0.35 * pulse)); gr.addColorStop(1, hexA(l.col, 0));
      ctx.fillStyle = gr; ctx.fillRect(l.x - 22, gy - 22, 44, 44);
      ctx.restore();
    }
    // grama
    ctx.lineCap = 'round';
    for (const tf of this.tufts) {
      if (!onScreen(tf.x, 20)) continue;
      const sw = Math.sin(t * 1.7 + tf.x * 0.05) * 0.12 + tf.bend;
      ctx.strokeStyle = tf.col; ctx.lineWidth = 2;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(tf.x + k * 3, G);
        ctx.quadraticCurveTo(tf.x + k * 3 + sw * tf.h * 0.5, G - tf.h * 0.6, tf.x + k * 4 + sw * tf.h, G - tf.h * (1 - Math.abs(sw) * 0.3) + Math.abs(k));
        ctx.stroke();
      }
    }
  }

  drawFront(ctx) {
    const cam = this.game.camera, t = this.t, p = this.player;
    // arbustos em primeiro plano (o do segredo fica transparente quando ela está atrás)
    for (const [bx, w, secret] of [[1040, 120, true], [1900, 90], [3000, 110], [5200, 120], [6080, 100]]) {
      if (bx + w < cam.left || bx - w > cam.right) continue;
      const inside = Math.abs(p.cx - bx) < w * 0.7 && p.feet > G - 80;
      const target = secret && inside ? 0.25 : 1;
      this['bushA' + bx] = (this['bushA' + bx] ?? 1) + (target - (this['bushA' + bx] ?? 1)) * 0.12;
      ctx.globalAlpha = this['bushA' + bx];
      ctx.fillStyle = '#2f5d3a';
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(bx - w / 2 + i * (w / 5), G - 14 - Math.sin(i * 1.7) * 10 + Math.sin(t * 1.5 + i) * 1.5, 26, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#3f7449';
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(bx - w / 3 + i * (w / 4), G - 30 - Math.cos(i) * 6, 14, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // folhas caindo
    for (const l of this.leaves) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.r);
      ctx.fillStyle = l.col; ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // vaga-lumes
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const f of this.flies) {
      const x = f.x + Math.sin(t * 0.6 + f.ph) * 40, y = f.y + Math.cos(t * 0.9 + f.ph) * 20;
      if (x < cam.left || x > cam.right) continue;
      const a = 0.3 + 0.3 * Math.sin(t * 3 + f.ph);
      const gr = ctx.createRadialGradient(x, y, 0, x, y, 8);
      gr.addColorStop(0, `rgba(255,240,170,${a})`); gr.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - 8, y - 8, 16, 16);
    }
    ctx.restore();
    // respingo de volta à margem
    if (this.respawnT > 0) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.restore();
    }
  }

  drawScreen(ctx) {
    super.drawScreen(ctx);
    if (this.respawnT > 0) {
      const k = this.respawnT > 0.45 ? (0.9 - this.respawnT) / 0.45 : this.respawnT / 0.4;
      ctx.fillStyle = `rgba(14,10,28,${Math.max(0, Math.min(1, k))})`;
      ctx.fillRect(0, 0, this.game.view.w, 540);
    }
  }

  drawBridge(ctx) {
    const restored = this.getS('ponte', false);
    const k = restored ? (this.bridgeAnim ?? 1) : 0;
    const n = 20, pw = 500 / n;
    for (let i = 0; i < n; i++) {
      const x = RAVINE.x0 + i * pw;
      // quebrada: só restam tábuas penduradas nas pontas
      const broken = i > 2 && i < n - 3;
      let px = x, py = G, rot = 0, alpha = 1;
      if (!restored) {
        if (broken) continue;
        if (i === 2 || i === n - 3) { rot = i === 2 ? 1.1 : -1.1; py = G + 12; }
      } else if (broken) {
        const d = Math.min(1, Math.max(0, k * 1.6 - Math.abs(i - n / 2) / n));
        py = G + (1 - d) * 220; rot = (1 - d) * (i % 2 ? 1 : -1) * 1.2; alpha = d;
      }
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(px + pw / 2, py + 4); ctx.rotate(rot);
      ctx.fillStyle = i % 2 ? '#9a643a' : '#8a5a34'; ctx.fillRect(-pw / 2 + 1, -4, pw - 2, 9);
      ctx.fillStyle = '#b07a4a'; ctx.fillRect(-pw / 2 + 1, -4, pw - 2, 2);
      ctx.restore();
    }
    // cordas
    ctx.strokeStyle = '#c8b07a'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (restored) { ctx.moveTo(RAVINE.x0, G - 44); ctx.quadraticCurveTo(2650, G - 10, RAVINE.x1, G - 44); }
    else { ctx.moveTo(RAVINE.x0, G - 44); ctx.quadraticCurveTo(RAVINE.x0 + 30, G + 40, RAVINE.x0 + 16, G + 110); ctx.moveTo(RAVINE.x1, G - 44); ctx.quadraticCurveTo(RAVINE.x1 - 30, G + 30, RAVINE.x1 - 10, G + 90); }
    ctx.stroke();
  }

  drawGiantFlower(ctx) {
    const healed = this.getS('flor', false);
    const k = healed ? (this.flowerAnim ?? 1) : 0;
    const x = 5360, y = 1150 - k * 4;
    ctx.save();
    ctx.translate(x, y);
    const droop = (1 - k) * 1.1;
    ctx.rotate(droop * 0.6);
    const petals = 7;
    for (let i = 0; i < petals; i++) {
      const a = -Math.PI / 2 + (i / (petals - 1) - 0.5) * (Math.PI * (0.5 + k * 0.9));
      ctx.save(); ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = healed ? '#f07fa0' : '#9a7a80';
      ctx.beginPath(); ctx.ellipse(0, -18 - k * 6, 9, 22 + k * 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = healed ? '#ffd86b' : '#8a7a5a';
    ctx.beginPath(); ctx.ellipse(0, 0, 30 * (0.6 + k * 0.4), 7, 0, 0, Math.PI * 2); ctx.fill();
    if (healed) {
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
      gr.addColorStop(0, `rgba(255,200,220,${0.25 + Math.sin(this.t * 3) * 0.08})`); gr.addColorStop(1, 'rgba(255,190,210,0)');
      ctx.fillStyle = gr; ctx.fillRect(-60, -60, 120, 120);
    }
    ctx.restore();
  }

  drawDoor(ctx) {
    const open = this.getS('porta', false);
    const k = open ? (this.doorAnim ?? 1) : 0;
    ctx.save();
    ctx.translate(4884, 930);
    ctx.fillStyle = '#3a2a22'; ctx.fillRect(0, 0, 32, 70);
    ctx.fillStyle = '#6e4a32';
    for (let i = 0; i < 4; i++) {
      const off = k * 70;
      ctx.fillRect(2 + i * 8, -off * (i % 2 ? 1 : 0.6), 6, 70);
    }
    ctx.restore();
  }

  drawLatch(ctx, h) {
    ctx.strokeStyle = '#c8b07a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(4890, 940); ctx.stroke();
    ctx.fillStyle = '#8a5a34'; ctx.fillRect(h.x - 8, h.y - 5, 16, 10);
    ctx.fillStyle = '#c6a45a'; ctx.beginPath(); ctx.arc(h.x, h.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  drawFruit(ctx, h) {
    ctx.strokeStyle = '#5a3e2e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(h.x, h.y - 30); ctx.lineTo(h.x, h.y - 8); ctx.stroke();
    ctx.fillStyle = '#5f9a52'; ctx.beginPath(); ctx.ellipse(h.x + 6, h.y - 14, 6, 3, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 24);
    gr.addColorStop(0, 'rgba(255,210,110,0.6)'); gr.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = gr; ctx.fillRect(h.x - 24, h.y - 24, 48, 48);
    ctx.restore();
    ctx.fillStyle = '#ffb83e'; ctx.beginPath(); ctx.arc(h.x, h.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(h.x - 3, h.y - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  drawThorns(ctx) {
    const t = this.thorns, k = this.thornBurn || 0;
    ctx.save();
    ctx.globalAlpha = 1 - k * 0.7;
    ctx.strokeStyle = '#2a1a36'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const x = t.x + 4 + i * 5, wob = Math.sin(this.t * 2 + i) * 3;
      ctx.beginPath(); ctx.moveTo(x, t.y + t.h);
      ctx.bezierCurveTo(x - 14 + wob, t.y + t.h * 0.6, x + 14 - wob, t.y + t.h * 0.3, x + wob, t.y - 6 + k * 40);
      ctx.stroke();
    }
    ctx.fillStyle = '#4a2f5e';
    for (let i = 0; i < 14; i++) {
      const x = t.x + (i * 13) % t.w, y = t.y + (i * 29) % t.h;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - 2); ctx.lineTo(x + 1, y + 4); ctx.fill();
    }
    ctx.fillStyle = 'rgba(180,140,230,0.7)';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(t.x + 10 + i * 10, t.y + 30 + i * 30, 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- Peças desenhadas da floresta ----------
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function ground(g, a, b, y, x0, x1) {
  const s = Math.max(a, x0 - 40), e = Math.min(b, x1 + 40);
  if (e <= s) return;
  const dg = g.createLinearGradient(0, y, 0, y + 300);
  dg.addColorStop(0, '#6e4a34'); dg.addColorStop(1, '#3e2a24');
  g.fillStyle = dg; g.fillRect(s, y, e - s, 300);
  const rnd = mulberry32(Math.floor(s));
  g.fillStyle = 'rgba(30,20,15,0.25)';
  for (let x = s; x < e; x += 30) { g.beginPath(); g.ellipse(x + rnd() * 20, y + 40 + rnd() * 200, 6 + rnd() * 10, 4 + rnd() * 6, 0, 0, Math.PI * 2); g.fill(); }
  // raízes
  g.strokeStyle = 'rgba(90,60,40,0.8)'; g.lineWidth = 3;
  for (let x = s; x < e; x += 140) { g.beginPath(); g.moveTo(x, y + 10); g.quadraticCurveTo(x + 30, y + 40, x + 10 + rnd() * 40, y + 80); g.stroke(); }
  // trilha de terra clara
  g.fillStyle = '#a77d55'; g.fillRect(s, y + 6, e - s, 8);
  // borda de grama
  g.fillStyle = '#4f8a4a';
  g.beginPath(); g.moveTo(s, y + 8);
  for (let x = s; x <= e; x += 10) g.lineTo(x, y - 2 + Math.sin(x * 0.13) * 2);
  g.lineTo(e, y + 8); g.closePath(); g.fill();
  g.fillStyle = '#6fae5e'; g.fillRect(s, y - 2, e - s, 3);
}

function trunk(g, x, w, base) {
  const gr = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  gr.addColorStop(0, '#4a3328'); gr.addColorStop(0.45, '#7a563e'); gr.addColorStop(1, '#43302a');
  g.fillStyle = gr; g.fillRect(x - w / 2, CY, w, base - CY);
  g.strokeStyle = 'rgba(40,25,20,0.5)'; g.lineWidth = 2;
  for (let y = CY + 40; y < base; y += 60) { g.beginPath(); g.moveTo(x - w * 0.3, y); g.quadraticCurveTo(x, y + 14, x + w * 0.25, y + 4); g.stroke(); }
  g.fillStyle = '#4a3328';
  g.beginPath(); g.moveTo(x - w, base); g.quadraticCurveTo(x - w / 2, base - 30, x - w / 2, base - 60); g.lineTo(x + w / 2, base - 60); g.quadraticCurveTo(x + w / 2, base - 30, x + w, base); g.fill();
  g.fillStyle = '#5f8a4a';
  g.beginPath(); g.ellipse(x + w * 0.2, base - 140, w * 0.35, 14, 0.4, 0, Math.PI * 2); g.fill();
  // copa
  g.fillStyle = '#356640';
  for (let i = 0; i < 7; i++) { g.beginPath(); g.arc(x + (i - 3) * w * 0.9, CY + 40 + Math.sin(i * 1.9) * 30, w * 1.3, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#4a7e4c';
  for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(x + (i - 1.5) * w, CY + 30 + Math.cos(i) * 20, w * 0.7, 0, Math.PI * 2); g.fill(); }
}

function rock(g, x, y, w, h, seed) {
  const rnd = mulberry32(seed);
  g.fillStyle = '#7d7a88';
  roundRect(g, x, y, w, h, Math.min(18, h / 2)); g.fill();
  g.fillStyle = '#9894a3';
  roundRect(g, x + 6, y + 4, w - 20, Math.min(10, h / 3), 6); g.fill();
  g.fillStyle = '#5f9a52';
  for (let i = 0; i < w / 30; i++) { g.beginPath(); g.ellipse(x + 10 + rnd() * (w - 20), y + 2, 10, 4, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(40,30,50,0.25)';
  g.fillRect(x + 4, y + h - 8, w - 8, 6);
}

function branch(g, x, y, w) {
  g.fillStyle = '#5a3e2e';
  g.beginPath(); g.moveTo(x, y + 2); g.lineTo(x + w, y - 2); g.lineTo(x + w, y + 10); g.lineTo(x, y + 14); g.fill();
  g.fillStyle = '#7a563e'; g.fillRect(x, y, w, 3);
  g.fillStyle = '#4a7e4c';
  for (let i = 0; i <= w; i += 26) { g.beginPath(); g.ellipse(x + i, y + 12, 12, 6, 0.3, 0, Math.PI * 2); g.fill(); }
}

function towerOutside(g) {
  P.stones(g, 60, CY, 380, G - CY, '#b78f8a', 61);
  const sh = g.createLinearGradient(60, 0, 440, 0);
  sh.addColorStop(0, 'rgba(40,20,40,0.45)'); sh.addColorStop(0.6, 'rgba(40,20,40,0)'); sh.addColorStop(1, 'rgba(40,20,40,0.3)');
  g.fillStyle = sh; g.fillRect(60, CY, 380, G - CY);

  // ---------- Atualização ----------
  updateExtra(dt) {
    const p = this.player, g = this.game;
    // beco mais escuro no chão (entre os prédios)
    const inAlley = p.cx > ALLEY.x0 + 40 && p.cx < ALLEY.x1 - 20 && p.feet > 1000;
    this.darkAmt += ((inAlley ? 0.42 : 0) - this.darkAmt) * Math.min(1, dt * 2.5);
    // maçãs
    const mq = Quests.get(g, 'macas');
    if (mq && !mq.done && mq.step === 0) {
      APPLES.forEach(([x, y], i) => {
        if (this.getS('maca' + i, false)) return;
        if (Math.hypot(p.cx - x, p.cy - y) < 34) {
          this.setS('maca' + i, true);
          this.sparkle(x, y, 8);
          Quests.count(g, 'macas', 1);
        }
      });
    }
    this.kite.hidden = !(Quests.active(g, 'pipa') && Quests.get(g, 'pipa').step === 0);
    // Tito e Tércia mostram que têm algo a dizer
    this.tito.questMark = !Quests.get(g, 'pipa') ? '?' : (Quests.get(g, 'pipa').step === 1 && !Quests.done(g, 'pipa') ? '!' : null);
    this.tercia.questMark = !Quests.get(g, 'macas') ? '?' : (Quests.get(g, 'macas').step === 1 && !Quests.done(g, 'macas') ? '!' : null);
    const step = Quests.get(g, 'mapa')?.step ?? -1;
    this.anselmo.questMark = step === 0 ? '!' : null;
    for (const cr of this.critters) {
      if (cr.id === 'odila') cr.questMark = step === 1 ? '!' : null;
      if (cr.id === 'bruno') cr.questMark = step === 2 ? '!' : null;
      if (cr.id === 'graca') cr.questMark = !Quests.get(g, 'fonte') ? '?' : (Quests.get(g, 'fonte').step === 1 && !Quests.done(g, 'fonte') ? '!' : null);
    }
    // Caio saindo do telhado
    const c = this.caio;
    if (c.leaving > 0) {
      c.leaving -= dt; c.moving = true; c.walkPh += dt * 14; c.x += 160 * dt;
      if (c.leaving <= 0) { c.leaving = 0; c.talking = false; this.placeCaio(); }
    }
    if (this.fountainK != null && this.fountainK < 1) this.fountainK = Math.min(1, this.fountainK + dt * 0.8);
  }

  // ---------- Desenho ----------
  drawBackground(ctx) { drawReinoBackground(ctx, this.game.camera, this.t); }

  renderStatic() {
    const res = Math.min(1.25, Math.max(1, this.game.pixelScale || 1));
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res); g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }

  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) {
      if (ch.x > cam.right || ch.x + CHUNK < cam.left) continue;
      ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
    }
  }

  drawStatic(g, x0, x1) {
    const vis = (a, b) => b >= x0 - 80 && a <= x1 + 80;
    const rnd = mulberry32(3);
    // muralha da cidade ao fundo, de ponta a ponta
    g.fillStyle = '#c8b8a8'; g.fillRect(420, 980, 6900, 220);
    g.fillStyle = '#b8a898';
    for (let x = 420; x < 7320; x += 22) g.fillRect(x, 966, 14, 14);
    // floresta no começo
    if (vis(0, 460)) {
      for (const [tx, w] of [[120, 40], [300, 34], [400, 30]]) {
        g.fillStyle = '#5a3e2e'; g.fillRect(tx - w / 2, CY, w, G - CY);
        g.fillStyle = '#3f6e47';
        for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(tx + (i - 3) * w, CY + 60 + Math.sin(i) * 30, w * 1.4, 0, Math.PI * 2); g.fill(); }
      }
    }
    // portão da cidade
    if (vis(420, 760)) cityGate(g, 440, G);
    // chão: pedras da rua
    street(g, 60, BRIDGE.x0, x0, x1);
    street(g, BRIDGE.x1, 7340, x0, x1);
    if (vis(BRIDGE.x0, BRIDGE.x1)) bridge(g);
    for (const hs of HOUSES) if (vis(hs.x, hs.x + hs.w)) house(g, hs);
    // canteiros da praça e bancos
    if (vis(2400, 3700)) {
      for (const bx of [2620, 3250]) flowerBed(g, bx, G, rnd);
      bench(g, 3230); bench(g, 2420 + 380);
      noticeBoard(g, 2440); wanted(g, 2520);
    }
    if (vis(2880, 3120)) fountainStone(g);
    if (vis(3300, 3560)) lanternStand(g, 3400);
    for (const s of STALLS) if (vis(s.x - 110, s.x + 110)) stall(g, s);
    if (vis(4380, 4520)) { g.fillStyle = '#6e4a32'; g.fillRect(4400, 975, 110, 6); g.fillRect(4400, 975, 4, 85); g.fillRect(4506, 975, 4, 85); }
    if (vis(4900, 5460)) tavern(g, 4920);
    if (vis(ALLEY.x0, ALLEY.x1)) alley(g);
    if (vis(6320, 7340)) {
      g.fillStyle = '#8f8a9a'; roundRect(g, 6520, 1150, 60, 50, 8); g.fill();
      g.fillStyle = '#5a3e2e'; g.fillRect(6516, 1110, 6, 44); g.fillRect(6578, 1110, 6, 44); g.fillRect(6512, 1106, 76, 6);
      // escada do cais
      g.fillStyle = '#a99c8c';
      for (let i = 0; i < 5; i++) g.fillRect(6700 + i * 18, G - 4 + i * 0, 90 - i * 18, 4);
      g.fillStyle = '#7a8fb0'; g.fillRect(6690, G + 20, 120, 40);
      signpost(g, 6660, G, 'Cais');
      castleGate(g, 7060);
    }
    // lampiões
    for (const lx of [1250, 2480, 2720, 3280, 3700, 4880, 5460, 6420, 6900]) if (vis(lx - 10, lx + 10)) lampPost(g, lx);
  }

  drawBack(ctx) {
    const cam = this.game.camera, t = this.t;
    const on = (x, pad = 120) => x > cam.left - pad && x < cam.right + pad;
    // rio sob a ponte
    if (on(BRIDGE.x0, 520)) {
      ctx.fillStyle = 'rgba(110,160,210,0.9)'; ctx.fillRect(BRIDGE.x0 + 10, G + 60, BRIDGE.x1 - BRIDGE.x0 - 20, 240);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 12; i++) {
        const xx = BRIDGE.x0 + 20 + ((i * 47 + t * 30) % 460);
        ctx.beginPath(); ctx.moveTo(xx, G + 80 + (i % 4) * 30); ctx.lineTo(xx + 18, G + 80 + (i % 4) * 30); ctx.stroke();
      }
    }
    // fonte
    if (on(3000)) this.drawFountain(ctx);
    // bandeirinhas na praça e no mercado
    if (on(3000, 900) || on(4300, 700)) bunting(ctx, 2450, 3650, 930, t), bunting(ctx, 3700, 4800, 950, t);
    // maçãs
    const mq = Quests.get(this.game, 'macas');
    if (mq && !mq.done && mq.step === 0) {
      APPLES.forEach(([x, y], i) => {
        if (this.getS('maca' + i, false) || !on(x)) return;
        const yy = y + Math.sin(t * 3 + i) * 1.5;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const gr = ctx.createRadialGradient(x, yy, 0, x, yy, 16); gr.addColorStop(0, 'rgba(255,200,150,0.5)'); gr.addColorStop(1, 'rgba(255,190,140,0)');

  }

    obj('subir', 80, 120, 60, 'Voltar para a cidade', FT.voltar, { use: () => this.say(FT.voltar, () => g.scenes.go('reino', { spawn: 'cais' })) });
    obj('mesa', 1730, 120, 40, 'Mesa comprida', FT.mesa);

      zone: { x0: 4760, x1: 4900, y0: G - 6, y1: G + 4 },

      use: () => this.startLanternScene(),

  // ---------- atividades ----------
  askFood() {
    const g = this.game, fia = this.critters.find((c) => c.id === 'fia');
    fia.talking = true;
    g.ui.ask(FT.fia, FT.fiaOpcoes, (i) => {
      g.ui.say(FT.fiaRes[i], () => { fia.talking = false; });
      if (i < 3) {
        this.activity('doce');
        g.audio?.sfx('pega');
        if (i === 0) { g.state.brilho = 100; this.player.boostGlow(1); }
        this.player.setExpr(i === 1 ? 'surpresa' : 'calma', 2);
      }
    });
  }

  askBells() {
    const g = this.game, z = this.critters.find((c) => c.id === 'zeca');
    z.talking = true;
    g.ui.ask(this.getS('act-sinos', false) ? FT.zecaDepois : FT.zeca, FT.zecaOpcoes, (i) => {
      z.talking = false;
      if (i === 0) this.startBells();
    });
  }

  startBells() {
    this.mini = { round: 0, hits: 0, pos: 0, dir: 1, speed: 0.9, zone: this.bellZone(0.16), flash: 0, result: null, wait: 0.5, marks: [] };
    this.game.ui.notify(this.game.ui.touch ? 'Toque Agir ou Pular no dourado!' : 'Aperte E ou Espaço no dourado!', 2.4);
  }
  bellZone(w) { const a = 0.15 + Math.random() * (0.7 - w); return [a, a + w]; }

  updateBells(dt) {
    const m = this.mini, inp = this.game.input;
    m.flash = Math.max(0, m.flash - dt * 2.5);
    if (m.wait > 0) { m.wait -= dt; inp.consume('interact'); inp.consume('jump'); return; }
    m.pos += m.dir * m.speed * dt;
    if (m.pos > 1) { m.pos = 1; m.dir = -1; }
    if (m.pos < 0) { m.pos = 0; m.dir = 1; }
    if (inp.hit('interact') || inp.hit('jump') || inp.hit('confirm')) {
      inp.consume('interact'); inp.consume('jump'); inp.consume('confirm');
      const hit = m.pos >= m.zone[0] && m.pos <= m.zone[1];
      m.marks.push(hit);
      if (hit) { m.hits++; m.flash = 1; this.game.audio?.sfx('sino'); this.sparkle(2780, 1040, 8); }
      else this.game.audio?.sfx('erro');
      m.round++;
      if (m.round >= 3) {
        const hits = m.hits;
        setTimeout(() => {
          this.mini = null;
          this.activity('sinos');
          if (hits >= 2) { this.game.state.brilho = 100; this.player.boostGlow(1); }
          if (hits === 3) this.player.setExpr('surpresa', 2);
          this.say(FT.zecaRes[hits]);
        }, 700);
        m.wait = 9;
      } else {
        m.speed += 0.35; m.zone = this.bellZone(0.16 - m.round * 0.03); m.wait = 0.45;
      }
    }
  }

  askDance() {
    const g = this.game;
    g.ui.ask({ who: 'Dançarina', text: 'Vem dançar com a gente? É só seguir a roda!' }, ['Dançar!', 'Agora não'], (i) => {
      if (i !== 0) return;
      const x0 = this.player.cx;
      this.cutscene = new Cutscene(this, [
        { walk: x0 + 50 }, { do: (a) => { a.player.vy = -360; a.player.onGround = false; } }, { wait: 0.35 },
        { face: -1 }, { walk: x0 - 30 }, { do: (a) => { a.player.vy = -360; a.player.onGround = false; a.player.boostGlow(1); } }, { wait: 0.35 },
        { face: 1 }, { walk: x0 + 20 }, { do: (a) => { a.player.vy = -420; a.player.onGround = false; a.sparkle(a.player.cx, a.player.y, 12); } }, { wait: 0.6 },
        { say: FT.danca },
      ], () => this.activity('danca'));
    });
  }

  spawnAmbient(anywhere = false) {
    const cam = this.game.camera, z = 0.25 + Math.random() * 0.4;
    const VW = cam.vw, sx = Math.random() * (VW + 40) - 20, sy = anywhere ? 40 + Math.random() * 300 : 330 + Math.random() * 60;
    this.sky.spawn(cam.x + (sx - VW / 2) / (z * cam.zoom), cam.y + (sy - 270) / (z * cam.zoom), z);
  }

  // lançamento: lanternas nascem da água do rio, em várias profundidades
  spawnLaunch() {
    const cam = this.game.camera, z = Math.random() < 0.6 ? 0.3 + Math.random() * 0.4 : 0.7 + Math.random() * 0.45;
    const ws = cam.toScreen(4600, WATER.y);
    const VW = cam.vw, sx = Math.max(ws.x, -20) + Math.random() * (VW + 40 - Math.max(ws.x, -20)), sy = Math.min(520, ws.y + 10 + Math.random() * 30);
    this.sky.spawn(cam.x + (sx - VW / 2) / (z * cam.zoom), cam.y + (sy - 270) / (z * cam.zoom), z, { speed: 1.1 });
  }

  onEnter() {
    const g = this.game;
    g.audio?.music('festa');
    if (!Quests.get(g, 'festival')) {
      Quests.start(g, 'festival');
      setTimeout(() => this.say(FT.chegada), 800);
    }
  }
  exit() { super.exit(); this.game.audio?.music(null); this.game.cinematic = false; }

  // ---------- atualização ----------
  updateExtra(dt) {
    const g = this.game, p = this.player, q = this.q;
    if (this.mini) this.updateBells(dt);
    // lanternas no céu
    this.sky.update(dt);
    this.spawnAcc = (this.spawnAcc || 0) + dt * (this.launching > 0 ? (g.lowFx ? 14 : 26) : this.showRate);
    while (this.spawnAcc > 1) { this.spawnAcc--; this.launching > 0 ? this.spawnLaunch() : this.spawnAmbient(); }
    if (this.launching > 0) this.launching -= dt;
    for (const o of this.orbit || []) {
      o.a += dt * o.w;
      o.l.x = p.cx + Math.cos(o.a) * o.r; o.l.y = p.y + 10 + Math.sin(o.a) * o.r * 0.45 - o.rise;
      o.rise += dt * 6;
    }
    // música mais alta perto do palco
    const dStage = Math.abs(p.cx - 2040);
    g.audio?.setNear(this.cutscene && this.cutsceneMain ? 1 : Math.max(0.45, 1 - dStage / 2600));
    // progresso da missão principal
    if (q && !q.done && q.step === 1) {
      const n = this.actCount();
      if (n !== q.n) { q.n = n; Quests.refresh(g); }
      if (n >= 3) { Quests.step(g, 'festival', 2); this.caio.say('Está quase na hora!'); }
    }
    // marcas de missão
    for (const n of this.wishers) n.questMark = n.wishMark();
    const mark = (id, quest, stepNeeded) => { const c = this.critters.find((x) => x.id === id); if (!c) return; const qq = Quests.get(g, quest); c.questMark = !qq ? '?' : (!qq.done && qq.step === stepNeeded ? '!' : null); };
    mark('lucia', 'fitas', 1); mark('benta', 'desejos', 1); mark('nara', 'mastro', 1);
    this.caio.questMark = q && q.step === 0 ? '!' : null;
    this.lostLantern.hidden = !(Quests.active(g, 'mastro') && Quests.get(g, 'mastro').step === 0);
    // fitas
    const fq = Quests.get(g, 'fitas');
    if (fq && !fq.done && fq.step === 0) {
      RIBBONS.forEach(([x, y], i) => {
        if (this.getS('fita' + i, false)) return;
        if (Math.hypot(p.cx - x, p.cy - y) < 36) { this.setS('fita' + i, true); this.sparkle(x, y, 8); g.audio?.sfx('pega'); Quests.count(g, 'fitas'); }
      });
    }
    // Caio acompanha a Lira
    this.updateCompanion(dt);
    // queda no rio
    if (this.respawnT > 0) {
      this.respawnT -= dt;
      if (this.respawnT <= 0.4 && !this.respawned) {
        this.respawned = true;
        p.x = 4860 - p.w / 2; p.y = G - p.h; p.vx = p.vy = 0; p.swing = null; p.anim.set('idle');
        p.hair.reset(p.cx, p.feet - 54, p.facing);
        this.camY = p.cy - 30; g.camera.snap(p.cx, this.camY);
      }
    } else if (p.feet > WATER.y + 30 && p.cx > WATER.x0) {
      this.respawnT = 0.9; this.respawned = false;
      for (let i = 0; i < 14; i++) this.fx.emit({ x: p.cx, y: WATER.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 200, g: 500, size: 2, life: 0.7, color: '#d6f0ff' });
      g.ui.notify('Splash! De volta ao cais.');
    }
    // barras de cinema
    this.lb += ((g.cinematic ? 1 : 0) - this.lb) * Math.min(1, dt * 3);
  }

  updateCompanion(dt) {
    const c = this.caio, p = this.player;
    if (!c.follow || c.scripted || c.talking) return;
    const tx = p.cx - p.facing * 55, d = tx - c.x;
    const high = p.feet < G - 40 || p.cx > WATER.x0 - 20;
    if (high) {
      c.moving = false;
      c.dir = Math.sign(p.cx - c.x) || 1;
      if (!c.saidWait && Math.abs(p.cx - c.x) > 120) { c.say(FT.caioEspera[0]); c.saidWait = true; }
      return;
    }
    c.saidWait = false;
    if (Math.abs(p.cx - c.x) > 900) { c.x = p.cx - p.facing * 500; }
    if (Math.abs(d) > 30) {
      const sp = Math.abs(d) > 220 ? 270 : 150;
      c.dir = Math.sign(d); c.x += c.dir * Math.min(Math.abs(d), sp * dt); c.moving = true;
      c.walkPh += dt * sp * 0.13;
      c.x = Math.min(c.x, WATER.x0 - 30);
    } else { c.moving = false; c.dir = Math.sign(p.cx - c.x) || c.dir; }
    // comentários pelo caminho
    const spots = [[730, 'Prova o bolo de mel. Confia em mim.'], [2040, 'Essa música! Todo mundo sabe essa música.'], [2780, 'O Vovô Zeca rouba no jogo dos sinos. Mentira, ele só é rápido.'], [3350, 'A lanterna dos desejos é a maior de todas.'], [4500, 'Daqui dá para ver o castelo inteiro.']];
    for (const [x, line] of spots) {
      const key = 'fala' + x;
      if (!this[key] && Math.abs(p.cx - x) < 120) { this[key] = true; c.say(line, 3.2); }
    }
  }

  // ---------- a cena das lanternas ----------
  startLanternScene() {
    const g = this.game, p = this.player, c = this.caio, a = this;
    g.cinematic = true;
    this.cutsceneMain = true;
    c.scripted = true; c.follow = false;
    g.audio?.music('lanternas');
    const bells = () => { [0, 900, 1800].forEach((ms) => setTimeout(() => g.audio?.sfx('sino'), ms)); };

  makeOrbit() {
    this.orbit = [];
    const n = this.game.lowFx ? 7 : 12;
    for (let i = 0; i < n; i++) {
      const l = this.sky.spawn(this.player.cx, this.player.y, 1, { size: 0.9, speed: 0 });
      l.vy = 0; l.sway = 0; l.keep = true;
      this.orbit.push({ l, a: (i / n) * Math.PI * 2, r: 70 + (i % 3) * 22, w: 0.8 + (i % 2) * 0.3, rise: 0 });
    }
  }
  releaseOrbit() {
    for (const o of this.orbit || []) { o.l.vy = -24 - Math.random() * 10; o.l.sway = 8; o.l.keep = false; }
    this.orbit = null;
  }

  drawBackground(ctx) {

    for (const s of this.stars) {

  renderStatic() {
    const res = Math.min(1.25, Math.max(1, this.game.pixelScale || 1));
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res); g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }
  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) if (!(ch.x > cam.right || ch.x + CHUNK < cam.left)) ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
  }

  drawBack(ctx) {
    const cam = this.game.camera, t = this.t;
    // rio
    if (cam.right > PIER.x0 - 200) {
      const wx = Math.max(PIER.x0, cam.left - 10);
      const wg = ctx.createLinearGradient(0, WATER.y, 0, 1500);
      wg.addColorStop(0, 'rgba(40,60,110,0.95)'); wg.addColorStop(1, 'rgba(14,20,48,1)');
      ctx.fillStyle = wg; ctx.fillRect(Math.max(WATER.x0, cam.left - 10), WATER.y, cam.right - wx + 20, 260);
      // brilhos na água
      ctx.fillStyle = 'rgba(255,214,150,0.35)';
      for (let i = 0; i < 26; i++) {
        const x = WATER.x0 + ((i * 97 + t * 14) % 1440), y = WATER.y + 10 + (i % 7) * 30 + Math.sin(t * 2 + i) * 2;
        if (x < cam.left || x > cam.right) continue;
        ctx.fillRect(x, y, 14 + (i % 3) * 8, 1.5);
      }
    }
    // barcos com mastro (balançam um pouco)
    for (const [i, b] of BOATS.entries()) {
      if (b.x + b.w < cam.left - 60 || b.x > cam.right + 60) continue;
      const bob = Math.sin(t * 1.4 + i) * 1.5;
      ctx.save(); ctx.translate(0, bob);
      ctx.fillStyle = ['#7a3a3a', '#3a5a7a', '#5a4a2a'][i];
      ctx.beginPath(); ctx.moveTo(b.x - 10, 1215); ctx.lineTo(b.x + b.w + 14, 1215); ctx.lineTo(b.x + b.w - 14, 1262); ctx.lineTo(b.x + 14, 1262); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c8a24a'; ctx.fillRect(b.x - 6, 1214, b.w + 16, 4);
      ctx.fillStyle = '#4a3020'; ctx.fillRect(b.mast - 3, b.mh - 10, 6, 1215 - b.mh + 10);
      // bandeirinhas do mastro até a proa
      ctx.strokeStyle = 'rgba(60,40,30,0.9)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.mast, b.mh + 10); ctx.lineTo(b.x + b.w, 1210); ctx.stroke();
      for (let k = 1; k < 7; k++) {
        const x = b.mast + (b.x + b.w - b.mast) * (k / 7), y = b.mh + 10 + (1200 - b.mh) * (k / 7);
        ctx.fillStyle = BULB_COLS[k % 5]; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#c6a45a'; ctx.beginPath(); ctx.arc(b.mast, b.mh, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffcf6a'; roundRect(ctx, b.x + b.w / 2 - 6, 1188, 12, 16, 4); ctx.fill();
      ctx.restore();
    }
    // cesto da gávea
    if (cam.right > 5600) { ctx.fillStyle = '#5a3a26'; ctx.fillRect(5675, 880, 90, 8); ctx.fillRect(5675, 862, 4, 20); ctx.fillRect(5761, 862, 4, 20); ctx.fillRect(5675, 862, 90, 3); ctx.fillStyle = '#c6a45a'; ctx.beginPath(); ctx.arc(5720, 822, 5, 0, Math.PI * 2); ctx.fill(); }
    // varais de luzes
    for (const [x0, x1, y, sag] of STRINGS) {
      if (x1 < cam.left - 20 || x0 > cam.right + 20) continue;
      ctx.strokeStyle = 'rgba(40,30,40,0.9)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.quadraticCurveTo((x0 + x1) / 2, y + sag * 2, x1, y); ctx.stroke();
      const n = Math.floor((x1 - x0) / 40);
      for (let i = 1; i < n; i++) {
        const k = i / n, x = x0 + (x1 - x0) * k, yy = y + 4 * sag * k * (1 - k);
        if (x < cam.left - 10 || x > cam.right + 10) continue;
        const sw = Math.sin(t * 1.6 + i) * 1.5;
        ctx.strokeStyle = 'rgba(40,30,40,0.9)'; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + sw, yy + 6); ctx.stroke();
        ctx.fillStyle = BULB_COLS[i % 5];
        roundRect(ctx, x + sw - 5, yy + 6, 10, 12, 4); ctx.fill();
        if (i % 2) { ctx.fillStyle = ['#e0584a', '#f2c14e', '#4f86c6'][i % 3]; ctx.beginPath(); ctx.moveTo(x + 14, yy + 2); ctx.lineTo(x + 26, yy + 2); ctx.lineTo(x + 20 + sw, yy + 16); ctx.fill(); }
      }
    }
    // lanterna dos desejos (papel)
    if (cam.right > 3250 && cam.left < 3450 && !(this.bigLantern)) {
      const fl = 0.9 + Math.sin(t * 7) * 0.05;
      ctx.fillStyle = `rgba(255,${190 + fl * 20},120,1)`;
      ctx.beginPath(); ctx.moveTo(3310, 990); ctx.lineTo(3390, 990); ctx.lineTo(3380, 1076); ctx.lineTo(3320, 1076); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3cf'; ctx.fillRect(3330, 1030, 40, 30);
      P.sunSymbol(ctx, 3350, 1012, 8, '#c88a2a', 0.9);
    }
    // fitas para coletar
    const fq = Quests.get(this.game, 'fitas');
    if (fq && !fq.done && fq.step === 0) {
      RIBBONS.forEach(([x, y], i) => {
        if (this.getS('fita' + i, false) || x < cam.left - 30 || x > cam.right + 30) return;
        const yy = y + Math.sin(t * 3 + i) * 2;
        ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(halo('ouro'), x - 18, yy - 18, 36, 36); ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - 8, yy - 4); ctx.quadraticCurveTo(x, yy + 6 + Math.sin(t * 5 + i) * 3, x + 8, yy - 2); ctx.stroke();
      });
    }
  }

  drawFront(ctx) {

  // iluminação noturna + lanternas próximas + barras de cinema + mini-jogo
  drawScreen(ctx) {
    const W = this.game.view.w, H = 540, cam = this.game.camera, p = this.player, low = this.game.lowFx;
    const sc = low ? 0.5 : 1;
    if (!this.nightMask) { this.nightMask = document.createElement('canvas'); }
    const mc = this.nightMask;
    if (mc.width !== W * sc) { mc.width = W * sc; mc.height = H * sc; }
    const m = mc.getContext('2d');
    m.setTransform(sc, 0, 0, sc, 0, 0);
    m.globalCompositeOperation = 'source-over';
    m.clearRect(0, 0, W, H);
    m.fillStyle = 'rgba(8,6,26,0.5)';
    m.fillRect(0, 0, W, H);
    m.globalCompositeOperation = 'destination-out';
    const H0 = halo('ouro');
    const hole = (wx, wy, r, a = 1) => {
      const s = cam.toScreen(wx, wy), rr = r * cam.zoom;
      if (s.x < -rr || s.x > W + rr || s.y < -rr || s.y > H + rr) return;
      m.globalAlpha = a; m.drawImage(H0, s.x - rr, s.y - rr, rr * 2, rr * 2);
    };
    for (const l of this.lights) hole(l.x, l.y, l.r * (l.fire ? 0.95 + Math.sin(this.t * 11 + l.x) * 0.05 : 1), 1);
    hole(p.cx, p.y + 10, 140 + p.glowLevel * 60, 1);
    if (this.caio.follow || this.caio.scripted) hole(this.caio.x, this.caio.y - 40, 90, 0.8);
    m.globalAlpha = 1;
    ctx.drawImage(mc, 0, 0, W, H);
    // luz quente por cima
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const l of this.lights) {
      const s = cam.toScreen(l.x, l.y), rr = l.r * 0.8 * cam.zoom;
      if (s.x < -rr || s.x > W + rr || s.y < -rr || s.y > H + rr) continue;

  // ---------- portas e quartos ----------
  goRoom(x, facing, room) {
    if (this.fade > 0) return;
    const g = this.game, p = this.player;
    this.fade = 0.001;
    this.fadeTo = () => {
      p.x = x - p.w / 2; p.y = UP - p.h; p.vx = p.vy = 0; p.facing = facing;
      p.hair.reset(p.cx, p.feet - 54, facing);
      g.camera.limit = room ? { x0: room.x0 - 20, x1: room.x1 + 20 } : { x0: 0, x1: 6440 };
      this.camY = p.cy - 30; g.camera.snap(p.cx, this.camY);
      g.audio?.sfx('pega');
    };
  }

  openNursery() {
    const g = this.game;
    if (this.getS('bercario', false)) { this.goRoom(ROOM_B.x0 + 70, 1, ROOM_B); return; }
    if (!g.state.flag('chave-prata')) { this.say(CT.bercarioTrancado); return; }
    this.setS('bercario', true);
    this.say(CT.bercarioAbre, () => {
      Quests.step(g, 'lembranca', 1);
      this.addMusicRestore();
      this.goRoom(ROOM_B.x0 + 70, 1, ROOM_B);
      setTimeout(() => this.say(CT.bercario), 900);
    });
  }

  // ---------- enigmas ----------
  turnSwan(i) {
    const g = this.game;
    if (this.getS('cisnes', false)) { this.say([CT.cisne(3)]); return; }
    if (!Quests.get(g, 'cisnes')) Quests.start(g, 'cisnes');
    const d = (this.getS('cisne' + i, i) + 1) % 4;
    this.setS('cisne' + i, d);
    this.swanTurn = { i, t: 0 };
    g.audio?.sfx(d === 3 ? 'sino' : 'pega');
    if (SWANS.every((_, k) => this.getS('cisne' + k, k) === 3)) {
      this.setS('cisnes', true);
      const s = this.hedgeGate; if (s) this.solids = this.solids.filter((x) => x !== s);
      this.hedgeK = 0;
      Quests.step(g, 'cisnes', 1);
      g.camera.shake(2, 0.25);
      this.say(CT.cisnesResolvido);
    } else this.say([CT.cisne(d)]);
  }

  readPoem() {
    const g = this.game;
    this.setS('poema', true);
    this.say(CT.poema, () => { if (Quests.active(g, 'documento')) g.ui.notify('Puxe os livros com os cabelos (' + g.ui.fmt('{Q}') + ')'); });
  }

  pullBook(id, h) {
    const g = this.game;
    h.used = true;
    const seq = this.bookSeq || (this.bookSeq = []);
    seq.push(id);
    const ok = seq.every((b, k) => b === ORDER[k]);
    if (!ok) {
      g.audio?.sfx('erro');
      this.bookShake = 0.6;
      setTimeout(() => { this.bookSeq = []; for (const b of this.books) b.used = false; }, 600);
      this.say(CT.livroErrado);
      return;
    }
    g.audio?.sfx('sino');
    if (seq.length < 3) { g.ui.notify(CT.livroCerto(seq.length)); return; }
    // a estante gira e abre a passagem
    this.setS('passagem', true);
    this.solved = true;
    const s = this.secretWall; if (s) this.solids = this.solids.filter((x) => x !== s);
    this.shelfK = 0;
    g.camera.shake(3, 0.5);
    Quests.step(g, 'documento', 1);
    this.say(CT.passagemAbre);
  }

    const g = this.game, p = this.player, q = this.rainha2, a = this;
    g.audio?.music('ninar');
    const walkQ = (x) => ({ until: (t) => { const d = x - q.x; if (Math.abs(d) < 3) { q.moving = false; return true; } q.dir = Math.sign(d); q.x += q.dir * Math.min(Math.abs(d), 1.2); q.moving = true; q.walkPh += 0.18; return t > 8; } });
    this.cutscene = new Cutscene(this, [
      { cam: { x: 7320, y: UP - 60, zoom: 1.3, rate: 1.2 } },
      { face: 1 }, { wait: 0.6 },
      { say: CT.lembranca1 },
      { do: () => { a.holdPose = true; p.boostGlow(2.2); a.memory = 0.001; g.audio?.sfx('magia'); p.setExpr('surpresa', 3); } },
      { wait: 1.8 },
      { say: CT.lembranca2 },
      { do: () => { a.memoryOut = true; } }, { wait: 1.2 },
      { do: () => { a.holdPose = false; q.hidden = false; q.x = ROOM_B.x0 + 40; q.dir = 1; g.audio?.sfx('pega'); } },
      { cam: { x: 7250, y: UP - 60, zoom: 1.15, rate: 0.8 } },
      walkQ(7170), { face: -1 },
      { say: CT.lembranca3.slice(0, 2) },
      { do: () => p.setExpr('pensativa', 6) },
      { say: CT.lembranca3.slice(2, 4) },
      walkQ(7230),
      { do: () => { p.boostGlow(1.5); a.sparkle(p.cx, p.y + 10, 20); } },
      { say: CT.lembranca3.slice(4) },
      { say: CT.lembranca4 },
      { cam: { x: null } },
    ], () => {

      g.audio?.music('castelo');

  // ---------- atualização ----------
  updateExtra(dt) {
    const g = this.game, p = this.player;
    // troca de sala com escurecida rápida
    if (this.fade > 0) {
      this.fade += dt * 4;
      if (this.fadeTo && this.fade >= 1) { this.fadeTo(); this.fadeTo = null; }
      if (this.fade >= 2) this.fade = 0;
    }
    // a câmera não mostra os quartos vizinhos
    if (!this.fade) g.camera.limit = p.cx > ROOM_B.x0 - 10 ? { x0: ROOM_B.x0 - 20, x1: ROOM_B.x1 + 20 } : p.cx > ROOM_A.x0 - 10 ? { x0: ROOM_A.x0 - 20, x1: ROOM_A.x1 + 20 } : { x0: 0, x1: 6440 };
    // sala secreta: escura até acender as velas
    const inSecret = p.cx < SECRET.x1 + 10 && p.cx > SECRET.x0 && p.feet <= UP + 6 && this.getS('passagem', false);
    const lit = this.getS('velas', 0);
    const want = inSecret ? (this.getS('sol', false) ? 0.25 : lit >= 3 ? 0.55 : 0.97) : 0;
    this.darkAmt += (want - this.darkAmt) * Math.min(1, dt * 3);
    this.darkLights = [];
    CANDLES.forEach(([x, y], i) => {
      const on = this.getS('vela' + i, false);
      if (on) this.darkLights.push({ x, y: y - 10, r: 120, a: 0.9 });
      else if (inSecret && p.lume && Math.hypot(p.cx - x, p.cy - y) < 130) {
        this.setS('vela' + i, true);
        this.setS('velas', lit + 1);
        this.sparkle(x, y - 10, 12);
        g.audio?.sfx('magia');
        if (lit + 1 >= 3) { this.addSunRestore(); Quests.step(g, 'documento', 2); this.say(CT.salaAcesa); }
        else g.ui.notify(CT.velaAcesa);
      }
    });
    if (this.getS('sol', false)) this.darkLights.push({ x: 3025, y: 575, r: 220, a: 0.9 });
    if (inSecret && !lit && !this.saidDark && !g.ui.dialogOpen) { this.saidDark = true; this.say(CT.salaEscura); }
    // fragmentos de vitral (pegar encostando)
    for (const f of FRAGS) {
      if (f.from || this.fragGot(f.id)) continue;
      if (f.needLit && lit < 3) continue;
      if (Math.hypot(p.cx - f.x, p.cy - f.y) < 34) this.takeFrag(f.id);
    }
    // livros visíveis só quando a missão chega lá
    const dq = Quests.get(g, 'documento');
    for (const b of this.books) b.hidden = !(dq && !dq.done && dq.step === 0 && this.getS('poema', false));
    // marcas de missão
    const cq = Quests.get(g, 'convite');
    this.rainha.questMark = cq && cq.step === 0 ? '!' : null;
    const cle = this.critters.find((c) => c.id === 'clementina');
    if (cle) cle.questMark = cq && !cq.done && cq.step === 1 ? '!' : null;
    const rq = Quests.get(g, 'roseiras');
    this.tome.questMark = !rq ? '?' : (!rq.done && rq.step === 1 ? '!' : null);
    // animações de abrir
    if (this.shelfK != null && this.shelfK < 1) this.shelfK = Math.min(1, this.shelfK + dt * 0.7);
    if (this.hedgeK != null && this.hedgeK < 1) this.hedgeK = Math.min(1, this.hedgeK + dt * 0.8);
    if (this.waterK != null && this.waterK < 1) this.waterK = Math.min(1, this.waterK + dt * 0.8);
    if (this.vitralK != null && this.vitralK < 1) this.vitralK = Math.min(1, this.vitralK + dt * 0.5);
    if (this.sunK != null && this.sunK < 1) this.sunK = Math.min(1, this.sunK + dt * 0.8);
    if (this.bookShake > 0) this.bookShake -= dt;
    if (this.swanTurn) { this.swanTurn.t += dt; if (this.swanTurn.t > 0.4) this.swanTurn = null; }
    if (this.memory > 0) this.memory = this.memoryOut ? Math.max(0, this.memory - dt * 0.8) : Math.min(1, this.memory + dt * 0.7);
  }

  // ---------- desenho ----------
  drawBackground(ctx) { drawReinoBackground(ctx, this.game.camera, this.t); }

  renderStatic() {
    const res = this.game.quality === 'alta' ? Math.min(1.25, Math.max(1, this.game.pixelScale || 1)) : 1;
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res); g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }

  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) {
      if (ch.x > cam.right || ch.x + CHUNK < cam.left) continue;
      ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
    }
  }

  drawStatic(g, x0, x1) {
    const vis = (a, b) => b >= x0 - 60 && a <= x1 + 60;
    const rnd = mulberry32(17);
    // ---------- lado de fora ----------
    if (vis(0, FACADE)) {
      // muralha baixa ao fundo e grama
      g.fillStyle = '#c9bca8'; g.fillRect(60, 1010, FACADE - 60, 190);
      g.fillStyle = '#b8aa94'; for (let x = 60; x < FACADE; x += 26) g.fillRect(x, 996, 16, 14);
      g.fillStyle = '#7fae5a'; g.fillRect(1500, 1150, FACADE - 1500, 50);
      // chão: pedras do pátio e caminho do jardim
      courtyard(g, 60, 1500);
      gardenPath(g, 1500, FACADE + 40);
      if (vis(380, 720)) gateArch(g, 380);
      if (vis(700, 1500)) { lampPost(g, 760); lampPost(g, 1440); planter(g, 880); planter(g, 1320); }
      if (vis(1500, FACADE)) garden(g, rnd);
      facade(g);
    }
    // ---------- térreo ----------
    if (vis(2800, 4000)) throneHall(g);
    if (vis(4000, STAIR.x1)) ballroom(g);
    if (vis(STAIR.x1 - 40, STAIR.x2 + 20)) staircase(g);
    if (vis(STAIR.x2, 6440)) { g.fillStyle = '#4a3a4e'; g.fillRect(STAIR.x2 + 10, UP + 30, 6440 - STAIR.x2 - 10, G - UP - 30); stoneLines(g, STAIR.x2 + 10, UP + 30, 6440, G, '#3e3042'); }
    // ---------- andar de cima ----------
    if (vis(SECRET.x0, SECRET.x1)) secretRoom(g);
    if (vis(LIB.x0, LIB.x1)) library(g);
    if (vis(LIB.x1, STAIR.x2)) portraitGallery(g);
    if (vis(STAIR.x2, 6440)) royalCorridor(g);
    if (vis(6380, 7600)) { g.fillStyle = '#2a2030'; g.fillRect(6400, CY, 1200, this.height - CY); }
    if (vis(ROOM_A.x0, ROOM_A.x1)) royalBedroom(g);
    if (vis(ROOM_B.x0, ROOM_B.x1)) nursery(g);
    // pisos e teto do castelo
    if (vis(FACADE, 7600)) {
      g.fillStyle = '#3a2c3c'; g.fillRect(FACADE, CY, 4790, CEIL - CY);
      g.fillStyle = '#c9a34a'; g.fillRect(FACADE, CEIL - 6, 4790, 4);
      floorBand(g, 2800, STAIR.x1 - 10, UP);
      floorBand(g, STAIR.x2, 7550, UP);
      g.fillStyle = '#8a6a4a'; g.fillRect(STAIR.x1 - 10, UP, STAIR.x2 - STAIR.x1 + 10, 8);
      for (let x = STAIR.x1; x < STAIR.x2; x += 24) { g.fillStyle = '#c9a34a'; g.fillRect(x, UP - 30, 4, 30); }
      g.fillStyle = '#c9a34a'; g.fillRect(STAIR.x1 - 10, UP - 32, STAIR.x2 - STAIR.x1 + 10, 4);
      hallFloor(g, 2800, STAIR.x2 + 10);
    }
  }

  drawBack(ctx) {
    const cam = this.game.camera, t = this.t, g = this.game;
    const on = (a, b) => b > cam.left - 100 && a < cam.right + 100;
    // torres do castelo acima da fachada (fora das camadas estáticas)
    if (on(FACADE - 400, FACADE + 2200) && cam.top < CY + 40) towers(ctx, t);
    // fonte dos cisnes
    if (on(980, 1260)) this.drawFountain(ctx);
    // roseiras
    if (on(1500, 2500)) ROSES.forEach(([x], i) => roseBush(ctx, x, G, this.getS('rosa' + i, false), t + i));
    // lago e cisnes
    if (on(1650, 2100)) { pond(ctx, t); SWANS.forEach((x, i) => swan(ctx, x, G - 8, this.getS('cisne' + i, i), this.swanTurn?.i === i ? this.swanTurn.t : 1, this.getS('cisnes', false))); }
    // sebe do jardim escondido
    if (on(2540, 2760)) secretGarden(ctx, this.getS('cisnes', false) ? (this.hedgeK ?? 1) : 0, this.getS('bauJardim', false));
    // grande vitral
    if (on(3300, 3500)) bigWindow(ctx, this.getS('vitral', false) ? (this.vitralK ?? 1) : 0, FRAGS.length, t);
    // lustres
    if (on(4200, 4800)) for (const x of [4350, 4680]) chandelier(ctx, x, 880, t, this.player.swing?.a?.x === x ? this.player.swing.th : 0);
    // estante secreta (gira quando o enigma é resolvido)
    if (on(SECRET.x1 - 20, LIB.x0 + 80)) secretShelf(ctx, this.getS('passagem', false) ? (this.shelfK ?? 1) : 0, this.bookShake > 0 ? Math.sin(t * 60) * 2 : 0);
    // sala secreta: velas e sol
    if (on(SECRET.x0, SECRET.x1)) {
      CANDLES.forEach(([x, y], i) => candle(ctx, x, y, this.getS('vela' + i, false), t + i));
      stoneSun(ctx, 3025, 575, this.getS('sol', false) ? (this.sunK ?? 1) : 0, t);
    }
    // fragmentos de vitral
    for (const f of FRAGS) {
      if (f.from || this.fragGot(f.id) || !on(f.x - 20, f.x + 20)) continue;
      if (f.needLit && this.getS('velas', 0) < 3) continue;
      fragment(ctx, f.x, f.y + Math.sin(t * 2.4 + f.id) * 3, t + f.id);
    }
    // portas do corredor
    if (on(DOOR_A - 60, DOOR_B + 60)) { royalDoor(ctx, DOOR_A, false); royalDoor(ctx, DOOR_B, !this.getS('bercario', false)); }
    if (on(ROOM_A.x0, ROOM_A.x0 + 120)) royalDoor(ctx, ROOM_A.x0 + 60, false);
    if (on(ROOM_B.x0, ROOM_B.x0 + 120)) royalDoor(ctx, ROOM_B.x0 + 60, false);
    // caixinha de música
    if (on(7300, 7420)) musicBox(ctx, 7370, UP, Quests.done(g, 'lembranca') || this.memory > 0, t);
  }

  drawBook(ctx, b, h) {
    const sh = this.bookShake > 0 ? Math.sin(this.t * 50) * 1.5 : 0;
    ctx.save(); ctx.translate(h.x + sh, h.y);
    ctx.fillStyle = b.col; roundRect(ctx, -6, -14, 12, 28, 2); ctx.fill();
    ctx.fillStyle = '#f2e6c8'; ctx.fillRect(-6, -10, 12, 2); ctx.fillRect(-6, 8, 12, 2);
    ctx.fillStyle = '#fff3cf';
    if (b.id === 'sol') { ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill(); }
    else if (b.id === 'lua') { ctx.beginPath(); ctx.arc(0, 0, 3.5, 0.6, Math.PI * 2 - 0.6); ctx.fill(); }
    else { ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 1.2566; ctx.lineTo(Math.cos(a) * 4, Math.sin(a) * 4); ctx.lineTo(Math.cos(a + 0.628) * 1.7, Math.sin(a + 0.628) * 1.7); } ctx.fill(); }
    ctx.restore();
  }

  drawFountain(ctx) {
    const t = this.t, k = this.getS('fonte', false) ? (this.waterK ?? 1) : 0;
    const x = 1120;
    ctx.fillStyle = '#b8aea0'; roundRect(ctx, x - 100, G - 40, 200, 40, 10); ctx.fill();
    ctx.fillStyle = '#9a9084'; ctx.fillRect(x - 96, G - 40, 192, 6);
    ctx.fillStyle = k > 0 ? `rgba(110,170,220,${0.5 + k * 0.4})` : '#7a8a6a';
    ctx.fillRect(x - 90, G - 34, 180, 12);
    ctx.fillStyle = '#c8beb0'; ctx.fillRect(x - 12, G - 110, 24, 70);
    ctx.fillStyle = '#d8d0c4'; roundRect(ctx, x - 40, G - 120, 80, 14, 6); ctx.fill();
    // dois cisnes de pedra
    for (const d of [-1, 1]) {
      ctx.save(); ctx.translate(x + d * 22, G - 120); ctx.scale(-d, 1);
      ctx.fillStyle = '#e8e2d8'; ctx.beginPath(); ctx.ellipse(0, -8, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#e8e2d8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(8, -10); ctx.quadraticCurveTo(16, -28, 8, -34); ctx.stroke();
      ctx.fillStyle = '#d8a04a'; ctx.fillRect(2, -36, 5, 3);
      ctx.restore();
    }
    if (!this.getS('fonte', false)) { ctx.fillStyle = 'rgba(90,120,70,0.6)'; for (let i = 0; i < 8; i++) ctx.fillRect(x - 80 + i * 21, G - 42, 10, 4); return; }
    // água saindo dos bicos
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const d of [-1, 1]) {
      for (let i = 0; i < 10; i++) {
        const f = ((t * 1.4 + i / 10) % 1);
        const px = x + d * (30 + f * 60), py = G - 152 + f * f * 110 - f * 20;
        ctx.fillStyle = `rgba(170,215,255,${0.6 * k * (1 - f * 0.6)})`;
        ctx.beginPath(); ctx.arc(px, py, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  drawScreen(ctx) {
    super.drawScreen(ctx);
    const W = this.game.view.w, H = 540;
    // dentro de um quarto, o que fica além das paredes não aparece (a tela é mais larga que o quarto)
    const pcx = this.player.cx, room = this.fade ? null : pcx > ROOM_B.x0 - 10 ? ROOM_B : pcx > ROOM_A.x0 - 10 ? ROOM_A : null;
    if (room) {
      const cam = this.game.camera;
      const l = cam.toScreen(room.x0, 0).x, r = cam.toScreen(room.x1, 0).x;
      ctx.fillStyle = '#17111d';
      if (l > 0) ctx.fillRect(0, 0, l, H);
      if (r < W) ctx.fillRect(r, 0, W - r, H);
      for (const [x, d] of [[l, 1], [r, -1]]) {
        const gr = ctx.createLinearGradient(x, 0, x + d * 40, 0);
        gr.addColorStop(0, 'rgba(23,17,29,0.85)'); gr.addColorStop(1, 'rgba(23,17,29,0)');
        ctx.fillStyle = gr; ctx.fillRect(d > 0 ? x : x - 40, 0, 40, H);
      }
    }
    // lembrança: tudo fica dourado e suave
    if (this.memory > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,200,110,${0.28 * this.memory})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = this.memory * 0.9;
      const s = this.game.camera.toScreen(this.player.cx, this.player.y + 10);
      ctx.drawImage(halo('ouro'), s.x - 300, s.y - 300, 600, 600);
      ctx.restore();
      ctx.fillStyle = `rgba(255,246,225,${0.18 * this.memory})`; ctx.fillRect(0, 0, W, H);
    }
    // barras de cinema
    this.lb = (this.lb || 0) + ((this.game.cinematic ? 1 : 0) - (this.lb || 0)) * 0.08;
    if (this.lb > 0.01) { ctx.fillStyle = '#0c0814'; ctx.fillRect(0, 0, W, 48 * this.lb); ctx.fillRect(0, H - 48 * this.lb, W, 48 * this.lb); }
    // escurecida das portas
    if (this.fade > 0) { ctx.fillStyle = `rgba(14,10,28,${this.fade < 1 ? this.fade : 2 - this.fade})`; ctx.fillRect(0, 0, W, H); }
  }
}

const GOLD = '#d9b04a', GOLD_D = '#a8832e';

function stoneLines(g, x0, y0, x1, y1, col) {
  g.strokeStyle = col; g.lineWidth = 1;
  for (let y = y0 + 34, r = 0; y < y1; y += 34, r++) {
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    for (let x = x0 + (r % 2 ? 40 : 0); x < x1; x += 80) { g.beginPath(); g.moveTo(x, y - 34); g.lineTo(x, y); g.stroke(); }
  }
}
function wall(g, x0, y0, x1, y1, base, line) { g.fillStyle = base; g.fillRect(x0, y0, x1 - x0, y1 - y0); stoneLines(g, x0, y0, x1, y1, line); }
function floorBand(g, x0, x1, y) {
  g.fillStyle = '#7a5a4a'; g.fillRect(x0, y, x1 - x0, 30);
  g.fillStyle = '#9a7a5a'; g.fillRect(x0, y, x1 - x0, 5);
  g.fillStyle = GOLD; g.fillRect(x0, y + 24, x1 - x0, 3);
}
function hallFloor(g, x0, x1) {
  for (let x = x0, i = 0; x < x1; x += 40, i++) { g.fillStyle = i % 2 ? '#e8dcc8' : '#c8b8a0'; g.fillRect(x, G, 40, 18); }
  // alicerce de pedra embaixo do piso do salão
  P.stones(g, x0, G + 18, x1 - x0, 282, '#7a6a58', 23);
  g.fillStyle = 'rgba(20,12,24,0.25)'; g.fillRect(x0, G + 18, x1 - x0, 8);
}
function courtyard(g, x0, x1) {
  // lajes do pátio (antes era uma faixa lisa)
  P.stones(g, x0, G + 12, x1 - x0, 288, '#b3a48c', 31);
  for (let x = x0; x < x1; x += 34) { g.fillStyle = (x / 34) % 2 ? '#cfc2ac' : '#c2b49c'; g.fillRect(x, G, 32, 12); }
}
function gardenPath(g, x0, x1) {
  // terra e raízes embaixo do jardim
  g.fillStyle = '#5f7f42'; g.fillRect(x0, G, x1 - x0, 40);

}
function lampPost(g, x) {

  g.fillStyle = '#ffe9a8'; roundRect(g, x - 9, G - 140, 18, 22, 4); g.fill();

function planter(g, x) {
  g.fillStyle = '#a0907a'; roundRect(g, x - 30, G - 40, 60, 40, 6); g.fill();
  g.fillStyle = '#4f7a3f'; g.beginPath(); g.arc(x, G - 50, 26, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 6; i++) P.flower(g, x - 18 + i * 7, G - 58 + (i % 2) * 10, 3, i % 2 ? '#e0607a' : '#f2c14e', '#fff3cf');
}
function gateArch(g, x) {
  g.fillStyle = '#b4a690'; g.fillRect(x, 760, 60, 440); g.fillRect(x + 280, 760, 60, 440);
  g.fillStyle = '#a49680'; g.beginPath(); g.moveTo(x, 800); g.lineTo(x + 340, 800); g.lineTo(x + 340, 760); g.lineTo(x, 760); g.fill();
  g.beginPath(); g.moveTo(x + 60, 1000); g.arc(x + 170, 1000, 110, Math.PI, 0); g.lineTo(x + 280, 800); g.lineTo(x + 60, 800); g.closePath(); g.fill();
  for (let i = 0; i < 7; i++) g.fillRect(x + i * 50, 736, 30, 26);

function garden(g, rnd) {

  for (const [x, w, h] of [[1520, 90, 70], [1620, 60, 50], [2060, 80, 60], [2420, 120, 80]]) {

  // pérgola
  g.fillStyle = '#e8e0d0'; for (const x of [2186, 2326]) g.fillRect(x, 1030, 10, 170);
  g.fillStyle = '#d8cfbe'; g.fillRect(2176, 1024, 170, 10);

  for (let i = 0; i < 9; i++) P.flower(g, 2186 + i * 18, 1028 + (i % 2) * 4, 3.5, '#c9a8ec', '#fff3cf');
  // banco do jardim escondido
  g.fillStyle = '#b8b0a4'; g.fillRect(2600, G - 30, 40, 8); g.fillRect(2604, G - 22, 6, 22); g.fillRect(2630, G - 22, 6, 22);
}
function facade(g) {
  const x = FACADE;

  stoneLines(g, x - 40, CY, x + 40, G, '#bfb29c');

  g.fillStyle = '#2a1e1a'; g.beginPath(); g.moveTo(x - 30, G); g.lineTo(x - 30, 1080); g.arc(x, 1080, 30, Math.PI, 0); g.lineTo(x + 30, G); g.fill();
  g.fillStyle = '#7a4a2e'; g.fillRect(x - 46, 1060, 14, 140); g.fillRect(x + 32, 1060, 14, 140);

function throneHall(g) {
  wall(g, 2800, UP + 30, 4000, G, '#5a4a6a', '#4e405e');
