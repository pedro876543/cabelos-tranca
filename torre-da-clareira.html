  for (const x of [2880, 3240, 3560, 3900]) { g.fillStyle = '#d8ccb8'; g.fillRect(x - 14, UP + 30, 28, G - UP - 30); g.fillStyle = GOLD; g.fillRect(x - 18, UP + 30, 36, 8); g.fillRect(x - 18, G - 10, 36, 10); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(x + 6, UP + 38, 8, G - UP - 48); }
  // tapeçaria do primeiro rei

  g.fillStyle = GOLD; g.fillRect(3060, 860, 140, 6); g.fillRect(3060, 1064, 140, 6);
  g.fillStyle = '#f2d8a8'; g.beginPath(); g.arc(3130, 930, 10, 0, Math.PI * 2); g.fill();

  for (let i = 0; i < 7; i++) { g.fillStyle = GOLD; g.beginPath(); g.moveTo(3060 + i * 20, 1070); g.lineTo(3070 + i * 20, 1084); g.lineTo(3080 + i * 20, 1070); g.fill(); }
  // tapete vermelho até os tronos
  g.fillStyle = '#9a2a3a'; g.fillRect(2840, G - 4, 1000, 6); g.fillStyle = GOLD; g.fillRect(2840, G - 5, 1000, 2);
  // estrado e tronos
  g.fillStyle = '#7a5a4a'; g.fillRect(3600, G - 16, 300, 16); g.fillStyle = GOLD; g.fillRect(3600, G - 16, 300, 3);
  throne(g, 3700, G - 16, 1); throne(g, 3810, G - 16, 1); throne(g, 3758, G - 16, 0.55);
  // estandartes
  for (const x of [3640, 3870]) { g.fillStyle = '#7a4fae'; g.fillRect(x - 16, 830, 32, 120); g.fillStyle = GOLD; g.beginPath(); g.moveTo(x - 16, 950); g.lineTo(x, 966); g.lineTo(x + 16, 950); g.fill(); P.sunSymbol(g, x, 870, 8, GOLD, 1); }
  // janelas altas
  for (const x of [2960, 3640]) stained(g, x, 820, 60, 120);
}
function throne(g, x, fy, s) {
  g.save(); g.translate(x, fy); g.scale(s, s);
  g.fillStyle = GOLD_D; g.fillRect(-26, -140, 52, 140);
  g.fillStyle = GOLD; g.beginPath(); g.moveTo(-26, -140); g.lineTo(0, -168); g.lineTo(26, -140); g.fill();

const ECOS = [{ x: 1060, y: G - 300 }, { x: 1800, y: 1240 }, { x: 4900, y: 1250 }, { x: 3150, y: G - 310 }, { x: 6150, y: G - 310 }];
const ECO_LUGAR = ['na boca da mina, perto do andaime', 'na gruta embaixo dos trilhos', 'no fundo do abismo do Caminho Oculto', 'no alto do Salão dos Cristais', 'perto do mural da Câmara do Sol'];
// coluna de cristal: alta demais para um pulo do chão (o pulo sobe uns 100 px), mas fácil de alcançar de cima da pedra.
// Era 150 px: de cima da pedra (56 px) sobravam só 8 px de folga e quase nunca dava. Agora 110: dá até com um toque rápido no Pular, e do chão continua alto demais.
const COLUMN = { x: 3800, w: 90, h: 110 };
const BOULDER_MIN = 3300;
// degrau de pedra do lado direito da coluna: é por ele que se volta para o Salão dos Cristais vindo do portão
const STEP_R = { x: COLUMN.x + COLUMN.w, w: 50, h: 56 };   // a pedra não sai do Salão dos Cristais (não cai na gruta nem fica presa num canto)
const FENDA = { x: 4050, w: 80 };
const HIDE = { x0: 6380, x1: W - 60, trap: 6560, tw: 80, floor: 1320 };   // câmara escondida embaixo da Câmara do Sol (missão A verdade escondida)

class Minas extends Area {
  constructor(game) {
    super(game);
    this.id = 'minas';
    this.name = 'Minas do Sol';
    this.width = W;
    this.height = H;
    this.darkAmt = 0.55;
    this.spawns = {
      default: { x: 230, y: G, facing: 1 },
      poco: { x: 6740, y: G, facing: -1 },
    };
  }

  build() {
    const g = this.game;
    this.solid(0, 0, 60, H);
    this.solid(W - 60, 0, 60, H);
    this.solid(0, 0, W, 380);                                   // teto de pedra
    this.solid(60, G, C.chasm.x0 - 60, H - G);                  // boca da mina
    this.solid(C.chasm.x0, C.chasm.floor, C.chasm.x1 - C.chasm.x0, H - C.chasm.floor);   // gruta embaixo dos trilhos
    this.solid(C.chasm.x1, G, C.abyss.x0 - C.chasm.x1, H - G);  // galeria e salão
    this.solid(C.abyss.x0, C.abyss.floor, C.abyss.x1 - C.abyss.x0, H - C.abyss.floor);   // fundo do abismo
    // câmara do sol: o chão tem uma câmara escondida embaixo, aberta pelo alçapão
    this.solid(C.abyss.x1, G, HIDE.x0 - C.abyss.x1, H - G);
    this.solid(HIDE.x0, G, HIDE.trap - HIDE.x0, 40);
    this.solid(HIDE.trap + HIDE.tw, G, HIDE.x1 - HIDE.trap - HIDE.tw, 40);
    this.solid(HIDE.x0, HIDE.floor, HIDE.x1 - HIDE.x0, H - HIDE.floor);
    if (!this.getS('alcapao', false)) this.trap = this.solid(HIDE.trap, G, HIDE.tw, 40, { id: 'alcapao' });
    else { this.ladder(HIDE.trap + 25, 30, G, HIDE.floor); this.oneWay(HIDE.trap, G, HIDE.tw); }
    // escadas de volta (ninguém fica preso embaixo)
    this.ladder(C.chasm.x0 + 6, 30, G, C.chasm.floor);
    this.ladder(C.chasm.x1 - 36, 30, G, C.chasm.floor);
    this.ladder(C.abyss.x0 + 6, 30, G, C.abyss.floor);
    this.ladder(C.abyss.x1 - 36, 30, G, C.abyss.floor);          // saída do abismo também do lado de lá

    // ---------- Boca da Mina ----------
    this.object({ id: 'sair', x: 80, y: G - 130, w: 100, h: 130, label: MT.sair, use: () => g.scenes.go('floresta', { spawn: 'mina' }) });
    this.object({
      id: 'caderno', x: 490, y: G - 64, w: 60, h: 64, label: 'Ler o caderno do mineiro',
      use: () => this.say(MT.caderno, () => this.startEcos()),
    });
    this.oneWay(820, G - 150, 140);                             // andaime
    this.hook({ id: 'andaime', x: 890, y: G - 200, landing: { x: 890, y: G - 150 }, label: 'Subir no andaime' });
    this.petal(1, 900, G - 178);

    // ---------- Galeria dos Trilhos ----------
    const cartX = this.getS('carrinho-x', C.cart.a);
    this.cart = this.solid(cartX, C.cart.top, C.cart.w, 8, { oneWay: true, id: 'carrinho' });
    this.cartV = 0; this.cartDir = 0;
    this.cartObj = this.object({
      id: 'carrinho', x: cartX, y: C.cart.top - 60, w: C.cart.w, h: 96, label: MT.carrinho,
      zone: { x0: 0, x1: 0, y0: 0, y1: 0 },
      use: () => this.useCart(),
    });
    if (this.getS('trilhos', false)) this.railBridge = this.oneWay(C.chasm.x0, G, C.chasm.x1 - C.chasm.x0);
    this.restore({
      id: 'trilhos', x: C.chasm.x0, y: G - 60, w: C.chasm.x1 - C.chasm.x0, h: 60, floorY: G, label: 'Restaurar a ponte dos trilhos', cost: 30, time: 1.8,
      done: this.getS('trilhos', false),
      onDone: () => {
        this.setS('trilhos', true);
        this.railBridge = this.oneWay(C.chasm.x0, G, C.chasm.x1 - C.chasm.x0);
        this.bridgeAnim = 0;
        this.player.setExpr('surpresa', 2);
        this.say(MT.ponteRestaurada);
      },
    });
    this.petal(2, 2100, 1290);

    // ---------- Salão dos Cristais ----------
    this.oneWay(3200, G - 200, 170);
    this.hook({ id: 'salao', x: 3285, y: G - 250, landing: { x: 3285, y: G - 200 }, label: 'Subir na saliência' });
    this.solid(COLUMN.x, G - COLUMN.h, COLUMN.w, COLUMN.h, { id: 'coluna' });
    this.solid(STEP_R.x, G - STEP_R.h, STEP_R.w, STEP_R.h, { id: 'degrau-coluna' });
    this.boulder = this.pushable(this.getS('pedra-x', 3600), G - 56, 56, 56, { id: 'pedra' });
    this.guias = GUIAS.map((d, i) => this.reachPoint({
      id: 'guia' + i, x: d.x, y: d.y, label: 'Despertar o cristal-guia', hidden: this.getS('guia' + i, false),
      onPull: (a, h) => this.wakeGuide(i, h),
      draw: (ctx, a, h) => this.drawGuide(ctx, i, h),
    }));
    if (!this.getS('portao', false)) this.gateSolid = this.solid(C.gate, 380, 40, G - 380, { id: 'portao' });
    this.object({
      id: 'portao', x: C.gate - 70, y: G - 160, w: 70, h: 160, label: 'Portão de cristal', hidden: this.getS('portao', false),
      use: () => this.say(MT.portaoCristal),
    });
    this.fendaK = this.getS('fenda', false) ? 1 : 0;
    this.object({
      id: 'fenda', x: FENDA.x, y: G - 130, w: FENDA.w, h: 120, label: 'Examinar a rachadura',
      use: () => this.say(this.getS('fenda', false) ? MT.fendaDepois : MT.fendaApagada),
    });
    if (this.getS('fenda', false)) this.petal(3, FENDA.x + 40, G - 40);

    // ---------- Caminho Oculto ----------
    for (const [x, w] of C.pillars) this.solid(x, G, w, 40, { id: 'pilar' });
    C.swings.forEach((x, i) => this.swingPoint({ id: 'gancho' + i, x, y: G - 230, maxLen: 210, label: 'Balançar' }));
    if (this.getS('ponte-corda', false)) this.ropeBridge = this.oneWay(C.abyss.x0, G, C.abyss.x1 - C.abyss.x0);
    this.reachPoint({
      id: 'ponte-corda', x: C.abyss.x1 + 40, y: G - 190, label: MT.ponteCorda, hidden: this.getS('ponte-corda', false),
      onPull: (a, h) => {
        h.hidden = true; this.setS('ponte-corda', true);
        this.ropeBridge = this.oneWay(C.abyss.x0, G, C.abyss.x1 - C.abyss.x0);
        this.ropeAnim = 0;
        this.sparkle(h.x, h.y, 14);
        this.say(MT.ponteCordaDesce);
      },
      draw: (ctx, a, h) => this.drawRopeKnot(ctx, h),
    });

    // ---------- Câmara do Sol ----------
    this.oneWay(5900, G - 200, 140);
    this.hook({ id: 'domo', x: 5970, y: G - 250, landing: { x: 5970, y: G - 200 }, label: 'Subir na saliência' });
    this.petal(4, 5970, G - 236);
    this.object({
      id: 'mural', x: C.mural.x, y: G - 280, w: C.mural.w, h: 280, label: MT.mural,
      zone: { x0: C.mural.x - 10, x1: C.mural.x + C.mural.w + 10, y0: G - 6, y1: G + 6 },
      use: () => this.readMural(),
    });
    const g2 = this.game;
    this.object({
      id: 'alcapao', x: HIDE.trap, y: G - 24, w: HIDE.tw, h: 24, label: MS.alcapao,
      zone: { x0: HIDE.trap - 30, x1: HIDE.trap + HIDE.tw + 30, y0: G - 6, y1: G + 4 },
      get hidden() { const q = Quests.get(g2, 'verdade'); return !q || q.done || q.step !== 0 || this.area?.getS('alcapao', false); },
      area: this,
      use: () => this.openTrap(),
    });
    this.object({ id: 'marcas', x: 6420, y: HIDE.floor - 90, w: 90, h: 90, label: 'Marcas no chão', use: () => this.say(MS.gaiolaVazia) });
    // se a lembrança da lanterna foi interrompida (jogo fechado ou região trocada no meio da cena),
    // a lanterna volta a poder ser restaurada, senão a missão "A verdade escondida" ficaria travada
    const vq = Quests.get(g, 'verdade');
    // (e se a lembrança já foi vista, a missão só segue para o próximo passo)
    if (this.getS('lanterna', false) && vq && !vq.done && vq.step === 1) {
      if (g.state.flag('memoria-mina')) Quests.step(g, 'verdade', 2); else this.setS('lanterna', false);
    }
    this.restore({
      id: 'lanterna', x: 6770, y: HIDE.floor - 70, w: 50, h: 70, floorY: HIDE.floor, label: MS.lanterna, cost: 25, time: 1.4,
      done: this.getS('lanterna', false),
      onDone: () => { this.setS('lanterna', true); this.memoryScene(); },
    });
    this.hook({ id: 'poco', x: 6830, y: G - 330, label: MT.poco, onReach: () => g.scenes.go('floresta', { spawn: 'mina' }) });

    // pedras-de-eco (colecionáveis tocados com os cabelos)
    this.ecos = ECOS.map((d, i) => this.reachPoint({
      id: 'eco' + i, x: d.x, y: d.y, label: 'Tocar a pedra-de-eco', hidden: this.getS('eco' + i, false), prio: 90,
      onPull: (a, h) => this.takeEcho(i, h),
      draw: (ctx, a, h) => this.drawEcho(ctx, h),
    }));

    // luzes fixas: lanternas da boca da mina e cristais
    this.lamps = [[300, G - 120], [700, G - 140], [1320, G - 140], [2480, G - 150], [5400, G - 150]];
    const rnd = mulberry32(31);
    this.crystals = [];
    for (let i = 0; i < 70; i++) {
      const x = 120 + rnd() * (W - 240);
      if (x > C.chasm.x0 - 10 && x < C.chasm.x1 + 10 && rnd() < 0.5) continue;
      const floorY = (x > C.chasm.x0 && x < C.chasm.x1) ? C.chasm.floor : (x > C.abyss.x0 && x < C.abyss.x1) ? C.abyss.floor : G;
      const ceil = rnd() < 0.35;
      this.crystals.push({ x, y: ceil ? 400 + rnd() * 40 : floorY, ceil, s: 8 + rnd() * 12, col: ['#9ee6ff', '#c6a2ff', '#ffd98a', '#9fffd8'][(rnd() * 4) | 0], ph: rnd() * 6 });
    }
    this.drips = Array.from({ length: 14 }, (_, i) => ({ x: 300 + i * 480 + rnd() * 200, t: rnd() * 3 }));

    // lugares
    this.zone('Câmara Escondida', (p) => p.cx > HIDE.x0 && p.feet > G + 60);
    this.zone('Boca da Mina', (p) => p.cx < C.chasm.x0 - 60);
    this.zone('Gruta dos Cristais', (p) => p.cx < C.chasm.x1 && p.feet > G + 60);
    this.zone('Galeria dos Trilhos', (p) => p.cx < 2800);
    this.zone('Salão dos Cristais', (p) => p.cx < C.gate + 40);
    this.zone('Caminho Oculto', (p) => p.cx < C.abyss.x1 + 20);
    this.zone('Câmara do Sol', () => true);
  }

  onEnter(data) {
    const g = this.game, s = g.state;
    g.audio?.music('minas');
    if (!s.flag('minas-vista')) {
      s.set('minas-vista');
      this.player.setExpr('surpresa', 3);
      setTimeout(() => { if (g.scenes.current === this) this.say(MT.chegada); }, 900);
    }
    // quem chega aqui já abriu a laje: a missão segue para os cristais-guia
    if (Quests.active(g, 'passagem') && Quests.get(g, 'passagem').step < 2) Quests.step(g, 'passagem', 2);
    this.syncGuides();
  }
  exit() { super.exit(); this.game.audio?.music(null); this.game.cinematic = false; }

  // ---------- carrinho ----------
  onCart() {
    const p = this.player, c = this.cart;
    return p.onGround && Math.abs(p.feet - c.y) < 3 && p.x + p.w > c.x + 2 && p.x < c.x + c.w - 2;
  }
  useCart() {
    if (this.cartDir) return;
    if (!this.onCart()) { this.say(MT.carrinhoSuba); return; }
    if (!this.getS('trilhos', false)) { this.say(MT.carrinhoQuebrado); return; }
    this.cartDir = this.cart.x < (C.cart.a + C.cart.b) / 2 ? 1 : -1;
    this.cartV = 0;
    this.game.audio?.sfx('pega');
    this.game.camera.shake(1.2, 0.15);
  }
  updateCart(dt) {
    const c = this.cart, o = this.cartObj, p = this.player;
    if (this.cartDir) {
      const riding = this.onCart();
      this.cartV = Math.min(330, this.cartV + 260 * dt);
      let nx = c.x + this.cartDir * this.cartV * dt;
      const end = this.cartDir > 0 ? C.cart.b : C.cart.a;
      let stop = false;
      if ((this.cartDir > 0 && nx >= end) || (this.cartDir < 0 && nx <= end)) { nx = end; stop = true; }
      const dx = nx - c.x;
      c.x = nx;
      if (riding) { p.x += dx; }
      if (Math.random() < 0.5) this.fx.emit({ x: c.x + (this.cartDir > 0 ? 6 : c.w - 6), y: G - 4, vx: -this.cartDir * 60, vy: -40 - Math.random() * 40, size: 1.6, life: 0.4, color: '#ffd27a' });
      if (stop) {
        this.cartDir = 0; this.cartV = 0;
        this.setS('carrinho-x', c.x);
        this.game.camera.shake(2.4, 0.25);
        this.dust(c.x + c.w / 2, G, 10);
      }
    }
    // o objeto do carrinho acompanha o carrinho e só aparece para quem está em cima dele
    o.x = c.x;
    const atEnd = Math.abs(c.x - C.cart.b) < 2;
    o.label = atEnd ? MT.carrinhoVolta : MT.carrinho;
    o.zone = this.cartDir ? { x0: 0, x1: 0, y0: 0, y1: 0 } : { x0: c.x - 20, x1: c.x + c.w + 20, y0: c.y - 4, y1: G + 4 };
    o.prompt = { x: c.x + c.w / 2, y: c.y - 74 };
  }

  // ---------- cristais-guia e portão ----------
  syncGuides() {
    const q = Quests.get(this.game, 'passagem');
    if (q && !q.done && q.step === 2) {
      const n = GUIAS.filter((d, i) => this.getS('guia' + i, false)).length;
      if (q.n !== n) { q.n = n; Quests.refresh(this.game); }
    }
  }
  wakeGuide(i, h) {
    const g = this.game;
    h.hidden = true;
    this.setS('guia' + i, true);
    this.sparkle(h.x, h.y, 20);
    g.audio?.sfx('magia');
    const n = GUIAS.filter((d, k) => this.getS('guia' + k, false)).length;
    g.ui.notify(MT.guiaDesperta(n));
    if (Quests.active(g, 'passagem') && Quests.get(g, 'passagem').step === 2) Quests.count(g, 'passagem');
    if (n >= 3) this.openGate();
  }
  openGate() {
    if (this.getS('portao', false)) return;
    const g = this.game, p = this.player;
    this.cutscene = new Cutscene(this, [
      { wait: 0.4 },
      { cam: { x: C.gate - 140, y: G - 200, zoom: 1.15, rate: 1.3 } }, { wait: 0.9 },
      { say: MT.portaoAbre.slice(0, 2) },
      { do: () => { this.setS('portao', true); this.gateK = 0.001; g.camera.shake(2, 0.5); g.audio?.sfx('sino'); } },
      { wait: 1.3 },
      { do: () => { this.solids = this.solids.filter((s) => s !== this.gateSolid); this.gateSolid = null; const o = this.objects.find((x) => x.id === 'portao'); if (o) o.hidden = true; } },
      { cam: { x: null } }, { do: () => p.setExpr('surpresa', 3) },
      { say: MT.portaoAbre.slice(2) },
    ], () => {
      if (Quests.active(g, 'passagem') && Quests.get(g, 'passagem').step < 3) Quests.step(g, 'passagem', 3);
    });
  }

  // ---------- pedras-de-eco ----------
  echoCount() { return ECOS.filter((d, i) => this.getS('eco' + i, false)).length; }
  startEcos() {
    const g = this.game;
    if (Quests.done(g, 'ecos')) return;
    const q = Quests.start(g, 'ecos');
    q.n = this.echoCount();
    Quests.refresh(g);
    if (q.n >= 5) this.finishEcos();
  }
  takeEcho(i, h) {
    const g = this.game;
    h.hidden = true;
    this.setS('eco' + i, true);
    this.sparkle(h.x, h.y, 16);
    const n = this.echoCount();
    // cada pedra canta uma nota diferente
    if (g.audio?.ctx) { const notes = [74, 76, 79, 81, 83]; try { g.audio.tone(440 * Math.pow(2, (notes[i] - 69) / 12), g.audio.ctx.currentTime, 1.1, 'sine', 0.07, g.audio.sfxBus, 0.01); } catch (e) { /* som opcional */ } }
    const falta = ECOS.map((d, k) => (this.getS('eco' + k, false) ? null : ECO_LUGAR[k])).filter(Boolean);
    g.ui.notify(MT.eco(n) + (falta.length ? '. Ainda cantam: ' + falta.join('; ') + '.' : ''), falta.length ? 6 : 3);
    if (!Quests.get(g, 'ecos')) Quests.start(g, 'ecos');
    const q = Quests.get(g, 'ecos');
    if (q.done) return;
    q.n = n;
    Quests.refresh(g);
    if (n >= 5) this.finishEcos();
  }
  finishEcos() {
    const g = this.game;
    if (Quests.done(g, 'ecos')) return;
    this.say(MT.ecosTodos, () => Quests.complete(g, 'ecos'));
  }

  // ---------- mural ----------
  giveKey() {
    const g = this.game;
    if (g.state.flag('chave-bronze')) return false;
    g.state.set('chave-bronze');
    g.audio?.sfx('pega');
    this.say(MS.chaveBronze, () => { if (!Quests.get(g, 'vestigios')) Quests.start(g, 'vestigios'); });
    return true;
  }
  readMural() {
    const g = this.game, p = this.player;
    if (g.state.flag('pista-mina')) { if (!this.giveKey()) this.say(MT.muralDepois); return; }
    const mx = C.mural.x + C.mural.w / 2;
    this.cutscene = new Cutscene(this, [
      { walk: mx - 60 }, { face: 1 },
      { cam: { x: mx, y: G - 160, zoom: 1.2, rate: 1.2 } }, { wait: 0.6 },
      { do: () => { this.muralK = 0.001; g.audio?.sfx('magia'); p.boostGlow(1.5); } }, { wait: 0.8 },
      { say: MT.mural1 },
      { cam: { x: mx + 40, y: G - 170, zoom: 1.35, rate: 1 } },
      { do: () => p.setExpr('surpresa', 3) },
      { say: MT.mural2 },
      { cam: { x: mx + 110, y: G - 160, zoom: 1.5, rate: 1 } },
      { do: () => p.setExpr('pensativa', 8) },
      { say: MT.mural3 },
      { cam: { x: mx, y: G - 160, zoom: 1.2, rate: 1 } },
      { say: MT.mural4 },
      { cam: { x: null } }, { wait: 0.3 },
    ], () => {
      g.state.set('pista-mina');
      if (!Quests.get(g, 'passagem')) Quests.start(g, 'passagem', { silent: true });
      Quests.complete(g, 'passagem');
      g.ui.showHint?.(MT.sairPoco[0].text, 6);
      setTimeout(() => { if (g.scenes.current === this && !g.ui.dialogOpen) this.giveKey(); }, 1800);
    });
  }

  // ---------- câmara escondida (missão A verdade escondida) ----------
  openTrap() {
    const g = this.game;
    if (this.getS('alcapao', false)) return;
    this.setS('alcapao', true);
    this.solids = this.solids.filter((x) => x !== this.trap); this.trap = null;
    this.ladder(HIDE.trap + 25, 30, G, HIDE.floor);
    this.oneWay(HIDE.trap, G, HIDE.tw);          // a boca da escada: dá para pisar em cima e descer com {S}
    this.trapAnim = 0;
    g.camera.shake(2, 0.3);
    this.dust(HIDE.trap + HIDE.tw / 2, G, 12);
    this.say(MS.alcapaoAbre, () => { if (Quests.get(g, 'verdade')?.step === 0) Quests.step(g, 'verdade', 1); });
  }
  memoryScene() {
    const g = this.game, p = this.player;
    this.cutscene = new Cutscene(this, [
      { cam: { x: 6650, y: HIDE.floor - 120, zoom: 1.25, rate: 1.2 } },
      { do: () => { this.memK = 0.001; this.holdPose = true; p.boostGlow(1.6); g.audio?.sfx('magia'); } }, { wait: 1 },
      { say: MS.memoria.slice(0, 2) },
      { cam: { x: 6480, y: HIDE.floor - 110, zoom: 1.45, rate: 0.9 } },
      { do: () => p.setExpr('surpresa', 4) },
      { say: MS.memoria.slice(2, 5) },
      { cam: { x: 6600, y: HIDE.floor - 120, zoom: 1.3, rate: 0.9 } },
      { say: MS.memoria.slice(5) },
      { do: () => { this.memOut = true; this.holdPose = false; p.setExpr('pensativa', 8); } }, { wait: 0.8 },
      { cam: { x: null } },
      { say: MS.memoria2 },
    ], () => {
      this.memOut = true; this.holdPose = false;
      g.state.set('memoria-mina');
      const q = Quests.get(g, 'verdade');

  // ---------- atualização ----------
  updateExtra(dt) {
    const p = this.player, g = this.game;
    this.updateCart(dt);
    if (this.boulder) {
      const b = this.boulder;
      if (b.x < BOULDER_MIN) { b.x = BOULDER_MIN; b.vx = 0; }
      this.setS('pedra-x', b.x);
      // dicas: a pedra se empurra andando contra ela, e é por cima dela que se sobe na coluna
      const atColumn = b.x + b.w >= COLUMN.x - 6;
      const nearCol = p.onGround && Math.abs(p.feet - G) < 3 && p.cx > COLUMN.x - 60 && p.cx < COLUMN.x;
      if (!atColumn && nearCol && !(this.colHintT > this.t)) {
        this.colHintT = this.t + 12;
        g.ui.notify('A coluna é alta demais. Empurre a pedra até ela e suba pela pedra.', 4);
      }
      if (!atColumn && p.onGround && Math.abs(p.cx - (b.x + b.w / 2)) < 90 && Math.abs(p.feet - G) < 3 && !this.saidPush) {
        this.saidPush = true;
        g.ui.notify('Ande contra a pedra para empurrá-la.', 3.5);
      }
    }
    // caminho de volta: depois da lembrança, a missão manda voltar para a torre. O poço de luz é a saída mais curta.
    const vq2 = Quests.get(g, 'verdade');
    if (vq2 && !vq2.done && vq2.step === 2 && p.cx > 6000 && p.onGround && Math.abs(p.feet - G) < 4 && !(this.wellHintT > this.t) && !g.ui.dialogOpen) {
      this.wellHintT = this.t + 25;
      g.ui.notify(g.ui.fmt('Volta à torre: suba pelo poço de luz aqui no alto ({Q}).'), 5);
    }
    // pedras-de-eco: quando a Lira chega perto de uma que ainda não tocou, ela ouve o canto
    for (let i = 0; i < this.ecos.length; i++) {
      const e = this.ecos[i];
      if (e.hidden || this.echoHeard?.[i]) continue;
      if (Math.abs(p.cx - e.x) < 320 && Math.abs(p.feet - (e.y + 300)) < 260) {
        (this.echoHeard ||= [])[i] = true;
        g.audio?.sfx('sino');
        g.ui.notify(g.ui.fmt('Uma pedra-de-eco canta aqui perto. Chegue embaixo dela e use {Q}.'), 4);
      }
    }
    if (this.gateK > 0 && this.gateK < 1) this.gateK = Math.min(1, this.gateK + dt * 0.8);
    if (this.bridgeAnim != null && this.bridgeAnim < 1) this.bridgeAnim = Math.min(1, this.bridgeAnim + dt * 1.4);
    if (this.ropeAnim != null && this.ropeAnim < 1) this.ropeAnim = Math.min(1, this.ropeAnim + dt * 1.2);
    if (this.muralK > 0 && this.muralK < 1) this.muralK = Math.min(1, this.muralK + dt * 0.6);
    if (this.trapAnim != null && this.trapAnim < 1) this.trapAnim = Math.min(1, this.trapAnim + dt * 1.5);
    if (this.memK > 0) this.memK = this.memOut ? Math.max(0, this.memK - dt * 0.8) : Math.min(1, this.memK + dt * 0.7);

    // fenda secreta: só aparece com o Lume aceso perto dela
    if (!this.getS('fenda', false)) {
      const d = Math.abs(p.cx - (FENDA.x + FENDA.w / 2));
      this.fendaK = clamp((this.fendaK || 0) + (p.lume && d < 200 ? dt / 1.1 : -dt * 0.6), 0, 1);
      if (this.fendaK >= 1) {
        this.setS('fenda', true);
        this.petal(3, FENDA.x + 40, G - 40);
        this.sparkle(FENDA.x + 40, G - 70, 20);
        g.audio?.sfx('sino');
        this.say(MT.fendaRevelada, () => p.setExpr('pensativa', 4));
      }
    }

    // avisos de primeira vez
    if (!this.saidAbyss && p.cx > C.abyss.x0 - 160 && p.cx < C.abyss.x0 && p.onGround && !this.getS('ponte-corda', false)) {
      this.saidAbyss = true;
      if (!this.getS('abismo-visto', false)) { this.setS('abismo-visto', true); this.say(MT.abismo); }
    }
    if (!this.saidGrota && p.feet > G + 200 && p.onGround) {
      this.saidGrota = true;
      if (p.cx < C.chasm.x1 && !this.getS('grota-vista', false)) { this.setS('grota-vista', true); this.say(MT.grota); }
      else if (p.cx > C.abyss.x0 && p.cx < C.abyss.x1 && !this.getS('fundo-visto', false)) { this.setS('fundo-visto', true); this.say(MT.fundoAbismo); }
    }
    if (p.feet < G - 10) this.saidGrota = false;
    // atravessou o abismo pelos ganchos
    if (p.cx > C.abyss.x1 + 10 && p.onGround && Math.abs(p.feet - G) < 4) {
      const q = Quests.get(g, 'passagem');
      if (q && !q.done && q.step === 3) Quests.step(g, 'passagem', 4);
    }

    // escuridão de cada trecho (e as luzes que já foram acesas)
    const x = p.cx;
    let want = x < C.chasm.x0 ? 0.5 : x < C.chasm.x1 ? 0.65 : x < C.gate + 40 ? 0.45 : x < C.abyss.x1 + 60 ? 0.82 : 0.38;
    if (p.feet > G + 60) want = x > HIDE.x0 ? (this.getS('lanterna', false) ? 0.5 : 0.85) : 0.78;
    this.darkAmt += (want - this.darkAmt) * Math.min(1, dt * 2.5);
    const L = [];
    for (const [lx, ly] of this.lamps) L.push({ x: lx, y: ly, r: 150, a: 0.8 });
    for (const [px, pw] of C.pillars) if (Math.abs(px - x) < 900) L.push({ x: px + pw / 2, y: G - 6, r: 75, a: 0.5 });   // musgo que brilha em cima das pedras
    GUIAS.forEach((d, i) => { if (this.getS('guia' + i, false)) L.push({ x: d.x, y: d.y, r: 170, a: 0.85 }); else L.push({ x: d.x, y: d.y, r: 55, a: 0.45 }); });
    for (const e of this.ecos) if (!e.hidden) L.push({ x: e.x, y: e.y, r: 110, a: 0.75 });
    if (this.getS('portao', false)) L.push({ x: C.gate, y: G - 200, r: 220, a: 0.5 });
    L.push({ x: C.mural.x + C.mural.w / 2, y: G - 150, r: 260 + (this.muralK || 0) * 80, a: 0.7 });
    L.push({ x: 6830, y: G - 380, r: 200, a: 0.9 });
    if (this.getS('lanterna', false)) L.push({ x: 6795, y: HIDE.floor - 50, r: 260, a: 0.9 });
    for (const cr of this.crystals) if (Math.abs(cr.x - x) < 700) L.push({ x: cr.x, y: cr.ceil ? cr.y + 10 : cr.y - 10, r: 40 + cr.s * 2, a: 0.4 });
    this.darkLights = L;
    // gotas que pingam do teto
    for (const d of this.drips) { d.t -= dt; if (d.t <= 0) { d.t = 2 + Math.random() * 3; if (Math.abs(d.x - x) < 700) this.fx.emit({ x: d.x, y: 420, vx: 0, vy: 260, size: 1.5, life: 1.4, color: '#9ec9e8' }); } }
  }

  // ---------- desenho ----------
  drawBackground(ctx) {
    const cam = this.game.camera, Wv = this.game.view.w, t = this.t;
    const gr = ctx.createLinearGradient(0, 0, 0, 540);
    gr.addColorStop(0, '#1b1426'); gr.addColorStop(1, '#2a1f33');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, Wv, 540);
    // pilares de pedra ao fundo, em duas camadas (paralaxe)
    for (const [f, col, step, seed] of [[0.25, '#251c31', 260, 3], [0.5, '#2f2439', 340, 7]]) {
      const off = cam.x * f;
      const ys = (cam.y - 700) * f * 0.4;
      ctx.fillStyle = col;
      const n = Math.ceil(Wv / step) + 3, first = Math.floor(off / step) - 1;
      for (let k = first; k < first + n; k++) {
        const r = mulberry32(seed * 1000 + k)();
        const sx = k * step - off;
        const w = 60 + r * 80, h = 260 + r * 160;
        ctx.beginPath();
        ctx.moveTo(sx - w / 2, -ys); ctx.lineTo(sx - w * 0.2, h * 0.5 - ys); ctx.lineTo(sx + w * 0.2, h * 0.5 - ys); ctx.lineTo(sx + w / 2, -ys); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx - w * 0.6, 540); ctx.lineTo(sx - w * 0.15, 540 - h * 0.6 - ys * 0.2); ctx.lineTo(sx + w * 0.15, 540 - h * 0.6 - ys * 0.2); ctx.lineTo(sx + w * 0.6, 540); ctx.fill();
      }
    }
    // brilhos distantes de cristal
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) {
      const r = mulberry32(500 + i)(), r2 = mulberry32(900 + i)();
      const sx = ((r * 2400 - cam.x * 0.15) % 2400 + 2400) % 2400 - 200;
      const sy = 80 + r2 * 380;
      ctx.fillStyle = `rgba(170,200,255,${0.12 + Math.sin(t * 1.5 + i) * 0.06})`;
      ctx.beginPath(); ctx.arc(sx, sy, 1.6 + r2 * 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  renderStatic() {
    const res = this.game.quality === 'alta' ? Math.min(1.25, Math.max(1, this.game.pixelScale || 1)) : 1;
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res); g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }
  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) {
      if (ch.x > cam.right || ch.x + CHUNK < cam.left) continue;
      ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);

  }

  drawBack(ctx) {
    const t = this.t;
    this.drawHidden(ctx);
    // ponte dos trilhos restaurada
    if (this.getS('trilhos', false)) {
      const k = this.bridgeAnim ?? 1;
      const n = Math.ceil((C.chasm.x1 - C.chasm.x0) / 22);
      for (let i = 0; i < n; i++) {
        const kk = clamp(k * n * 1.2 - i * 0.6, 0, 1);
        if (kk <= 0) continue;
        ctx.globalAlpha = kk;
        ctx.fillStyle = '#6e4c38'; ctx.fillRect(C.chasm.x0 + i * 22, G - 2 + (1 - kk) * 30, 18, 10);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#9a8a80'; ctx.fillRect(C.chasm.x0, G - 6, (C.chasm.x1 - C.chasm.x0) * k, 3);
      if (k < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,220,130,0.35)'; ctx.fillRect(C.chasm.x0, G - 10, (C.chasm.x1 - C.chasm.x0) * k, 14); ctx.restore(); }
    }
    // ponte de corda
    if (this.getS('ponte-corda', false)) {

    if (far && !blocked(p.cx - p.facing * 60)) {

    this.mirror[i] = this.mirror[i] ? 0 : 1;
    this.setS('espelho' + i, this.mirror[i]);
    g.audio?.sfx('pega');
    g.ui.notify(CX.espelhoGira(this.mirror[i]), 1.8);
    this.sparkle(MIRRORS[i], G - 150, 10);
    if (this.beam().hit) this.openDoor();
  }
  // caminho do raio na galeria: começa no alto, cada espelho "desviando" troca de altura
  beam() {
    let y = H1;
    const pts = [{ x: S.hall.x0 + 70, y }];
    const ev = [...MIRRORS.map((x, i) => ({ x, m: i })), ...BLOCKS.map((b) => ({ x: b.x, b })), { x: TARGET.x, t: true }].sort((a, b) => a.x - b.x);
    for (const e of ev) {
      if (e.m != null) {
        if (this.mirror[e.m]) { pts.push({ x: e.x, y }); y = y === H1 ? H2 : H1; pts.push({ x: e.x, y }); }
      } else if (e.b) {
        if (e.b.y === y) { pts.push({ x: e.x, y }); return { pts, hit: false }; }
      } else if (e.t) {
        pts.push({ x: e.x, y });
        return { pts, hit: y === TARGET.y };
      }
    }
    return { pts, hit: false };
  }
  openDoor() {
    if (this.getS('porta', false)) return;
    const g = this.game;
    this.setS('porta', true);
    for (const h of this.hooks) if (h.id?.startsWith('espelho')) h.hidden = true;
    this.cutscene = new Cutscene(this, [
      { cam: { x: S.door - 120, y: G - 160, zoom: 1.2, rate: 1.3 } }, { wait: 0.7 },
      { do: () => { this.doorK = 0.001; g.audio?.sfx('sino'); g.camera.shake(1.5, 0.4); } }, { wait: 1 },
      { do: () => { this.solids = this.solids.filter((s) => s !== this.doorSolid); this.doorSolid = null; this.player.setExpr('feliz', 3); } },
      { say: CX.galeriaAbre },
      { cam: { x: null } },
    ], () => { this.solids = this.solids.filter((s) => s !== this.doorSolid); this.doorSolid = null; if (this.qstep() === 1) Quests.step(g, 'chama', 2); });
  }
  syncLenses() {
    const q = Quests.get(this.game, 'chama');
    if (q && !q.done && q.step === 4) {
      const n = PILLARS.filter((pl, i) => this.getS('lente' + i, false)).length;
      if (q.n !== n) { q.n = n; Quests.refresh(this.game); }
      if (n >= 3 && this.fase === 'lentes') setTimeout(() => this.darkPhase(), 400);
    }
  }
  turnLens(i) {
    const g = this.game;
    if (this.getS('lente' + i, false)) return;
    this.setS('lente' + i, true);
    this.lensK[i] = 0;
    const pl = PILLARS[i];
    this.sparkle(pl.x + pl.w / 2, pl.top - 60, 20);
    g.audio?.sfx('magia'); g.camera.shake(1.4, 0.25);
    const n = PILLARS.filter((x, k) => this.getS('lente' + k, false)).length;
    g.ui.notify(CX.lenteVirada(n));
    this.aldo.say(CX.aldoProvoca[n % CX.aldoProvoca.length], 2.8);
    const q = Quests.get(g, 'chama');
    if (q && !q.done && q.step === 4) { q.n = n; Quests.refresh(g); }
    if (n >= 3) setTimeout(() => this.darkPhase(), 900);
  }

  darkPhase() {

  goDark() {

    this.dust(S.gap.x0 + 150, G, 30);

    this.solid(S.gap.x0, S.gap.floor, S.gap.x1 - S.gap.x0, H - S.gap.floor);
    this.ladder(S.gap.x0 + 6, 30, G, S.gap.floor);

  reachAltar() {

    this.cutscene = new Cutscene(this, [

      { say: CX.altar.slice(0, 1) },
      { do: () => { this.aldo.react = 1; this.aldo.dir = -1; } },
      { say: CX.altar.slice(1, 2) },
      { cam: { x: 7270, y: G - 100, zoom: 1.55, rate: 1.2 } },

      { say: CX.altar.slice(2, 3) },
      { cam: { x: S.disc.x, y: S.disc.y + 40, zoom: 1.1, rate: 1 } },
      { say: CX.altar.slice(3) },

    ], () => {

  addDisc() {
    this.restore({
      id: 'disco', x: 7240, y: S.dais.top - 170, w: 200, h: 170, floorY: S.dais.top, label: CX.disco, cost: 40, time: 2.4,
      onDone: () => { this.setS('disco', true); this.discK = 0.001; this.game.audio?.sfx('sino'); this.player.setExpr('surpresa', 2); setTimeout(() => this.askLight(), 700); },
    });
  }
  askLight() {
    const g = this.game, ui = g.ui, p = this.player;

  crack() {

      { cam: { x: W - 200, y: G - 60, zoom: 1.4, rate: 1.4 } }, { wait: 0.6 },

  startRescue() {

  rescued(byLira) {

  // ---------- o corte do cabelo ----------
  // O Aldo, vendo a luz ir embora, agarra os cabelos da Lira (onde ainda corre uma parte da chama) e corta com um caco
  // de ferro-frio da gaiola. A mecha perde a cor na mão dele e se desfaz; o que sobra se acomoda num corte curto.
  // replay = true: a mesma cena vista pela pausa (Rever cenas), sem mexer em nada do progresso.
  haircut(replay = false, onDone = null) {
    const g = this.game, p = this.player, a = this.aldo, c = this.caio, s = g.state;
    const AX = 7495, LX = 7405;
    const C2 = CX.corte;
    const hand = () => ({ x: a.handX ?? a.x - 16, y: a.handY ?? a.y - 40 });
    c.scripted = true;
    this.corte = { k: 0 };
    const steps = [
      { do: () => {
        if (replay) p.applyHairState(this, true);
        a.hidden = false; a.x = AX + 30; a.y = S.dais.top; a.dir = -1; a.armPose = null; a.moving = false;
        this.aldoHook.hidden = true; this.rescueT = 0;
        this.ismena.hidden = true; this.bastiao.hidden = true;
        c.x = LX - 150; c.y = S.dais.top; c.dir = 1; c.moving = false;
        g.audio?.music('santuario');
      } },
      { walk: LX },
      { face: -1 },
      { cam: { x: 7420, y: S.dais.top - 70, zoom: 1.6, rate: 1.4 } },
      { do: () => { p.setExpr('determinada', 6); this.corte.glow = 1; p.boostGlow(1.2); } },
      { say: C2.olha },
      // o Aldo avança e agarra os cabelos
      { do: () => { this.corte.lunge = { from: a.x, to: AX, t: 0 }; a.armPose = 1.55; a.talking = false; } },
      { wait: 0.3 },
      { do: () => {
        p.hairHold = { ...hand(), k: 0 }; this.corte.grab = true;
        p.pose = 'puxada'; p.setExpr('surpresa', 8); g.camera.shake(3, 0.3); g.audio?.sfx('puxao');
        this.sparkle(hand().x, hand().y, 10);
      } },
      { wait: 0.5 },
      { say: C2.agarra },
      { do: () => { this.corte.shard = 0.001; g.audio?.sfx('erro'); } },
      { say: C2.caco },
      { do: () => { c.dir = 1; c.say('Lira!', 1.5); } },
      { wait: 0.6 },
      // o golpe
      { do: () => { this.corte.slash = 0.001; } },
      { wait: 0.16 },
      { do: () => this.cutHair(replay) },
      { wait: 1.1 },
      { say: C2.depois },
      { do: () => { if (p.hair.piece) p.hair.piece.draining = true; g.audio?.music('perda'); this.corte.drainFx = true; } },
      { wait: 1.6 },
      { say: C2.apaga },
      { do: () => { p.facing = 1; p.pose = 'maoCabelo'; p.setExpr('triste', 30); } },
      { cam: { x: p.cx + 20, y: S.dais.top - 60, zoom: 2, rate: 1 } },
      { wait: 1.4 },
      { say: C2.reacao },
      // a transformação: o que sobrou se acomoda, e a chama pequena acende
      { do: () => { p.hair.settle(3.4); p.pose = null; p.boostGlow(1.6); this.corte.bloom = 0.001; g.audio?.sfx('magia'); } },
      { wait: 3.6 },
      { do: () => p.setExpr('feliz', 6) },
      { say: C2.acomoda.slice(0, 2) },
      { do: () => p.setExpr('determinada', 6) },
      { say: C2.acomoda.slice(2) },
      // a mecha se desfaz na mão do Aldo
      { do: () => { if (p.hair.piece) p.hair.piece.dissolve = true; this.corte.fly = true; this.corte.drop = 0.001; a.armPose = 0.25; } },
      { cam: { x: 7440, y: S.dais.top - 90, zoom: 1.5, rate: 1 } },
      { wait: 1.6 },
      { say: C2.solta },
      { do: () => { this.corte.caioRun = LX - 46; p.facing = -1; } },
      { until: (t) => Math.abs(c.x - (LX - 46)) < 4 || t > 2.5 },
      { do: () => { c.x = LX - 46; c.moving = false; c.dir = 1; p.setExpr('feliz', 8); } },
      { say: C2.caio },
      { do: () => this.endHaircut(replay) },
    ];
    this.cutscene = new Cutscene(this, steps, () => {
      this.endHaircut(replay);
      if (replay) { onDone?.(); return; }
      this.finale();
    });
  }
  cutHair(replay) {
    const g = this.game, p = this.player, a = this.aldo, s = g.state;
    if (this.corte?.cut) return;
    if (this.corte) this.corte.cut = true;
    const hold = p.hairHold;
    // corta perto da nuca: o pedaço de baixo fica preso na mão do Aldo
    const h = p.hair;
    if (!h.short) {
      const len = hold ? Math.hypot(hold.x - p.cx, hold.y - (p.feet - 55)) : 60;
      const used = Math.max(5, Math.round(len / h.seg));
      // corta no meio das costas; depois o que sobra vai encurtando até o ombro (as pontas viram brilho)
      const at = Math.max(5, Math.min(9, used - 3));
      h.cutAt(at, hold ? { x: hold.x, y: hold.y } : null, Math.max(0, used - at), S.dais.top, -1);
      this.corte.pieceHold = h.piece?.hold;
    }
    p.hairHold = null;
    p.pose = 'susto'; p.vx = -150; p.setExpr('surpresa', 4);
    h.impulse(-p.facing * 12, -10);
    g.camera.shake(5, 0.4);
    g.audio?.sfx('corte');
    g.audio?.music(null);
    this.corte.flash = 1;
    this.sparkle(p.cx + 14, p.feet - 50, 24);
    if (!replay && !s.flag('cabelo-curto')) { s.set('cabelo-curto'); g.save?.(); }
  }
  endHaircut(replay) {
    const p = this.player, a = this.aldo, c = this.caio;
    if (!this.corte) return;
    p.hairHold = null; p.pose = null;
    p.hair.setShort(true);
    a.armPose = null;
    if (c) { c.moving = false; }
    this.corte = null;
    if (!replay) this.game.state.set('cabelo-curto');
  }

  // ---------- sequência final ----------
  finale() {
    const g = this.game, p = this.player, c = this.caio, s = g.state;
    const salvo = s.flag('aldo-salvo');
    this.caio.scripted = true;
    this.cutscene = new Cutscene(this, [
      { do: () => { g.audio?.music('luz'); this.lightK = 0.001; p.boostGlow(2); g.camera.shake(2, 1.2); } },
      { cam: { x: S.disc.x, y: S.disc.y, zoom: 1.2, rate: 0.9 } }, { wait: 1.6 },
      { say: CX.final1 },
      { cam: { x: S.disc.x - 200, y: G - 420, zoom: 0.7, rate: 0.6 } }, { wait: 1.2 },
      { do: () => { this.vista = 'cidade'; } }, { wait: 1.4 },
      { say: CX.final2 },
      { do: () => { this.vista = 'jardim'; } }, { wait: 1.4 },
      { say: CX.final3 },
      { do: () => { this.vista = null; } }, { wait: 0.8 },
      { cam: { x: p.cx, y: p.cy - 20, zoom: 1.6, rate: 1 } },
      { do: () => { p.setExpr('feliz', 12); p.boostGlow(1.5); this.holdPose = true; } }, { wait: 1 },
      { say: CX.final4 },
      { do: () => {
        this.holdPose = false;
        this.ismena.hidden = false; this.ismena.x = 7210; this.ismena.dir = 1;
        this.bastiao.hidden = false; this.bastiao.x = 7262; this.bastiao.dir = 1;
        c.x = 7300; c.y = S.dais.top; c.dir = 1; c.moving = false;
        p.facing = -1;
      } },
      { cam: { x: 7300, y: G - 100, zoom: 1.2, rate: 1.1 } }, { wait: 0.5 },
      { say: CX.final5.slice(0, 1) },
      { do: () => p.setExpr('surpresa', 2) },
      { say: CX.final5.slice(1, 4) },
      { do: () => p.setExpr('pensativa', 4) },
      { say: CX.final5.slice(4, 6) },
      { do: () => p.setExpr('feliz', 10) },
      { say: CX.final5.slice(6) },
      { say: salvo ? CX.finalAldoSalvo : CX.finalAldoCaio },
      // sem cabelo comprido para laçar: o Caio dá a corda de gancho
      { say: CX.corda.slice(0, 2) },
      { do: () => { s.set('corda'); this.sparkle(p.cx, p.feet - 28, 12); g.audio?.sfx('pega'); } },
      { say: CX.corda.slice(2) },
      { do: () => { this.aldo.hidden = true; this.bastiao.hidden = true; } }, { wait: 0.6 },
      { cam: { x: 6900, y: G - 300, zoom: 0.8, rate: 0.6 } }, { wait: 1.6 },
      { cam: { x: null } },
    ], () => this.endStory());
  }
  endStory() {
    const g = this.game, s = g.state;
    this.holdPose = false; this.vista = null; this.lightK = 1;
    this.aldo.hidden = true; this.bastiao.hidden = true;
    this.ismena.hidden = false;
    this.caio.scripted = false; this.caio.follow = false;
    s.set('final-luz');
    s.set('cabelo-curto'); s.set('corda'); s.set('tranca', false);
    this.player.applyHairState(this);
    this.setS('fase', 'fim');
    s.brilho = 100;
    if (Quests.active(g, 'preparo')) Quests.complete(g, 'preparo');
    Quests.complete(g, 'chama');
    g.audio?.music('luz');
    g.touch?.setShortHair?.(true);
    setTimeout(() => { if (g.scenes.current === this) { g.ui.toast(CX.capitulo, 'O destino da Chama'); setTimeout(() => { g.ui.notify(g.ui.fmt(CX.cordaNota), 6); setTimeout(() => g.ui.notify(CX.depoisFinal, 5), 6400); }, 3400); } }, 3600);
  }

  // ---------- atualização ----------
  updateExtra(dt) {
    const p = this.player, g = this.game, t = this.t, f = this.fase;
    this.updateCaio(dt);
    this.lensK ||= [1, 1, 1];
    for (let i = 0; i < 3; i++) this.lensK[i] = Math.min(1, this.lensK[i] + dt * 1.5);
    const grow = (k, v) => { if (this[k] > 0 && this[k] < 1) this[k] = Math.min(1, this[k] + dt * v); };
    grow('gateK', 0.7); grow('doorK', 1); grow('greenK', 1); grow('discK', 0.6); grow('cageOpen', 0.8); grow('lightK', 0.4); grow('lensWake', 1);
    if (this.bridgeK != null && this.bridgeK < 1) this.bridgeK = Math.min(1, this.bridgeK + dt * 1.2);
    if (this.wheelSpin != null) this.wheelSpin += dt * (1 - (this.bridgeK ?? 1)) * 8;
    if (this.collapseK != null && this.collapseK < 1) this.collapseK = Math.min(1, this.collapseK + dt * 1.5);
    for (let i = 0; i < 4; i++) this.mirrorAnim[i] += (this.mirror[i] - this.mirrorAnim[i]) * Math.min(1, dt * 8);
    this.vistaK = clamp((this.vistaK || 0) + (this.vista ? dt : -dt) * 1.6, 0, 1);
    if (this.vista) this.vistaKind = this.vista;

    // Lume acende as arandelas, os braseiros e mostra as inscrições
    if (p.lume) {
      for (const sc of this.sconces) if (!this.getS('arandela' + sc.i, false) && Math.hypot(p.cx - sc.x, p.cy - sc.y) < 140) {
        this.setS('arandela' + sc.i, true); this.sparkle(sc.x, sc.y - 10, 10); g.audio?.sfx('pega');
        if (!this.saidSconce) { this.saidSconce = true; g.ui.notify(CX.arandelaAcesa); }
      }
      BRAS.forEach((b, i) => {
        if (this.getS('bras' + i, false)) return;
        if (Math.hypot(p.cx - b.x, p.cy - (b.y - 30)) < 130) { this.brasT = (this.brasT || 0) + dt; if (this.brasT > 0.5) { this.brasT = 0; this.lightBrazier(i); } }
      });
    } else this.brasT = 0;
    INSCR.forEach((d, i) => {
      if (this.getS('inscr' + i, false)) return;
      const near = Math.hypot(p.cx - (d.x + 40), p.cy - (d.y + 45)) < 170;
      this.inscrK[i] = clamp(this.inscrK[i] + (p.lume && near ? dt : -dt * 0.5), 0, 1);
      if (this.inscrK[i] >= 1) {
        this.setS('inscr' + i, true); g.state.set('inscricao' + i);
        this.sparkle(d.x + 40, d.y + 40, 18); g.audio?.sfx('sino');
        this.say(CX.inscricoes[i]);

    });

    // ferro-frio: puxa cabelo solto
    const mags = [...MAGNETS];
    if (f === 'escuro') mags.push(...GAP_MAGNETS);
    const under = mags.find((mx) => Math.abs(p.cx - mx) < 115);
    this.magPull = under != null && !p.braided && !p.shortHair ? under : null;
    if (under != null && !p.shortHair) {

        if (!(this.magWarnT > t)) { this.magWarnT = t + 4; g.ui.notify(g.ui.fmt(CX.ferroPuxa), 3.4); }
      } else if (!this.saidBraidOk) { this.saidBraidOk = true; g.ui.notify(CX.ferroTrancado, 2.6); }
    }

    // avisos de chegada em cada parte
    const once = (k, test, lines) => { if (!this.getS(k, false) && test) { this.setS(k, true); if (lines) this.say(lines); } };
    once('v-patio', p.cx > S.tunnel.x1 + 40 && p.onGround, CX.patioChegada);
    once('v-abismo', p.cx > S.chasm.x0 - 140 && p.cx < S.chasm.x0 && p.onGround && !this.getS('ponte', false), CX.abismoPatio);
    once('v-galeria', p.cx > S.hall.x0 + 60 && p.onGround, CX.galeriaChegada);
    once('v-corredor', p.cx > S.door + 80 && p.onGround, CX.corredorChegada);
    if (p.cx > S.chasm2.x1 + 20 && p.onGround && Math.abs(p.feet - G) < 4) {
      if (this.qstep() === 2) Quests.step(g, 'chama', 3);
      if (f === 'inicio' && this.qstep() === 3) this.meetAldo();
    }
    if (f === 'escuro' && p.onGround && p.cx > S.dais.x0 + 6 && Math.abs(p.feet - S.dais.top) < 4) this.reachAltar();

    // raios das lentes (fase das lentes): gastam o Brilho e empurram a Lira
    this.beams = [];
    if (f === 'lentes') {
      PILLARS.forEach((pl, i) => {
        if (this.getS('lente' + i, false)) return;
        const ox = pl.x + pl.w / 2, oy = pl.top - 70;
        const tx = ox + Math.sin(t * 0.85 + i * 2.1) * 210, ty = G;
        this.beams.push({ ox, oy, tx, ty });
        if (this.cutscene || g.ui.dialogOpen || this.hurtT > t || (p.feet < pl.top + 4 && Math.abs(p.cx - ox) < 50)) return;
        // distância do corpo da Lira até o raio
        const px = p.cx, py = p.cy, vx = tx - ox, vy = ty - oy, k = clamp(((px - ox) * vx + (py - oy) * vy) / (vx * vx + vy * vy), 0, 1);
        const dx = px - (ox + vx * k), dy = py - (oy + vy * k);
        if (k > 0.25 && Math.hypot(dx, dy) < 20) {
          this.hurtT = t + 1.3;
          g.state.brilho = Math.max(0, g.state.brilho - 15);
          p.vx = (px < ox + vx * k && px > S.chasm2.x1 + 120 ? -1 : 1) * 320; p.vy = -300; p.onGround = false;
          p.setExpr('surpresa', 1.2); g.camera.shake(3, 0.2); g.audio?.sfx('erro');
          this.sparkle(px, py, 10);
          if (!(this.burnWarnT > t)) { this.burnWarnT = t + 6; g.ui.notify(CX.raioQueima, 2.6); }
        }
      });
      // o Aldo provoca de vez em quando
      this.provT = (this.provT ?? 6) - dt;
      if (this.provT <= 0) { this.provT = 7 + Math.random() * 4; this.aldo.say(CX.aldoProvoca[(Math.random() * CX.aldoProvoca.length) | 0], 2.6); }
    }
    // a lanterna verde ajuda a recarregar o Brilho na escuridão
    if (f === 'escuro' && !p.lume) g.state.brilho = Math.min(100, g.state.brilho + 5 * dt);
    // pedras flutuantes: aparecem com o Lume e somem devagar
    if (this.stones) this.stoneSeen = clamp((this.stoneSeen || 0) + (p.lume && p.cx > S.gap.x0 - 300 ? dt * 3 : -dt * 0.35), 0, 1);

    // resgate do Aldo
    if (f === 'resgate' && this.rescueT > 0 && !this.cutscene && !g.ui.dialogOpen) {
      this.rescueT -= dt;
      g.ui.setCaption(`Segure o Aldo com os Cabelos: <b>${Math.ceil(this.rescueT)}</b>`);
      if (this.rescueT <= 0) this.rescued(false);
    }

    // escuridão de cada parte
    const x = p.cx;
    let want;
    if (f === 'fim') want = x < S.tunnel.x1 ? 0.45 : (x > S.hall.x0 && x < S.hall.x1) ? 0.4 : 0.08;
    else if (x < S.tunnel.x1) want = 0.82 - SCONCES.filter((s, i) => this.getS('arandela' + i, false)).length * 0.08;
    else if (x < S.gate) want = p.feet > G + 60 ? 0.75 : 0.42;
    else if (x < S.door + 40) want = 0.86;

    BRAS.forEach((b, i) => L.push({ x: b.x, y: b.y - 40, r: this.getS('bras' + i, false) ? 230 : 40, a: this.getS('bras' + i, false) ? 0.9 : 0.4 }));
    if (x > S.hall.x0 - 400 && x < S.hall.x1) {
      const bm = this.beam();
      for (let k = 0; k < bm.pts.length - 1; k++) {
        const a = bm.pts[k], b = bm.pts[k + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
        for (let d = 0; d <= len; d += 70) L.push({ x: a.x + (b.x - a.x) * d / len, y: a.y + (b.y - a.y) * d / len, r: 70, a: 0.7 });
      }
      if (this.getS('porta', false)) L.push({ x: TARGET.x, y: TARGET.y, r: 220, a: 0.85 });
      L.push({ x: S.hall.x0 + 70, y: CEIL, r: 120, a: 0.8 });
    }
    for (const bm of this.beams) for (let k = 0; k <= 1; k += 0.2) L.push({ x: bm.ox + (bm.tx - bm.ox) * k, y: bm.oy + (bm.ty - bm.oy) * k, r: 60, a: 0.7 });
    if (x > S.chasm2.x0 - 300) {
      L.push({ x: S.cage.x, y: S.dais.top - 50, r: f === 'fim' ? 120 : 160, a: 0.8 });
      if (this.getS('disco', false) || f === 'fim') L.push({ x: S.disc.x, y: S.disc.y, r: 320, a: 0.9 });
      if (this.stones && this.stoneSeen > 0) for (const [sx, sy, sw2] of STONES) L.push({ x: sx + sw2 / 2, y: sy, r: 60 * this.stoneSeen, a: 0.7 * this.stoneSeen });
    }
    if (f === 'escuro' || f === 'altar' || f === 'resgate') L.push({ x: p.cx + p.facing * 6, y: p.feet - 24, r: 95 * (this.greenK ?? 1), a: 0.75 });
    this.darkLights = L;
  }

  updateCorte(dt) {
    const C = this.corte, p = this.player, a = this.aldo, c = this.caio;
    if (!C) return;
    C.k += dt;
    if (C.lunge) {
      const L = C.lunge; L.t = Math.min(1, L.t + dt / 0.28);
      a.x = L.from + (L.to - L.from) * (1 - Math.pow(1 - L.t, 3)); a.moving = L.t < 1;
      if (L.t >= 1) C.lunge = null;
    }
    // a mão do Aldo segura os cabelos: a Lira é puxada para trás devagar
    if (p.hairHold && C.grab) {
      p.hairHold.x = a.handX ?? a.x - 16; p.hairHold.y = a.handY ?? a.y - 40;
      p.hairHold.k = Math.min(1, (p.hairHold.k || 0) + dt * 6);
      p.facing = -1;
      if (p.cx < a.x - 92) p.x += 12 * dt;
    }
    if (C.pieceHold) { C.pieceHold.x = a.handX ?? a.x - 16; C.pieceHold.y = a.handY ?? a.y - 40; }
    if (C.shard > 0 && C.shard < 1) C.shard = Math.min(1, C.shard + dt * 3);
    if (C.slash > 0 && C.slash < 1) C.slash = Math.min(1, C.slash + dt / 0.32);
    if (C.flash > 0) C.flash = Math.max(0, C.flash - dt * 2.2);
    if (C.bloom > 0 && C.bloom < 1) C.bloom = Math.min(1, C.bloom + dt / 2.8);
    if (C.drop > 0 && C.drop < 1) C.drop = Math.min(1, C.drop + dt * 1.6);
    // a cor sai da mecha cortada em fiapos dourados
    const pc = p.hair.piece;
    if (pc && (C.drainFx || C.fly) && this.fx && Math.random() < (C.fly ? 0.9 : 0.45)) {
      const q = pc.pts[(Math.random() * pc.pts.length) | 0];
      const tx = S.disc.x - q.x, ty = S.disc.y - q.y;
      this.fx.emit({ x: q.x, y: q.y, vx: C.fly ? tx * 0.6 : (Math.random() - 0.5) * 20, vy: C.fly ? ty * 0.6 : -30 - Math.random() * 30, g: -10, size: 1.2 + Math.random() * 1.6, life: C.fly ? 1.4 : 0.9, color: Math.random() < 0.5 ? '#ffd56a' : '#ffe9a8', star: Math.random() < 0.4 });
    }
    // enquanto o cabelo encurta, as pontas viram brilho dourado
    const hh = p.hair;
    if (hh.settling && this.fx) {
      const tip = hh.pts[Math.min(hh.pts.length - 1, Math.ceil(hh.len))];
      for (let k = 0; k < 2; k++) this.fx.emit({ x: tip.x + (Math.random() - 0.5) * 10, y: tip.y + (Math.random() - 0.5) * 6, vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 40, g: -12, size: 1.3 + Math.random() * 1.6, life: 0.9 + Math.random() * 0.5, color: Math.random() < 0.5 ? '#ffd56a' : '#fff0b8', star: Math.random() < 0.5 });
    }
    // brilhos em volta do cabelo novo enquanto ele se acomoda
    if (C.bloom > 0 && C.bloom < 1 && this.fx && Math.random() < 0.6) {
      const an = Math.random() * Math.PI * 2;
      this.fx.emit({ x: p.cx - p.facing * 6 + Math.cos(an) * 16, y: p.feet - 50 + Math.sin(an) * 12, vx: -Math.cos(an) * 14, vy: -18 - Math.random() * 16, g: -8, size: 1 + Math.random() * 1.4, life: 0.8, color: '#fff0b8', star: true });
    }
    if (C.caioRun != null && c) {
      const d = C.caioRun - c.x;
      if (Math.abs(d) > 3) { c.dir = Math.sign(d); c.x += c.dir * Math.min(Math.abs(d), 230 * dt); c.moving = true; c.walkPh += dt * 30; }
      else { c.moving = false; C.caioRun = null; }
    }
  }
  // o caco de ferro-frio, o segundo braço do Aldo e o golpe
  drawCorte(ctx) {
    const C = this.corte, a = this.aldo;
    if (!C || a.hidden) return;
    const sc = a.scale || 1, f = a.dir, shX = a.x - f * 2 * sc, shY = a.y - 49 * sc;
    if (C.shard > 0 && !(C.drop >= 1)) {
      // levantado (antes do golpe) -> desce na diagonal até a nuca da Lira (golpe) -> cai no chão
      const UP = 2.9, DOWN = 1.25;
      const A = !(C.slash > 0) ? 0.3 + (UP - 0.3) * Math.min(1, C.shard * 1.4) : UP + (DOWN - UP) * (1 - Math.pow(1 - C.slash, 3));
      const at = (ang, r) => [shX + f * Math.sin(ang) * r * sc, shY + Math.cos(ang) * r * sc];
      const [hx, hy] = at(A, 17);
      ctx.save();
      ctx.strokeStyle = shade(a.look.top); ctx.lineWidth = 4.5 * sc; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shX, shY); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = a.look.skin; ctx.beginPath(); ctx.arc(hx, hy, 2.4 * sc, 0, Math.PI * 2); ctx.fill();
      let sx = hx, sy = hy, rot = Math.atan2(hy - shY, hx - shX);
      if (C.drop > 0) { sx = hx - f * 10 * C.drop; sy = hy + (S.dais.top - 2 - hy) * C.drop * C.drop; rot += C.drop * 2.4 * f; }
      ctx.translate(sx, sy); ctx.rotate(rot);
      ctx.fillStyle = '#cfe0f4'; ctx.strokeStyle = '#7d8fae'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-2, -2.2); ctx.lineTo(16, -0.5); ctx.lineTo(-2, 2.4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      // rastro do golpe
      if (C.slash > 0 && C.slash < 1) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = `rgba(220,235,255,${0.9 * (1 - C.slash)})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let k = 0; k <= 10; k++) { const [x, y] = at(UP + (A - UP) * (k / 10), 33); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
        ctx.restore();
      }
    }
    // a pequena chama nova no cabelo curto
    if (C.bloom > 0) {
      const p = this.player, x = p.cx - p.facing * 8, y = p.feet - 50, k = Math.sin(Math.min(1, C.bloom) * Math.PI);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(x, y, 0, x, y, 46);
      gr.addColorStop(0, `rgba(255,226,150,${0.3 * k})`); gr.addColorStop(1, 'rgba(255,210,120,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - 46, y - 46, 92, 92);
      ctx.restore();
    }
  }

  // ---------- desenho ----------
  drawBackground(ctx) {
    const cam = this.game.camera, Wv = this.game.view.w, t = this.t, fim = this.fase === 'fim';
    const dawn = fim ? (this.lightK ?? 1) : 0;
    const gr = ctx.createLinearGradient(0, 0, 0, 540);
    gr.addColorStop(0, mix('#140f2c', '#5a6aa8', dawn)); gr.addColorStop(0.6, mix('#2a1d48', '#e89a7a', dawn)); gr.addColorStop(1, mix('#3a2850', '#f6d08a', dawn));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, Wv, 540);
    // estrelas
    for (let i = 0; i < 90; i++) {
      const r = mulberry32(300 + i)(), r2 = mulberry32(700 + i)();
      const sx = ((r * 2600 - cam.x * 0.03) % 2600 + 2600) % 2600 - 300, sy = r2 * 330;
      ctx.fillStyle = `rgba(255,248,230,${(0.25 + Math.sin(t * 1.3 + i) * 0.15) * (1 - dawn * 0.8)})`;
      ctx.fillRect(sx, sy, 1.6, 1.6);
    }
    // lua (ou sol nascendo)
    const mx = Wv * 0.78 - cam.x * 0.02 % 200;
    ctx.fillStyle = fim ? 'rgba(255,226,150,0.9)' : 'rgba(240,236,220,0.85)';
    ctx.beginPath(); ctx.arc(mx, fim ? 380 : 90, fim ? 46 : 26, 0, Math.PI * 2); ctx.fill();
    // montanhas distantes
    for (const [f, col, amp, base, seed] of [[0.06, mix('#2c2148', '#7a6a9a', dawn), 70, 380, 1], [0.12, mix('#241a3c', '#5a4a78', dawn), 90, 430, 2]]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 540);
      for (let sx = 0; sx <= Wv + 40; sx += 40) { const wx = sx + cam.x * f; ctx.lineTo(sx, base - Math.abs(Math.sin(wx * 0.004 + seed)) * amp - Math.sin(wx * 0.011) * 20); }
      ctx.lineTo(Wv, 540); ctx.fill();
    }
    // Valdouro lá embaixo, com as lanternas (poucas antes do final, todas depois)
    const vx = Wv * 0.35 - cam.x * 0.05;
    ctx.fillStyle = mix('#1e1630', '#4a3a5a', dawn);
    for (let i = 0; i < 26; i++) { const hx = vx + i * 22, hh = 12 + mulberry32(40 + i)() * 18; ctx.fillRect(hx, 470 - hh, 18, hh + 70); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const lit = fim ? 60 : 6;

      const r = mulberry32(900 + i)(), r2 = mulberry32(1300 + i)();
      const lx = vx + r * 560, ly = 430 + r2 * 40 - (fim ? ((t * 6 + i * 13) % 160) : 0);
      ctx.fillStyle = `rgba(255,200,110,${0.6 + Math.sin(t * 3 + i) * 0.2})`; ctx.beginPath(); ctx.arc(lx, ly, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    // fios de luz das lanternas voando para o terraço (antes do final)
    if (!fim) {
      for (const m of this.motesSky) {
        const sx = ((m.x + t * m.v - cam.x * 0.08) % 1400 + 1400) % 1400 - 200;
        const sy = m.y + Math.sin(t + m.ph) * 8;
        ctx.fillStyle = `rgba(255,214,130,${0.35 + Math.sin(t * 2 + m.ph) * 0.15})`;
        ctx.fillRect(sx, sy, 5 * m.s, 1.4);
      }
    }
    ctx.restore();
  }

  renderStatic() {
    const res = this.game.quality === 'alta' ? Math.min(1.25, Math.max(1, this.game.pixelScale || 1)) : 1;
    this.chunks = [];
    for (let x = 0; x < this.width; x += CHUNK) {
      const c = document.createElement('canvas');
      c.width = Math.ceil(CHUNK * res); c.height = Math.ceil((this.height - CY) * res);
      const g = c.getContext('2d');
      g.scale(res, res); g.translate(-x, -CY);
      g.beginPath(); g.rect(x, CY, CHUNK, this.height - CY); g.clip();
      this.drawStatic(g, x, x + CHUNK);
      this.chunks.push({ x, c });
    }
    return null;
  }
  drawStaticLayer(ctx) {
    const cam = this.game.camera;
    for (const ch of this.chunks) {
      if (ch.x > cam.right || ch.x + CHUNK < cam.left) continue;
      ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
    }
  }

  drawStatic(g, x0, x1) {
    const vis = (a, b) => b >= x0 - 80 && a <= x1 + 80;
    const stone = '#6a5a74', stoneD = '#4a3e56', gold = '#d9b25a';
    // interiores: túnel, galeria e corredor (paredes ao fundo)

    wall(60, S.tunnel.x1, CEIL, E, '#4e4260', 3);
    wall(S.hall.x0, S.door, CEIL, G, '#544668', 5);
    wall(S.door, S.hall.x1, CEIL, G, '#4a4454', 6);
    // tetos
    if (vis(0, S.tunnel.x1)) { g.fillStyle = '#2a2236'; g.fillRect(0, CY, S.tunnel.x1, CEIL - CY); }
    if (vis(S.hall.x0, S.hall.x1)) { g.fillStyle = '#2a2236'; g.fillRect(S.hall.x0, CY, S.hall.x1 - S.hall.x0, CEIL - CY); }
    for (const [a, b] of [[0, S.tunnel.x1], [S.hall.x0, S.hall.x1]]) if (vis(a, b)) { g.fillStyle = '#3a3048'; g.fillRect(a, CEIL - 14, b - a, 14); g.fillStyle = gold; for (let x = a + 30; x < b; x += 120) P.sunSymbol(g, x, CEIL - 7, 4, '#a08a4a', 0.8); }
    // chão de pedra antiga com faixa dourada
    const ground = (a, b, y) => { if (!vis(a, b)) return; P.stones(g, a, y + 10, b - a, H - y - 10, stoneD, 11); g.fillStyle = stone; g.fillRect(a, y, b - a, 12); g.fillStyle = '#8a7a90'; g.fillRect(a, y, b - a, 3); };
    ground(60, S.stairs.x0, E);
    const sw = (S.stairs.x1 - S.stairs.x0) / S.stairs.n, sh = (E - G) / S.stairs.n;

    this.object({ id: 'bau-nenufares', x: 4775, y: G - 40, w: 50, h: 40, label: LG.nenufaresBau, use: () => this.openChest('bau-nenufares', LG.nenufaresBauTxt, LG.nenufaresBauVazio) });
    this.object({ id: 'pinturas', x: 5500, y: G - 120, w: 80, h: 110, label: LG.grutaDentro, get hidden() { return !area.getS('gruta', false); }, use: () => { s.set('lago-pinturas'); this.say(LG.grutaTxt); } });
    this.object({ id: 'ruinas', x: 6560, y: G - 140, w: 80, h: 90, label: LG.ruinas, use: () => this.say(LG.ruinasTxt) });
    this.object({ id: 'pedra', x: STONE.x - 30, y: G - 130, w: 60, h: 130, label: LG.pedra, use: () => this.readStone() });
    this.petal(1, 2040, G - 182);          // no galho da Ilha das Garças
    this.petal(2, 2800, 620 - 30);          // no topo do rochedo
    this.petal(3, 4840, G - 30);            // na ilhota dos nenúfares
    this.petal(4, 5590, G - 30);            // dentro da gruta

    this.nara = this.npc({
      id: 'nara', name: 'Nara, a barqueira', x: 380, y: G, speed: 18,
      look: { skin: '#a86a48', hair: '#1a1210', hairStyle: 'longo', top: '#3a6a8a', bottom: '#2a3a4a', belt: '#c8a24a', hat: 'lenco', hatColor: '#e0584a' },
      route: [{ x: 360, wait: 5, face: 1 }, { x: 430, wait: 5, face: 1 }],
      talk: () => {
        const q = Quests.get(g, 'lanternas');
        if (q && !q.done) return q.step === 1 ? LG.naraLanternasFim : LG.naraLanternas(this.lit());
        return q?.done ? LG.naraDepois : LG.nara;
      },
      afterTalk: () => { const q = Quests.get(g, 'lanternas'); if (q && !q.done && q.step === 1) Quests.complete(g, 'lanternas'); },
    });
    Object.defineProperty(this.nara, 'questMark', { get: () => (Quests.active(g, 'lanternas') && Quests.get(g, 'lanternas').step === 1 ? '!' : null), set() {}, configurable: true });

    this.zone(LG.zonas.cais, (p) => p.cx < 1200);
    this.zone(LG.zonas.garcas, (p) => p.cx > 1500 && p.cx < 2200);
    this.zone(LG.zonas.mirante, (p) => p.cx > 2350 && p.cx < 2950);
    this.zone(LG.zonas.troncos, (p) => p.cx > 3050 && p.cx < 3500);
    this.zone(LG.zonas.nenufares, (p) => p.cx > 3800 && p.cx < 4950);
    this.zone(LG.zonas.gruta, (p) => p.cx > 5250 && p.cx < 5750);
    this.zone(LG.zonas.reflexo, (p) => p.cx > 6100);

    // barco: parado no último ponto onde a Lira desembarcou
    const d = this.dock(this.getS('doca', 'cais')) || DOCKS[0];
    this.boat = { x: d.bx, v: 0, dir: 1, face: 1, on: false, row: 0, stroke: 0, last: d.id };
    this.night = 0; this.nightTo = 0;
    this.wake = []; this.wakeT = 0;
    this.sky = new LanternSky(g);
    this.caioBubble = null;
    this.logK = this.getS('troncos', false) ? 1 : 0;
    this.grotK = this.getS('gruta', false) ? 1 : 0;
    this.lifted = false;
  }

  lit() { return LANTS.filter((x, i) => this.getS('lant' + i, false)).length; }
  // ponto de desembarque onde o barco está parado (ou perto, devagar)
  boatDock() {
    const b = this.boat;
    return DOCKS.find((d) => Math.abs(b.x - d.bx) < 95 && (!d.secret || this.getS('gruta', false))) || null;
  }

  onEnter(data) {
    const g = this.game, s = g.state;
    g.audio?.music('lago');
    // chegando pelo festival (ou pela viagem livre), o barco espera no cais
    if (!data?.pos) { this.boat.x = DOCKS[0].bx; this.boat.last = 'cais'; this.setS('doca', 'cais'); }
    s.set('regiao-lago');
    if (!s.flag('lago-visto')) {
      s.set('lago-visto');
      setTimeout(() => {
        if (g.scenes.current !== this) return;
        this.say(LG.chegada, () => {
          if (!Quests.get(g, 'lago')) Quests.start(g, 'lago');
          if (!Quests.get(g, 'lanternas')) { const tr = s.tracked; Quests.start(g, 'lanternas', { silent: true }); s.tracked = tr; this.syncLanterns(); Quests.refresh(g); }
        });
      }, 900);
    } else {
      if (!Quests.get(g, 'lago')) Quests.start(g, 'lago', { silent: true });
      if (!Quests.get(g, 'lanternas')) { const tr = s.tracked; Quests.start(g, 'lanternas', { silent: true }); if (tr) s.tracked = tr; }
      this.syncLanterns(); Quests.refresh(g);
    }
  }
  exit() {
    super.exit();
    const g = this.game;
    g.audio?.music(null); g.cinematic = false;
    g.touch?.setBoat?.(false);
  }
  syncLanterns() {
    const q = Quests.get(this.game, 'lanternas');
    if (!q || q.done || q.step !== 0) return;
    q.n = this.lit(); if (q.n >= LANTS.length) Quests.step(this.game, 'lanternas', 1);
  }

  // ---------- embarcar e desembarcar ----------
  embark() {
    const g = this.game, s = g.state, b = this.boat, p = this.player;
    const d = this.boatDock();
    if (!d) return;
    b.on = true; b.v = 0; b.x = d.bx; b.dir = b.face = p.cx < b.x ? 1 : (d.id === 'reflexo' ? -1 : 1);
    b.last = d.id; this.setS('doca', d.id);
    p.vx = p.vy = 0; p.lasso = p.swing = p.ladder = null; p.anim.set('idle');
    this.placeOnBoat();
    this.dust(b.x, WL, 10);
    g.audio?.sfx('pega');
    if (!s.flag('lago-embarcou')) { s.set('lago-embarcou'); g.ui.notify(g.ui.touch ? LG.embarcouToque : LG.embarcou, 6); }
    if (Quests.get(g, 'lago')?.step === 0) Quests.step(g, 'lago', 1);
    // depois da pedra, a volta começa com a noite das lanternas
    if (Quests.get(g, 'lago')?.step === 3) setTimeout(() => { if (g.scenes.current === this && this.boat.on) this.nightScene(); }, 400);
  }
  disembark(d) {
    const g = this.game, b = this.boat, p = this.player;
    b.on = false; b.v = 0; b.x = d.bx; b.last = d.id; this.setS('doca', d.id);
    p.x = d.land - p.w / 2; p.y = G - p.h; p.vx = p.vy = 0; p.onGround = true;
    p.hair.reset(p.cx, p.feet - 54, p.facing);
    this.safePos = { x: d.land, y: G, facing: p.facing };
    this.safeTrail = [{ ...this.safePos }];
    this.landDock = d;
    g.audio?.sfx('pega');
    const q = Quests.get(g, 'lago');
    if (q && !q.done && q.step === 4 && d.id === 'cais') {
      this.say(LG.cheguei, () => Quests.complete(g, 'lago'));
    }
  }
  placeOnBoat() {
    const b = this.boat, p = this.player, by = this.wave(b.x) - 10;
    p.x = b.x + b.face * 26 - p.w / 2; p.y = by - p.h; p.vx = 0; p.vy = 0; p.onGround = true; p.facing = b.dir;
  }

  // ---------- atualização ----------
  update(dt) {
    if (!this.boat.on) { super.update(dt); return; }
    this.updateBoat(dt);
  }

  // no barco, o cabelo descansa no convés e na superfície da água (não afunda até o fundo do lago)
  hairSolids() {
    if (!this.boat.on) return this.solids;
    const b = this.boat;
    if (!this._water) this._water = { x: 0, y: WL - 6, w: 1400, h: 500 };
    this._water.x = b.x - 700; this._water.y = Math.min(WL - 6, this.wave(b.x) - 4);
    return [...this.solids, this._water];
  }

  updateBoat(dt) {
    const g = this.game, inp = g.input, p = this.player, b = this.boat, s = g.state;
    this.t += dt;
    const locked = g.ui.dialogOpen || g.scenes.busy || g.paused || !!this.cutscene;
    if (this.cutscene) this.cutscene.update(dt);
    // remar: direita/esquerda (ou joystick), Shift mais rápido, baixo freia, Espaço dá uma remada forte
    const ax = g.touch?.visible && g.touch.axis && Math.abs(g.touch.axis.x) > 0.28 ? clamp(g.touch.axis.x, -1, 1) : 0;
    let thrust = locked ? 0 : (inp.is('right') ? 1 : 0) - (inp.is('left') ? 1 : 0);
    if (!locked && ax) thrust = ax;
    const run = !locked && (inp.is('run') || (g.touch?.axis?.m > 0.92));
    const max = run ? 330 : 215;
    if (thrust) {
      b.dir = Math.sign(thrust);
      const same = Math.sign(b.v) === b.dir || Math.abs(b.v) < 5;
      b.v += thrust * (same ? 300 : 560) * dt;
      if (Math.abs(b.v) > max) b.v = Math.sign(b.v) * Math.max(max, Math.abs(b.v) - 400 * dt);
      b.row += dt * (run ? 9 : 6);
    } else {
      b.v *= Math.exp(-0.7 * dt);
      if (Math.abs(b.v) < 6) b.v = 0;
    }
    if (!locked && inp.is('down')) { b.v = Math.sign(b.v) * Math.max(0, Math.abs(b.v) - 520 * dt); }
    b.stroke = Math.max(0, b.stroke - dt);
    if (!locked && inp.hit('jump') && b.stroke <= 0) {
      inp.consume('jump'); b.stroke = 0.55;
      b.v = clamp(b.v + b.dir * 170, -420, 420);
      for (let i = 0; i < 10; i++) this.fx.emit({ x: b.x - b.face * 50, y: WL, vx: -b.dir * (60 + Math.random() * 90), vy: -Math.random() * 160, g: 500, size: 2, life: 0.6, color: '#d6f0ff' });
      g.audio?.sfx('sopro');
    }
    // vira o barco devagar
    b.face += clamp(b.dir - b.face, -dt * 4, dt * 4);
    // anda e bate nas margens e nos troncos (volta um pouco, nunca fica preso)
    b.x += b.v * dt;
    const wall = this.getS('troncos', false) ? BOAT.max : BOAT.wall;
    const bump = (x, msg) => {
      b.x = x; if (Math.abs(b.v) > 70) { g.camera.shake(2, 0.25); g.audio?.sfx('erro'); if (msg && !(this.bumpT > this.t)) { this.bumpT = this.t + 4; msg(); } }
      b.v = -b.v * 0.3;
    };
    if (b.x < BOAT.min) bump(BOAT.min, null);
    if (b.x > wall) bump(wall, () => {
      if (!s.flag('lago-troncos-visto')) { s.set('lago-troncos-visto'); this.say(LG.troncos, () => g.ui.notify(g.ui.fmt(LG.troncosDica), 4)); } else g.ui.notify(g.ui.fmt(LG.troncosDica), 3.5);
    });
    if (b.x > BOAT.max) bump(BOAT.max, null);
    // a Lira vai em pé na proa; o Lume e os Cabelos funcionam no barco
    const c = locked ? NO_INPUT : { ...NO_INPUT, light: inp.is('light') };
    if (this.holdPose) p.channeling = true; else p.channeling = false;
    this.placeOnBoat();
    p.update(dt, this, c);
    if (!p.reach) this.placeOnBoat(); else { const by = this.wave(b.x) - 10; p.y = by - p.h; p.vy = 0; }
    p.facing = b.dir;
    // ações
    this.focusObj = null; this.focusHook = null; this.focusRestore = null;
    this.focusDock = !locked && Math.abs(b.v) < 90 ? this.boatDock() : null;
    this.focusTarget = !locked && !p.reach ? this.hairTarget() : null;
    if (!locked) {
      if (this.focusDock && inp.hit('interact')) { inp.consume('interact'); this.disembark(this.focusDock); return; }
      if (inp.hit('braid')) { inp.consume('braid'); g.toggleBraid?.(); }
      if (inp.hit('hair')) {
        inp.consume('hair');
        if (p.braided) g.ui.notify('Desfaça a trança para usar a magia do cabelo');
        else if (this.focusTarget) p.startReach(this.focusTarget);
        else p.flickHair?.();
      }
    }
    // Brilho recarrega como em terra
    if (!p.lume && !p.channeling) s.brilho = Math.min(100, s.brilho + (this.night > 0.5 ? 2 : 9) * dt);
    g.ui.setBrilho(s.brilho, s.brilho < 20);
    // salvar no meio do lago guarda o último cais (nunca no meio da água)
    const ld = this.dock(b.last) || DOCKS[0];
    this.safePos = { x: ld.land, y: G, facing: 1 };
    for (const cr of this.critters) cr.update(dt, this);
    const z = this.zones.find((zz) => zz.test(p));
    if (z && z.name !== this.zoneName) { this.zoneName = z.name; g.ui.toast(z.name, this.name); }
    // câmera acompanha o barco, olhando um pouco para a frente
    g.camera.update(dt, { x: b.x + (this.cutscene ? 0 : clamp(b.v, -260, 260) * 0.55), y: WL - 115, facing: b.dir });
    this.fx.update(dt);
    this.updateMotes(dt);
    this.updateExtra(dt);
    g.touch?.setBoat?.(true);
  }

  hairTarget() {
    const b = this.boat;
    if (!this.getS('troncos', false) && Math.abs(b.x - KNOT.x) < 300) return { x: KNOT.x, y: KNOT.y, label: LG.troncosAlcance, onPull: () => this.untie() };
    return null;
  }

  updateExtra(dt) {
    const g = this.game, p = this.player, b = this.boat, s = g.state, t = this.t;
    if (!b.on) g.touch?.setBoat?.(false);
    // folhas de nenúfar boiando
    this.pads.forEach((pd, i) => { pd.y = pd.baseY + Math.sin(t * 1.8 + i * 1.3) * 3; });
    this.logK = this.getS('troncos', false) ? Math.min(1, this.logK + dt * 0.5) : 0;
    if (this.getS('gruta', false)) this.grotK = Math.min(1, this.grotK + dt * 0.8);
    this.night += clamp(this.nightTo - this.night, -dt * 0.3, dt * 0.3);
    this.darkAmt = this.night * 0.5;
    this.sky.update(dt);
    // rastro do barco
    this.wakeT += dt;
    if (Math.abs(b.v) > 30 && this.wakeT > 0.09) {
      this.wakeT = 0;
      this.wake.push({ x: b.x - b.face * 68, r: 6, a: Math.min(0.7, Math.abs(b.v) / 300) });
      if (!g.lowFx) this.fx.emit({ x: b.x - b.face * 70, y: WL - 2, vx: -b.v * 0.2 + (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 40, g: 300, size: 1.6, life: 0.5, color: '#e8f6ff' });
    }
    for (const w of this.wake) { w.r += dt * 46; w.a -= dt * 0.55; }
    this.wake = this.wake.filter((w) => w.a > 0);
    // lanternas d'água: acendem quando o barco passa por elas
    if (b.on) LANTS.forEach((x, i) => {
      if (this.getS('lant' + i, false) || Math.abs(b.x - x) > 55) return;
      this.setS('lant' + i, true);
      this.sparkle(x, WL - 14, 18); g.audio?.sfx('sino');
      const n = this.lit();
      g.ui.notify(LG.lanternaAcesa(n), 2.6);
      const q = Quests.get(g, 'lanternas');
      if (q && !q.done && q.step === 0) Quests.count(g, 'lanternas');
    });
    // a cascata: o Lume de perto abre a cortina de água
    if (!this.getS('gruta', false)) {
      const near = Math.abs((b.on ? b.x : p.cx) - 5500) < 170;
      if (near && !this.grotHint && !this.cutscene && !g.ui.dialogOpen) { this.grotHint = true; this.caioSay(LG.cascataEco); g.ui.notify(LG.cascataEco + ' ' + g.ui.fmt('Use o Lume ({F}).'), 3.5); }
      this.grotLume = near && p.lume ? (this.grotLume || 0) + dt : 0;
      if (this.grotLume > 0.8) this.revealGrotto();
    }
    // a Ilha do Reflexo aparece no objetivo
    const q = Quests.get(g, 'lago');
    // a missão pode ter começado com a Lira já no barco (aviso de chegada atrasado): conta o embarque mesmo assim
    if (q && !q.done && q.step === 0 && b.on) Quests.step(g, 'lago', 1);
    if (q && !q.done && q.step === 1 && b.on && b.x > 5900) Quests.step(g, 'lago', 2);
    // caiu na água (fora do barco): volta para o último lugar de desembarque
    if (!b.on && !(this.respawnT > 0) && p.feet > WL + 6) {
      this.respawnT = 0.9; this.respawned = false;
      for (let i = 0; i < 16; i++) this.fx.emit({ x: p.cx, y: WL, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 220, g: 500, size: 2, life: 0.7, color: '#d6f0ff' });
    }
    if (this.respawnT > 0) {
      this.respawnT -= dt;
      if (this.respawnT <= 0.45 && !this.respawned) {
        this.respawned = true;
        const d = this.landDock || this.nearestLand(p.cx);
        p.x = d.land - p.w / 2; p.y = G - p.h; p.vx = p.vy = 0; p.lasso = p.swing = p.ladder = null; p.anim.set('idle');
        p.hair.reset(p.cx, p.feet - 54, p.facing);
        this.camY = p.cy - 30; g.camera.snap(p.cx, this.camY);
      }
    }
    if (this.caioBubble) { this.caioBubble.t -= dt; if (this.caioBubble.t <= 0) this.caioBubble = null; }
    // luzes no escuro (noite): lanternas d'água acesas e a lanterna do barco
    this.darkLights = this.night > 0.02 ? [
      ...LANTS.filter((x, i) => this.getS('lant' + i, false)).map((x) => ({ x, y: WL - 12, r: 90 })),
      ...(this.lifted ? [] : DECOR.map((x) => ({ x, y: WL - 10, r: 70, a: 0.6 }))),
      { x: b.x + b.face * 70, y: this.wave(b.x) - 60, r: 120 },
    ] : null;
  }
  nearestLand(x) {
    let best = DOCKS[0];
    for (const d of DOCKS) if ((!d.secret || this.getS('gruta', false)) && Math.abs(d.land - x) < Math.abs(best.land - x)) best = d;
    return best;
  }
  caioSay(text, secs = 3.2) { this.caioBubble = { text, t: secs }; }

  // ---------- mecânicas ----------
  untie() {
    const g = this.game;
    if (this.getS('troncos', false)) return;
    this.setS('troncos', true);
    g.camera.shake(2, 0.5); g.audio?.sfx('magia');
    this.sparkle(KNOT.x, KNOT.y, 16);
    this.say(LG.troncosSoltos);
  }
  revealGrotto() {
    const g = this.game;
    this.setS('gruta', true);
    g.audio?.sfx('magia'); this.sparkle(5500, 820, 30);
    this.player.setExpr('surpresa', 3);
    this.say(LG.cascataAbre);
  }
  openChest(id, txt, empty, extra) {
    const g = this.game;
    if (this.getS(id, false)) { this.say(empty); return; }
    this.setS(id, true);
    g.audio?.sfx('pega'); this.sparkle(this.player.cx, this.player.y + 10, 16);
    this.player.setExpr('surpresa', 2);
    extra?.();
    this.say(txt);
  }
  lookOut() {
    const g = this.game, s = g.state;
    if (s.flag('lago-luneta')) { this.say(LG.lunetaDepois); return; }
    s.set('lago-luneta');
    this.cutscene = new Cutscene(this, [
      { say: LG.lunetaTxt1 },
      { cam: { x: 4300, y: 760, zoom: 0.62, rate: 0.6 } }, { wait: 1.6 },
      { cam: { x: 6700, y: 800, zoom: 0.95, rate: 0.5 } }, { wait: 2.4 },
      { say: LG.lunetaTxt2 },
      { cam: { x: 5500, y: 800, zoom: 1.1, rate: 0.6 } }, { wait: 1.6 },
      { say: LG.lunetaTxt3 },
      { cam: { x: null } },
    ]);
  }
  readStone() {
    const g = this.game, s = g.state, p = this.player;
    if (s.flag('duas-chamas')) { this.say(LG.pedraDepois); return; }
    this.cutscene = new Cutscene(this, [
      { cam: { x: STONE.x - 40, y: G - 90, zoom: 1.35, rate: 1 } },
      { do: () => { this.stoneK = 0.001; g.audio?.sfx('sino'); p.setExpr('surpresa', 4); } },
      { wait: 1 },
      { say: LG.pedraTxt.slice(0, 2) },
      { do: () => p.setExpr('pensativa', 8) },
      { say: LG.pedraTxt.slice(2) },
      { cam: { x: null } },
    ], () => {
      s.set('duas-chamas');
      const q = Quests.get(g, 'lago') || Quests.start(g, 'lago', { silent: true });
      if (!q.done && q.step < 3) Quests.step(g, 'lago', 3);
    });
  }

  // ---------- a noite das lanternas d'água ----------
  nightScene() {
    const g = this.game, s = g.state, p = this.player, b = this.boat;
    const bx = () => b.x;
    this.caioPose = 'rema';
    this.cutscene = new Cutscene(this, [
      { do: () => { this.nightTo = 1; g.audio?.music('lanternas'); } },
      { cam: { x: bx() - 220, y: WL - 170, zoom: 0.85, rate: 0.5 } }, { wait: 2.2 },
      { say: LG.noite1 },
      { do: () => { this.caioPose = 'olha'; } },
      { cam: { x: bx(), y: WL - 110, zoom: 1.2, rate: 0.7 } },
      { say: LG.noite2 },
      { do: () => { this.holdPose = true; p.boostGlow(2.2); p.setExpr('surpresa', 3); this.ring = 0.001; g.audio?.sfx('magia'); } },
      { say: LG.noite3 },
      { do: () => this.liftLanterns() },
      { cam: { x: bx() + 80, y: WL - 330, zoom: 0.78, rate: 0.35 } }, { wait: 3.2 },
      { say: LG.noite4 },
      { do: () => { this.holdPose = false; p.setExpr('feliz', 10); } },

    // montanhas e o castelo ao longe, apoiados na linha do horizonte (a água)
    const hz = cam.toScreen(0, WL).y;

    return null;

  drawStaticLayer(ctx) {

    // margem do cais, árvores e o caminho de volta

    // cais de madeira

      g.fillStyle = '#6e6480'; g.beginPath(); g.moveTo(2630, H); g.lineTo(2630, 640); g.quadraticCurveTo(2650, 616, 2700, 618); g.lineTo(2800, 618); g.quadraticCurveTo(2830, 630, 2830, 660); g.lineTo(2830, H); g.fill();
      g.fillStyle = '#5a5268'; for (let i = 0; i < 9; i++) g.fillRect(2650 + (i * 37) % 160, 660 + i * 34, 30, 8);
