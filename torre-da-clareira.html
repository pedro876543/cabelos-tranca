  drawBack(ctx) {
    const cam = this.game.camera, t = this.t, n = this.night, b = this.boat;
    const L = cam.left - 20, R = cam.right + 20;
    // corpo da água (cobre a parte submersa das ilhas)
    const wg = ctx.createLinearGradient(0, WL, 0, WL + 340);
    wg.addColorStop(0, mix('#8a9ac8', '#1e2248', n)); wg.addColorStop(1, mix('#3a4a7a', '#0a0c22', n));
    ctx.globalAlpha = 0.86; ctx.fillStyle = wg; ctx.fillRect(L, WL, R - L, H - WL); ctx.globalAlpha = 1;
    // reflexo do cenário (ilhas, árvores, rochedo)
    ctx.save();
    ctx.beginPath(); ctx.rect(L, WL + 2, R - L, 420); ctx.clip();
    ctx.translate(0, WL * 2 + 4); ctx.scale(1, -1);
    ctx.globalAlpha = 0.24 + n * 0.06;
    for (const ch of this.chunks) if (!(ch.x > R || ch.x + CHUNK < L)) ctx.drawImage(ch.c, ch.x, CY, CHUNK, this.height - CY);
    ctx.restore();
    // brilho do sol (ou da lua) na água
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const y = WL + 8 + i * 9, w = 120 - i * 6 + Math.sin(t * 2 + i) * 10, x = cam.x + 140 - i * 2 + Math.sin(t * 1.3 + i * 2) * 8;
      ctx.fillStyle = n > 0.5 ? `rgba(220,230,255,${0.1 - i * 0.006})` : `rgba(255,220,150,${0.22 - i * 0.014})`;
      ctx.fillRect(x - w / 2, y, w, 2);
    }
    ctx.restore();
    // troncos amarrados (ou se afastando)
    this.drawLogs(ctx);
    // folhas de nenúfar
    for (const pd of this.pads) {
      if (pd.x > R || pd.x + pd.w < L) continue;
      ctx.fillStyle = '#4a8a4a'; ctx.beginPath(); ctx.ellipse(pd.x + pd.w / 2, pd.y + 4, pd.w / 2 + 4, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6aaa5a'; ctx.beginPath(); ctx.ellipse(pd.x + pd.w / 2, pd.y + 2, pd.w / 2, 6, 0, 0.3, Math.PI * 2 - 0.3); ctx.fill();
      ctx.fillStyle = '#f2a6c8'; ctx.beginPath(); ctx.arc(pd.x + pd.w * 0.7, pd.y - 1, 3, 0, Math.PI * 2); ctx.fill();
    }
    // cascata (abre com o Lume)
    this.drawFalls(ctx);
    // anel de luz da cena noturna
    if (this.ring > 0) {
      this.ring += 0.016 * 1.2;
      const r = this.ring * 900, a = Math.max(0, 0.6 - this.ring * 0.35);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,214,130,${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(b.x, WL + 4, r, r * 0.08, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      if (this.ring > 1.8) this.ring = 0;
    }
    // lanternas d'água: as de enfeite e as perdidas (apagadas até o barco passar)
    if (!this.lifted) for (const x of DECOR) this.drawWaterLantern(ctx, x, true, 0.8);
    LANTS.forEach((x, i) => this.drawWaterLantern(ctx, x, this.getS('lant' + i, false), 1));
    // rastro
    ctx.save(); ctx.strokeStyle = 'rgba(235,246,255,0.7)'; ctx.lineWidth = 1.4;
    for (const w of this.wake) { ctx.globalAlpha = w.a; ctx.beginPath(); ctx.ellipse(w.x, WL + 3, w.r, w.r * 0.12, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
    // pedra das duas chamas (brilha quando lida)
    if (STONE.x + 60 > L && STONE.x - 60 < R) {
      ctx.fillStyle = '#9a90a8'; roundRect(ctx, STONE.x - 24, G - 128, 48, 128, 10); ctx.fill();
      ctx.fillStyle = '#7a7088'; for (let i = 0; i < 5; i++) ctx.fillRect(STONE.x - 14, G - 108 + i * 16, 28, 3);
      const lit = this.game.state.flag('duas-chamas') ? 1 : (this.stoneK || 0);
      if (this.stoneK > 0 && this.stoneK < 1) this.stoneK = Math.min(1, this.stoneK + 0.02);
      if (lit > 0) {
        P.sunSymbol(ctx, STONE.x - 8, G - 100, 8, '#ffe9a8', lit); P.sunSymbol(ctx, STONE.x + 10, G - 86, 6, '#ffe9a8', lit);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 * lit; ctx.drawImage(halo('ouro'), STONE.x - 80, G - 160, 160, 160); ctx.restore();
      }
    }
    this.drawBoat(ctx);
  }

  drawWaterLantern(ctx, x, lit, s = 1) {
    const cam = this.game.camera;
    if (x < cam.left - 40 || x > cam.right + 40) return;
    const y = this.wave(x) - 4, t = this.t;
    ctx.fillStyle = '#7a5a3a'; ctx.beginPath(); ctx.ellipse(x, y + 2, 12 * s, 3.5 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lit ? '#ffd27a' : '#b8a888';
    ctx.beginPath(); ctx.moveTo(x - 6 * s, y); ctx.lineTo(x + 6 * s, y); ctx.lineTo(x + 5 * s, y - 13 * s); ctx.lineTo(x - 5 * s, y - 13 * s); ctx.fill();
    if (lit) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const a = 0.65 + Math.sin(t * 5 + x) * 0.1;
      ctx.globalAlpha = a; ctx.drawImage(halo('ouro'), x - 30 * s, y - 36 * s, 60 * s, 60 * s);
      ctx.globalAlpha = 0.35 * a; ctx.fillStyle = '#ffd27a';
      for (let k = 0; k < 4; k++) ctx.fillRect(x - 6 + Math.sin(t * 3 + k) * 2, y + 6 + k * 5, 12 - k * 2, 2);

  drawLogs(ctx) {
    const cam = this.game.camera, k = this.logK, t = this.t;
    if (3500 < cam.left || 3100 > cam.right) return;
    const off = k * 140;
    for (let i = 0; i < 4; i++) {
      const side = i % 2 ? 1 : -1, x = 3300 + side * off * (0.6 + i * 0.2), y = this.wave(x) - 6 + i * 2 + Math.sin(t * 1.5 + i) * 1.5;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2 * (1 - k * 0.85) + side * 0.05);
      ctx.fillStyle = '#6a4a30'; roundRect(ctx, -60, -7, 120, 14, 7); ctx.fill();
      ctx.fillStyle = '#8a6a4a'; ctx.beginPath(); ctx.ellipse(60, 0, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (k < 1) { ctx.strokeStyle = '#c8a878'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(KNOT.x, KNOT.y); ctx.quadraticCurveTo(3290, WL - 30, 3300, WL - 8); ctx.stroke(); }
    ctx.fillStyle = k < 1 ? '#c8a878' : '#8a6a4a'; ctx.beginPath(); ctx.arc(KNOT.x, KNOT.y, 5, 0, Math.PI * 2); ctx.fill();
  }

  drawFalls(ctx) {
    const cam = this.game.camera, t = this.t, k = this.grotK;
    if (5700 < cam.left || 5300 > cam.right) return;
    const x0 = GROTTO.x0 - 10, x1 = GROTTO.x1 + 10, w = x1 - x0, top = 660;
    const open = k * w * 0.42;
    ctx.save();
    for (const [a, bb] of [[x0, x0 + w / 2 - open], [x0 + w / 2 + open, x1]]) {
      if (bb - a < 2) continue;
      const gr = ctx.createLinearGradient(0, top, 0, WL);
      gr.addColorStop(0, 'rgba(200,225,255,0.85)'); gr.addColorStop(1, 'rgba(170,200,240,0.7)');
      ctx.fillStyle = gr; ctx.fillRect(a, top, bb - a, WL - top);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
      for (let x = a + 6; x < bb - 2; x += 11) { const ph = (t * 260 + x * 7) % 60; ctx.beginPath(); ctx.moveTo(x, top + ph); ctx.lineTo(x, top + ph + 26); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 4, top + ph + 120); ctx.lineTo(x + 4, top + ph + 150); ctx.stroke(); }
    }
    // espuma no pé da cascata
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 12; i++) { const x = x0 + (i / 12) * w, y = WL - 2 + Math.sin(t * 6 + i) * 2; ctx.beginPath(); ctx.arc(x, y, 5 + Math.sin(t * 4 + i * 2) * 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  drawBoat(ctx) {
    const b = this.boat, t = this.t, by = this.wave(b.x) - 10;
    const tilt = Math.atan2(this.wave(b.x + 40) - this.wave(b.x - 40), 80) - b.v * 0.00025;
    const f = b.face, row = b.row;
    // Caio sentado na popa, remando (ou olhando para o céu na cena da noite)
    const cx = b.x - f * 42;
    const caio = { x: cx, y: by + 22, dir: Math.sign(f) || 1, scale: 1, moving: false, walkPh: 0, kind: 'pessoa', look: { skin: '#e0ae86', hair: '#5a3a22', top: '#8a6a4a', bottom: '#4a3a2e', belt: '#3a2a22', cape: '#3f7a4a', hat: 'capuz', hatColor: '#3f7a4a' } };
    drawPerson(ctx, caio, t);
    // remo
    const pose = this.caioPose || 'rema';
    const rowing = b.on && Math.abs(b.v) > 10 && pose === 'rema';
    const ang = rowing ? Math.sin(row) * 0.5 : 0.15;
    ctx.save(); ctx.translate(cx + f * 6, by - 18); ctx.scale(Math.sign(f) || 1, 1);
    ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';

      { cam: { x: p.cx + side * 8, y: p.feet - 40, zoom: 1.8, rate: 1.2 } },
      { wait: 1.6 },
      { say: lines },
      { do: () => { n.hug = false; p.pose = null; n.route = route; n.ri = ri || 0; n.wait = 2; } },
      { cam: { x: null } },
    ]);
  },
  // o retrato: os três posam juntos e o quadro aparece sendo pintado
  portraitScene(a, g) {
    const p = a.player, R = EP.retrato, rainha = this.npc(a, 'rainha'), rei = this.npc(a, 'rei');
    if (a.cutscene) return;
    const saved = [[rainha, rainha.route, rainha.x], [rei, rei.route, rei.x]];
    a.cutscene = new Cutscene(a, [
      { do: () => { for (const [n] of saved) { n.route = null; n.moving = false; } rei.x = p.cx - 28; rainha.x = p.cx + 28; rei.dir = 1; rainha.dir = 1; p.facing = 1; p.vx = 0; p.setExpr('feliz', 30); } },
      { cam: { x: p.cx + 40, y: p.feet - 50, zoom: 1.7, rate: 1 } },
      { say: R.pose },
      { do: () => { a.portraitK = 0.001; g.audio?.music('reencontro'); } },
      { until: (t) => { a.portraitK = Math.min(1, t / 3.2); return t > 3.6; } },
      { say: R.pinta },
      { say: R.pronto },
      { do: () => { a.portraitK = 0; Quests.complete(g, 'retrato'); this.hugHearts(a, p.cx, p.feet - 50, 14); g.audio?.sfx('sino'); g.save?.(); } },
      { cam: { x: 3560, y: 1200 - 180, zoom: 1.4, rate: 0.8 } },
      { wait: 1.6 },
      { do: () => { for (const [n, r, x] of saved) { n.route = r; n.ri = 0; n.wait = 2; } g.audio?.music('castelo'); } },
      { cam: { x: null } },
    ], () => { a.portraitK = 0; });
    // o quadro sendo pintado, por cima da cena
    if (!a._portraitHook) {
      a._portraitHook = true;
      (a.extraFront ||= []).push((ctx) => {
        const k = a.portraitK || 0;
        if (k <= 0) return;
        const cam = g.camera, x = p.cx + 70, y = p.feet - 110;
        ctx.fillStyle = '#6e4a32'; ctx.fillRect(x + 4, y + 50, 3, 60); ctx.fillRect(x + 40, y + 50, 3, 60); ctx.fillRect(x + 22, y + 56, 3, 54);
        drawPortrait(ctx, x - 4, y, 54, 44, k);
      });
    }
  },
  in_festival(a, g) { this.recado(a, g, 'recado-benta', EP.recadoBenta); },
  in_torre(a, g) {
    this.recado(a, g, 'recado-ismena', EP.recadoIsmena);
    // a Ismena lembra das centelhas
    const n = this.npc(a, 'ismena');
    this.wrap(n, () => {
      const q = Quests.get(g, 'centelhas');
      if (!q || q.done) return undefined;
      return q.step === 1 ? EP.centelhasTodas : EP.centelhasFalta(q.n);
    });
  },
  in_floresta(a, g) {
    const s = g.state;
    const j = a.objects.find((o) => o.id === 'jardim');
    if (j) {
      const orig = j.use;
      j.use = (ar, o) => {
        const qr = Quests.get(g, 'retrato');
        if (qr && !qr.done && qr.step === 1) { a.say(EP.retrato.florPega, () => { a.sparkle(645, 1130, 14); g.audio?.sfx('pega'); Quests.step(g, 'retrato', 2); }); return; }
        const q = Quests.get(g, 'centelhas');
        if (q && !q.done && q.step === 1) { a.say(EP.jardimEntrega, () => { Quests.complete(g, 'centelhas'); a.sparkle(645, 1150, 30); g.audio?.sfx('sino'); }); return; }
        if (q?.done) { a.say(EP.jardimDepois); return; }
        orig?.(ar, o);
      };
    }
    // o jardim de luz: as oito centelhas girando sobre as flores
    (a.extraFront ||= []).push((ctx) => {
      if (!s.quests.centelhas?.done) return;
      const cam = g.camera, t = a.t, cx = 645, cy = 1130;
      if (cx + 200 < cam.left || cx - 200 > cam.right) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 8; i++) {
        const an = t * 0.6 + (i / 8) * Math.PI * 2;
        const x = cx + Math.cos(an) * 110, y = cy - 20 + Math.sin(an * 2) * 18 - Math.sin(t + i) * 6;
        const gr = ctx.createRadialGradient(x, y, 0, x, y, 16);
        gr.addColorStop(0, 'rgba(255,240,180,0.9)'); gr.addColorStop(1, 'rgba(255,220,130,0)');
        ctx.fillStyle = gr; ctx.fillRect(x - 16, y - 16, 32, 32);
      }
      ctx.restore();
    });
  },

  // ---------- Santuário: descer para o epílogo e o desafio do Mirante ----------
  in_santuario(a, g) {
    const s = g.state;
    if (!this.final(g)) return;
    const desc = a.objects.find((o) => o.id === 'descer');
    if (desc) {
      const orig = desc.use;
      Object.defineProperty(desc, 'label', { get: () => (this.free(g) ? EP.descerFloresta : EP.descerEpilogo), configurable: true });
      desc.use = (...args) => {
        if (this.free(g)) { orig(...args); return; }
        g.scenes.go('reino', { pos: { x: 1500, y: 1200, facing: 1 } });
      };
    }
    // degraus dourados até o Mirante
    for (const [x, y, w] of STEPS) a.oneWay(x, y, w);
    a.petal(6, TOP[0] + TOP[2] - 40, TOP[1] - 34);
    a.object({
      id: 'pedra-mirante', x: 6170, y: 1000 - 56, w: 60, h: 56, label: EP.pedra,
      use: () => this.pedra(a, g),
    });
    a.object({
      id: 'placa-mirante', x: TOP[0] + 40, y: TOP[1] - 60, w: 60, h: 60, label: EP.mirantePlaca,
      zone: { x0: TOP[0], x1: TOP[0] + TOP[2], y0: TOP[1] - 8, y1: TOP[1] + 6 },
      use: () => a.say(EP.mirante),
    });
    (a.extraBack ||= []).push((ctx) => this.drawMirante(ctx, a));
  },
  pedra(a, g) {
    if (this.race) return;
    if (!Quests.get(g, 'mirante')) Quests.start(g, 'mirante');
    const lines = Quests.done(g, 'mirante') ? EP.desafioDepois : EP.pedraTxt;
    a.say(lines, () => {
      g.ui.ask({ who: null, text: EP.pedraPergunta }, EP.pedraOpcoes, (i) => {
        if (i === 0) { this.race = { t: RACE_T, area: a }; g.ui.notify(EP.desafioVai, 2); g.audio?.sfx('sino'); }
      });
    });
  },
  tickMirante(a, g, dt) {
    const p = a.player, s = g.state;
    if (!this.final(g)) return;
    const onTop = p.onGround && Math.abs(p.feet - TOP[1]) < 4 && p.cx > TOP[0] && p.cx < TOP[0] + TOP[2];
    if (onTop && !s.flag('mirante-visto')) { s.set('mirante-visto'); if (!this.race) a.say(EP.mirante); }
    const r = this.race;
    if (!r) return;
    if (r.area !== a) { this.race = null; g.ui.setCaption(null); return; }
    if (g.ui.dialogOpen || a.cutscene) return;
    r.t -= dt;
    g.ui.setCaption(EP.desafioTempo(Math.max(0, Math.ceil(r.t))));
    if (onTop) {
      this.race = null; g.ui.setCaption(null);
      a.sparkle(p.cx, p.y, 30); g.audio?.sfx('sino');
      const first = !s.flag('coroa-luz');
      s.set('coroa-luz');
      if (first) (a.extraFront ||= []).push((ctx) => this.drawCrown(ctx, a));
      a.say([...EP.desafioVenceu, ...EP.mirante], () => { if (!Quests.done(g, 'mirante')) Quests.complete(g, 'mirante'); });
    } else if (r.t <= 0) {
      this.race = null; g.ui.setCaption(null);
      g.ui.notify(EP.desafioFalhou, 3.5); g.audio?.sfx('erro');
    }
  },
  drawMirante(ctx, a) {
    const cam = a.game.camera, t = a.t;
    if (6800 < cam.left || 6100 > cam.right) return;
    // a pedra do desafio
    const px = 6200, G = 1000;
    ctx.fillStyle = '#7a6a5a'; roundRect(ctx, px - 28, G - 52, 56, 52, 8); ctx.fill();
    P.sunSymbol(ctx, px, G - 28, 12, this.race ? '#ffe9a8' : '#c9a27a');
    // degraus dourados
    STEPS.forEach(([x, y, w], i) => {
      const bob = Math.sin(t * 1.4 + i) * 1.5;
      ctx.fillStyle = '#b8903a'; roundRect(ctx, x, y + bob, w, 12, 5); ctx.fill();
      ctx.fillStyle = '#f2c14e'; roundRect(ctx, x + 2, y + bob, w - 4, 5, 3); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(x + w / 2, y + 6, 0, x + w / 2, y + 6, w * 0.7);
      gr.addColorStop(0, 'rgba(255,220,130,0.25)'); gr.addColorStop(1, 'rgba(255,220,130,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - w * 0.2, y - w * 0.5, w * 1.4, w); ctx.restore();
    });
    // o mirante: parapeito e placa
    const [mx, my, mw] = TOP;
    ctx.fillStyle = '#d9c7a0'; ctx.fillRect(mx + 6, my - 26, 4, 26); ctx.fillRect(mx + mw - 10, my - 26, 4, 26);
    ctx.fillRect(mx + 6, my - 28, mw - 12, 4);
    ctx.fillStyle = '#c9a27a'; roundRect(ctx, mx + 46, my - 56, 48, 22, 4); ctx.fill();
    P.sunSymbol(ctx, mx + 70, my - 45, 7, '#fff4c8');
  },

  // ---------- Epílogo ----------
  startEpilogue(a, g) {
    const p = a.player, s = g.state, cam = g.camera, N = a.epNpc;
    if (!N) return;
    const crowd = { odila: 1990, tito: 2420, graca: 2490, tercia: 2560 };
    const saved = {};
    const moveTo = (n, x) => { if (!n) return; n.route = [{ x, wait: 9999 }]; n.ri = 0; n.wait = 0; };
    a.epRun = true;
    s.set('epilogo-iniciado');
    // a Lira e o Caio chegam pela rua de baixo
    p.x = 1500 - p.w / 2; p.vx = 0; p.facing = 1;
    N.caio.x = 1440;
    cam.snap?.(1700, 1100);
    g.audio?.music('luz');
    const steps = [
      { do: () => { for (const id of Object.keys(crowd)) { const n = this.npc(a, id); if (n) { saved[id] = { x: n.x, route: n.route }; n.x = crowd[id]; moveTo(n, crowd[id]); } } moveTo(N.caio, 2090); } },
      { cam: { x: 1900, y: 1090, zoom: 1.1, rate: 1.2 } },
      { say: EP.chegada },
      { walk: 2160 },
      { cam: { x: 2280, y: 1090, zoom: 1.2, rate: 1 } },
      { do: () => { p.setExpr('feliz', 6); a.sparkle(2420, 1060, 20); } },
      { say: EP.moradores },
      { say: EP.odila },
      ...this.reunionSteps(a, g, N, moveTo),
      { do: () => { moveTo(N.ismena, 2040); } },
      { cam: { x: 2120, y: 1080, zoom: 1.2, rate: 0.8 } },
      { until: (t) => Math.abs(N.ismena.x - 2040) < 3 || t > 6 },
      { say: EP.ismena },
      { do: () => { N.bastiao.x = 2700; moveTo(N.bastiao, 2380); } },
      { until: (t) => Math.abs(N.bastiao.x - 2380) < 3 || t > 5 },
      { say: EP.aldo },
      { say: EP.caio },
      { say: EP.liberdade },
      { do: () => { p.setExpr('pensativa', 4); g.audio?.music('luz'); } },
      { cam: { x: 2250, y: 1020, zoom: 1, rate: 0.6 } },
      { say: EP.conclusao },
      { do: () => { p.setExpr('feliz', 4); this.rollCredits(g); } },
      { until: () => !g.credits },
    ];
    a.cutscene = new Cutscene(a, steps, () => {
      a.epRun = false;
      for (const [id, v] of Object.entries(saved)) { const n = this.npc(a, id); if (n) { n.x = v.x; n.route = v.route; n.ri = 0; n.wait = 0; } }
      this.finishEpilogue(g);
    });
  },
  // O reencontro: os pais chegam, reconhecem a filha pelo cabelo curto e pela canção do berçário, e os três se abraçam.
  reunionSteps(a, g, N, moveTo) {
    const p = a.player;
    const QX = 2250, KX = 2320, LX = 2160;
    return [
      { do: () => { N.rainha.ignore = N.rei.ignore = true; moveTo(N.rainha, QX); moveTo(N.rei, KX); g.audio?.music('ninar'); } },
      { cam: { x: 2240, y: 1080, zoom: 1.3, rate: 0.8 } },
      { until: (t) => (Math.abs(N.rainha.x - QX) < 3 && Math.abs(N.rei.x - KX) < 3) || t > 6 },
      { face: 1 },
      { say: EP.reis },
      // reconhecimento: a câmera chega perto do rosto da Lira e da Rainha
      { do: () => { p.setExpr('surpresa', 3); N.rainha.armPose = 1.2; } },
      { cam: { x: (LX + QX) / 2 + 10, y: 1150, zoom: 1.9, rate: 0.9 } },
      { say: EP.reconhece.slice(0, 3) },
      { do: () => { p.setExpr('pensativa', 6); N.rainha.armPose = null; } },
      { say: EP.reconhece.slice(3) },
      { do: () => { g.audio?.music('reencontro'); p.setExpr('feliz', 10); a.sparkle(QX, 1130, 10); } },
      { say: EP.cancao },
      { say: EP.corre },
      // a Lira corre até a mãe; o pai chega por trás e abraça as duas
      { walk: QX - 16, run: true },
      { face: 1 },
      { do: () => {
        p.vx = 0; p.pose = 'abraco'; p.setExpr('feliz', 30);
        N.rainha.dir = -1; N.rainha.hug = true;
        N.rei.route = [{ x: QX + 14, wait: 9999 }]; N.rei.ri = 0; N.rei.wait = 0; N.rei.dir = -1;
        g.audio?.sfx('abraco'); g.camera.shake(0.6, 0.3);
        this.hugHearts(a, QX - 4, 1140, 14);
      } },
      { until: (t) => Math.abs(N.rei.x - (QX + 14)) < 3 || t > 2 },
      { do: () => { N.rei.hug = true; N.rei.dir = -1; this.hugHearts(a, QX + 6, 1130, 10); } },
      { cam: { x: QX, y: 1150, zoom: 2.1, rate: 0.7 } },
      { wait: 2.2 },
      { say: EP.abraco.slice(0, 3) },
      { do: () => this.hugHearts(a, QX, 1130, 8) },
      { say: EP.abraco.slice(3) },
      { do: () => { p.pose = null; N.rainha.hug = false; N.rei.hug = false; N.rainha.ignore = N.rei.ignore = false; p.facing = -1; } },
      { cam: { x: 2200, y: 1090, zoom: 1.2, rate: 0.8 } },
    ];
  },
  hugHearts(a, x, y, n) {
    a.sparkle(x, y, n);
    for (let i = 0; i < n; i++) a.fx?.emit({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, g: -12, size: 1.6 + Math.random() * 1.8, life: 1.2 + Math.random() * 0.6, color: Math.random() < 0.5 ? '#ffb7c9' : '#ffe9a8', star: Math.random() < 0.5 });
  },
  // Rever cenas: o reencontro roda de novo na praça e a Lira volta para onde estava
  replayReunion(a, g) {
    const N = a.epNpc, p = a.player;
    if (!N) { g.endReplay?.(); return; }
    const moveTo = (n, x) => { if (!n) return; n.route = [{ x, wait: 9999 }]; n.ri = 0; n.wait = 0; };
    a.epRun = true;
    N.rainha.x = 2780; N.rei.x = 2850; N.rainha.hug = N.rei.hug = false;
    p.x = 2160 - p.w / 2; p.vx = 0; p.facing = 1;
    g.camera.snap?.(2200, 1100);
    a.cutscene = new Cutscene(a, [
      { cam: { x: 2240, y: 1080, zoom: 1.2, rate: 1 } },
      ...this.reunionSteps(a, g, N, moveTo),
      { wait: 0.6 },
    ], () => { a.epRun = false; p.pose = null; g.endReplay?.(); });
  },
  finishEpilogue(g) {
    const s = g.state;
    if (s.flag('epilogo')) return;
    s.set('epilogo');
    if (!s.quests.centelhas) {
      const tracked = s.tracked;
      Quests.start(g, 'centelhas', { silent: true });
      const q = s.quests.centelhas; q.n = this.found(g);
      if (q.n >= 8) Quests.step(g, 'centelhas', 1);
      if (tracked && s.quests[tracked] && !s.quests[tracked].done) s.tracked = tracked;
      Quests.refresh(g);
    }
    const announce = () => { g.ui.toast(EP.livre, EP.livreSub); setTimeout(() => g.ui.notify(EP.livreDica, 6), 3400); };
    if (g.credits) g.credits.after = announce; else announce();
    g.save?.();
  },

  // ---------- Créditos (rolam sobre o jogo; dá para pular) ----------
  creditsHtml(list = EP.creditos) {
    return list.map(([k, t]) => (k === 'h' ? `<h2>${t}</h2>` : k === 'g' ? `<h4>${t}</h4>` : `<p>${t}</p>`)).join('');
  },
  rollCredits(g, onEnd) {
    if (g.credits) return;
    injectCss();
    const frame = document.getElementById('frame');
    const el = document.createElement('div');
    el.className = 'credits-roll';
    el.innerHTML = `<div class="credits-fim">${EP.fim}</div><div class="credits-track">${this.creditsHtml()}</div><button type="button" class="credits-skip">${EP.creditosPular} <span class="skip-key">Esc</span></button>`;
    frame.appendChild(el);
    const close = () => {
      if (!g.credits) return;
      g.credits = null; el.classList.add('out');
      setTimeout(() => el.remove(), 600);
      g.input.down.clear?.(); g.input.vDown?.clear?.();
      onEnd?.();
      c0.after?.();
    };
    el.querySelector('.credits-skip').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); close(); });
    const track = el.querySelector('.credits-track');
    track.addEventListener('animationend', () => setTimeout(close, 800));
    const c0 = { el, close, t: 0 };
    g.credits = c0;
    g.audio?.music('luz');
  },
  // chamado pelo laço principal enquanto os créditos estão na tela
  updateCredits(g, dt) {
    const c = g.credits, inp = g.input;
    if (!c) return;
    c.t += dt;
    if (c.t > 1.2 && (inp.hit('pause') || inp.hit('confirm'))) { inp.consume?.('pause'); c.close(); }
  },

  // ---------- Viagem livre ----------
  travel(g) {
    return REGIOES.filter((r) => r.viagem !== false && this.visited(g, r.id));
  },

  // ---------- Tela de progresso ----------
  stats(g) {
    const s = g.state;
    const regs = REGIOES.map((r) => ({ ...r, on: this.visited(g, r.id) }));
    const main = MAIN.map((id) => ({ id, title: MISSOES[id].title, done: !!s.quests[id]?.done, on: !!s.quests[id] }));
    main.push({ id: 'epilogo', title: 'Epílogo: a volta para Valdouro', done: s.flag('epilogo'), on: s.flag('final-luz') });
    const side = SIDE().map((id) => ({ id, title: MISSOES[id].title, kind: MISSOES[id].kind, done: !!s.quests[id]?.done, on: !!s.quests[id] }));
    const cent = CENTELHAS.map((c) => ({ id: c.id, nome: REGIOES.find((r) => r.id === c.id)?.nome, on: s.flag('centelha-' + c.id) }));
    const diary = g.mysteries?.count(g) || { n: 0, tot: 0 };
    const pet = { n: s.petals.size, tot: s.totalPetals };
    const lant = { n: [0, 1, 2, 3, 4].filter((i) => s.obj['lago:lant' + i]).length, tot: 5 };
    const parts = [
      regs.filter((r) => r.on).length / regs.length,
      main.filter((m) => m.done).length / main.length,
      side.filter((m) => m.done).length / side.length,
      Math.min(1, pet.n / pet.tot),
      cent.filter((c) => c.on).length / cent.length,
      lant.n / lant.tot,
      diary.tot ? diary.n / diary.tot : 0,
    ];
    const pct = Math.floor((parts.reduce((x, y) => x + y, 0) / parts.length) * 100 + 1e-9);
    return { regs, main, side, cent, diary, pet, lant, pct };
  },
  progressHtml(g) {
    const st = this.stats(g);
    const cnt = (arr, f = (x) => x.on) => `${arr.filter(f).length}/${arr.length}`;
    const li = (on, t, extra = '') => `<li class="${on ? 'on' : ''}"><span class="pg-mark">${on ? '✓' : '·'}</span>${t}${extra}</li>`;
    let h = `<div class="progress">
      <div class="pg-top"><div class="pg-pct">${st.pct}%</div><div class="pg-bar"><i style="width:${st.pct}%"></i></div><div class="pg-sub">da aventura concluída${this.free(g) ? ' · exploração livre' : ''}</div></div>
      <div class="pg-grid">
        <div class="pg-card"><b>${cnt(st.regs)}</b><span>Regiões descobertas</span></div>
        <div class="pg-card"><b>${cnt(st.main, (m) => m.done)}</b><span>Missões principais</span></div>
        <div class="pg-card"><b>${cnt(st.side, (m) => m.done)}</b><span>Missões secundárias</span></div>
        <div class="pg-card"><b>${st.pet.n}/${st.pet.tot}</b><span>Pétalas douradas</span></div>
        <div class="pg-card"><b>${cnt(st.cent)}</b><span>Centelhas</span></div>
        <div class="pg-card"><b>${st.diary.n}/${st.diary.tot}</b><span>Páginas do diário</span></div>

// ---------- Tamanho da tela ----------
// No celular o jogo ocupa a tela inteira: a altura lógica fica em 540 e a largura cresce
// com a proporção do aparelho (até 21:9), sem esticar nada. A interface respeita o notch e a Dynamic Island.
// No computador continua o quadro 16:9 com moldura.
function resize() {
  const vv = window.visualViewport;
  const ww = Math.round(vv ? vv.width : window.innerWidth), wh = Math.round(vv ? vv.height : window.innerHeight);
  const full = touchOn;
  document.body.classList.toggle('full', full);
  const cs = getComputedStyle(document.documentElement);
  const sl = parseFloat(cs.getPropertyValue('--sal')) || 0, sr = parseFloat(cs.getPropertyValue('--sar')) || 0;
  const st = parseFloat(cs.getPropertyValue('--sat')) || 0, sb = parseFloat(cs.getPropertyValue('--sab')) || 0;
  let cw, ch, vw;
  if (full) {
    // a imagem vai até as bordas; só a interface desvia das áreas seguras
    const scale = Math.min(ww / 960, wh / VIEW_H);
    vw = Math.max(960, Math.min(1280, Math.round(ww / scale)));
    const s2 = Math.min(ww / vw, wh / VIEW_H);
    cw = Math.round(vw * s2); ch = Math.round(VIEW_H * s2);
    frame.style.setProperty('--u', s2);
    frame.style.setProperty('--boost', s2 < 0.9 ? Math.min(1.45, 0.9 / s2) : 1);
  } else {
    const aw = ww - sl - sr, ah = wh - st - sb;
    const scale = Math.min(aw / VIEW_W, ah / VIEW_H);
    vw = VIEW_W;
    cw = Math.floor(VIEW_W * scale); ch = Math.floor(VIEW_H * scale);
    frame.style.setProperty('--u', scale);
    frame.style.setProperty('--boost', 1);
  }
  game.view.w = vw;
  game.camera.vw = vw;
  game.camera.clamp?.();
  frame.style.width = cw + 'px';
  frame.style.height = ch + 'px';
  const dpr = Math.min({ alta: 2, media: 1.5, baixa: 1 }[game.quality] || 2, window.devicePixelRatio || 1);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  game.pixelScale = (cw * dpr) / vw;
  rotateEl.hidden = !(touchOn && wh > ww * 1.05);
  // o Safari às vezes mostra a página rolada depois de girar o aparelho
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}

// Botões de fechar o painel (X, Voltar, Salvar, Cancelar). No iPhone o Safari às vezes engole o "click"
// logo depois de outro toque no painel; por isso no toque eles respondem direto no fim do toque (touchend),
// e o click fica para mouse e teclado. O preventDefault no touchend impede que o click venha em dobro.
function onPanelTap(el, fn) {
  let t0 = null;
  el.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; t0 = { id: t.identifier, x: t.clientX, y: t.clientY }; }, { passive: true });
  el.addEventListener('touchcancel', () => { t0 = null; });
  el.addEventListener('touchend', (e) => {
    const t = [...e.changedTouches].find((q) => t0 && q.identifier === t0.id);
    const start = t0; t0 = null;
    if (!t || !start) return;
    e.preventDefault();
    const r = el.getBoundingClientRect(), pad = 12;   // o dedo terminou em cima do botão (com uma folga)
    if (Math.hypot(t.clientX - start.x, t.clientY - start.y) > 24) return;
    if (t.clientX < r.left - pad || t.clientX > r.right + pad || t.clientY < r.top - pad || t.clientY > r.bottom + pad) return;
    if (!panel.hidden) fn();
  }, { passive: false });
  el.addEventListener('click', () => fn());
}

const title = document.getElementById('title');

function focusMenu(i) {

  menuBtns.forEach((b, k) => b.classList.toggle('active', k === menuIndex));

    <div class="cfg-seg tut-choose">${btn('computador', 'Tutorial para computador')}${btn('celular', 'Tutorial para celular')}${origin === 'newgame' ? '<button type="button" data-tutmode="pular">Começar a aventura</button>' : ''}</div>`;

function startTutorial(mode, origin) {
  panelBack = null; panel.hidden = true;
  const ret = origin === 'game' && game.area ? { area: game.scenes.currentId, pos: game.area.safePos || { x: game.area.player.cx, y: game.area.player.feet, facing: game.area.player.facing }, braid: game.state.flag('tranca'), brilho: game.state.brilho } : null;

  closePause();
  for (const k of Object.keys(game.state.obj)) if (k.startsWith('tutorial:')) delete game.state.obj[k];
  if (origin === 'game' && ret) {
    game.state.set('tranca', ret.braid); game.state.brilho = ret.brilho;

    { label: 'Configurações', action: () => openSettings() },
    { label: 'Voltar a um lugar seguro', action: () => { closePause(); if (game.area?.toSafe?.()) game.ui.notify('De volta a um lugar seguro'); } },
    { label: 'Reiniciar área', action: () => { closePause(); game.scenes.restart(); } },
    { label: 'Salvar e voltar ao menu', action: () => backToTitle() },
  ], controls);
  refreshTouch();
}
// rever as cenas do final sem repetir o confronto: a cena roda de novo no lugar dela e a Lira volta para onde estava
function openReplays() {
  const controls = controlsHtml();
  const ok = !game.area?.cutscene && !game.ui.dialogOpen;
  game.ui.openPause([
    { label: 'O corte do cabelo', action: () => { closePause(); if (ok) startReplay('corte'); } },
    { label: 'O reencontro com os pais', action: () => { closePause(); if (ok) startReplay('reencontro'); } },
    { label: 'Os créditos', action: () => { closePause(); Epilogue.rollCredits(game); } },
    { label: 'Voltar', action: () => openPause() },
  ], controls, 'Rever cenas');
  refreshTouch();
}
function startReplay(kind) {
  const a = game.area;
  if (!a || game.replayRet) return;
  game.replayRet = { area: game.scenes.currentId, pos: a.safePos || { x: a.player.cx, y: a.player.feet, facing: a.player.facing } };
  Save.save(game);
  game.replay = kind;
  if (kind === 'corte') game.scenes.go('santuario', { pos: { x: 7300, y: 960, facing: 1 } });
  else game.scenes.go('reino', { pos: { x: 1500, y: 1200, facing: 1 } });
  game.ui.notify(kind === 'corte' ? 'Lembrança: o Terraço do Primeiro Sol' : 'Lembrança: a volta para Valdouro', 2.5);
}
game.endReplay = () => {
  const r = game.replayRet;
  game.replayRet = null; game.replay = null;
  if (!r) return;
  game.scenes.go(r.area, { pos: r.pos });
  game.ui.notify('De volta à exploração', 2);
};

// exploração livre: ir para qualquer região já visitada
function openTravel() {
  const controls = controlsHtml();
  const here = game.scenes.currentId;
  game.ui.openPause([
    ...Epilogue.travel(game).map((r) => ({
      label: r.nome + (r.id === here ? ' (você está aqui)' : ''),
      action: () => { closePause(); Save.save(game); game.scenes.go(r.area || r.id, { spawn: r.spawn }); game.ui.notify(EP.viagemPara(r.nome)); },
    })),
    { label: 'Voltar', action: () => openPause() },
  ], controls, EP.viagem);
  refreshTouch();
}
function closePause() {
  game.paused = false;
  game.ui.closePause();
  refreshTouch();
}

// ---------- Controles de toque visíveis só quando fazem sentido ----------
function refreshTouch() {
  const show = touchOn && game.started && !game.paused && panel.hidden && !game.cinematic && !game.credits;
  if (show !== game.touch.visible) game.touch.show(show);
  frame.classList.toggle('cinema', !!game.cinematic);
  game.touch.setMode(game.ui.dialogOpen ? 'dialogo' : 'jogo');
  game.touch.setShortHair(game.started && game.shortHair());
  game.touch.setBraided(game.state.flag('tranca'));
  game.ui.shortHair = game.started && game.shortHair();
}

// ---------- Salvar automaticamente ----------
let saveT = 0, lastArea = null;
function autosave(dt) {
  if (!game.started) return;
  const a = game.area;
  if (a !== lastArea && !game.scenes.busy) { lastArea = a; saveT = 9; }   // logo depois de trocar de área
  saveT += dt;
  if (saveT >= 10 && !game.ui.dialogOpen && !game.scenes.busy && !game.cinematic) { saveT = 0; Save.save(game); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.save(game); });
window.addEventListener('pagehide', () => Save.save(game));

// ---------- Laço do jogo ----------
function update(dt) {
  game.time += dt;
  const inp = game.input;
  if (!rotateEl.hidden) { inp.endFrame(); return; }
  if (!game.started) {
    if (panel.hidden) {
      if (inp.hit('down')) focusMenu(menuIndex + 1);
      if (inp.hit('up')) focusMenu(menuIndex - 1);
      if (inp.hit('confirm')) menuAction(menuBtns[menuIndex].dataset.act);
    } else if (inp.hit('pause')) closePanel();
    inp.endFrame();
    return;
  }
  if (!panel.hidden) {
    if (inp.hit('pause')) closePanel();
    inp.endFrame();
    return;
  }
  // créditos na tela: o jogo espera (Esc, Enter ou o botão pulam)
  if (game.credits) { skipBtn.hidden = true; Epilogue.updateCredits(game, dt); refreshTouch(); inp.endFrame(); return; }
  game.tutorial?.update(dt);
  Mysteries.tick(game, dt);
  Climax.tick(game, dt);
  Epilogue.tick(game, dt);
  skipBtn.hidden = !(game.scenes.current?.cutscene) || game.paused;
  if (inp.hit('pause') && game.scenes.current?.cutscene && !game.paused) { inp.consume('pause'); game.scenes.current.cutscene.skip(); }
  if (inp.hit('pause')) {
    const area = game.scenes.current;
    if (game.paused) closePause();
    else if (!area?.view && !game.cinematic) openPause();   // também durante conversas (antes a pausa ficava bloqueada)
    inp.consume('pause');
  }
  game.ui.update(dt);
  if (!game.paused) game.scenes.update(dt);
  refreshTouch();
  autosave(dt);
  inp.endFrame();
}

function render() {
  ctx.setTransform(game.pixelScale, 0, 0, game.pixelScale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (!game.started || !game.scenes.current) {
    drawForest(ctx, 0, 0, game.view.w, VIEW_H, Math.sin(game.time * 0.05) * 400, game.time, { zoom: 1.1, vfocus: 0.8 });
    drawTitleTower(ctx, game.time);
    return;
  }
  game.scenes.render(ctx, game.view.w, VIEW_H);
}

// Silhueta da torre na tela de título
function drawTitleTower(c, t) {
  c.save();
  const x = Math.round(game.view.w * 0.73), base = VIEW_H;
  c.fillStyle = '#5b4058';
  c.beginPath();
  c.moveTo(x - 46, base); c.lineTo(x - 40, 170); c.lineTo(x + 40, 170); c.lineTo(x + 46, base); c.fill();
  c.fillStyle = '#7a3f45';
  c.beginPath(); c.moveTo(x - 62, 176); c.lineTo(x, 70); c.lineTo(x + 62, 176); c.fill();
  c.fillStyle = '#ffd98a';
  c.beginPath(); c.arc(x, 220, 14, Math.PI, 0); c.lineTo(x + 14, 246); c.lineTo(x - 14, 246); c.fill();
  const g = c.createRadialGradient(x, 230, 0, x, 230, 60);
  g.addColorStop(0, `rgba(255,220,130,${0.35 + Math.sin(t * 2) * 0.08})`); g.addColorStop(1, 'rgba(255,210,120,0)');
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = g; c.fillRect(x - 60, 170, 120, 120);
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#5f8a4a';
  for (let i = 0; i < 14; i++) { c.beginPath(); c.ellipse(x - 40 + Math.sin(i) * 6, 300 + i * 18, 10, 6, i, 0, Math.PI * 2); c.fill(); }
  c.restore();
}

// aplicativo na tela inicial: só quando o jogo está no próprio endereço (no link de prévia, dentro de outra página, não há service worker)
(function registerPwa() {
  try {
    const top = window.top === window, okProto = location.protocol === 'https:' || location.hostname === 'localhost';
    if (top && okProto && 'serviceWorker' in navigator && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* sem service worker: o jogo funciona igual */ }
  // aberto pela tela inicial do iPhone: tela cheia de verdade
  game.standalone = !!(window.navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
  document.body.classList.toggle('standalone', game.standalone);
  // dica para instalar no iPhone (Safari, fora de outra página, ainda não instalado)
  try {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !game.standalone && window.top === window) {
      const tip = document.createElement('div'); tip.className = 'title-install';
      tip.textContent = 'Dica: no Safari, toque em Compartilhar e depois em "Adicionar à Tela de Início" para jogar em tela cheia, como um aplicativo.';
      document.getElementById('title').appendChild(tip);
    }
  } catch (e) { /* sem dica */ }
})();
applyConfig();
resize();
refreshMenu();
frame.classList.add('on-title');
new Loop(update, render).start();

// Acesso para testes automatizados
window.__game = game;
game.__debug = { Save, Quests, openPause, closePause, openSettings, closePanel, backToTitle };

return {  };
})();

</script>
